name: One-shot Ruff import order repair
on:
  push:
    branches: [fix/exp-snn-001-evidence-pipeline-20260916]
    paths: [.github/workflows/zz-ruff-import-fix-20260916.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/exp-snn-001-evidence-pipeline-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project tools
        run: |
          python -m pip install -e ".[dev,docs]"
      - name: Fix and verify import order
        run: |
          python -m ruff check --fix src/dashboard/server.py
          python -m black --check src/dashboard/server.py
          python -m ruff check src/dashboard/server.py
          python -m pytest -q tests/test_dashboard_operational_protocol_routes.py tests/test_exp_gen_0036_regressions.py
          git diff --check
      - name: Commit source fix only
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/dashboard/server.py
          git commit -m "Sort dashboard protocol registry import"
          git push origin HEAD:fix/exp-snn-001-evidence-pipeline-20260916

name: Temporary Part I edition regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependency
        run: python -m pip install PyYAML
      - name: Regenerate Edition 1.8
        run: python scripts/build_publication_edition.py --write
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git commit -m "chore(publication): regenerate edition 1.8 outputs"
          git push origin HEAD:${{ github.head_ref }}

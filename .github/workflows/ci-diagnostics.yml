name: CI Offline Diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/ci-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Preserve exact source and locked offline test tools
        run: |
          npm ci --ignore-scripts
          mkdir -p /tmp/ci-diagnostics/wheels
          tar -czf /tmp/ci-diagnostics/node-modules.tar.gz node_modules
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/ci-diagnostics/wheels pyright==1.1.414 ruff==0.16.7
          git bundle create /tmp/ci-diagnostics/source.bundle HEAD
          git rev-parse HEAD > /tmp/ci-diagnostics/source-sha.txt
          sha256sum /tmp/ci-diagnostics/source.bundle /tmp/ci-diagnostics/node-modules.tar.gz > /tmp/ci-diagnostics/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ci-offline-diagnostics-${{ github.sha }}
          path: /tmp/ci-diagnostics/
          retention-days: 3

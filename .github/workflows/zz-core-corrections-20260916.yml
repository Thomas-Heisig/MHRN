name: Temporary verified core corrections

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/neuron-rate-triplet-hooks-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/neuron-rate-triplet-hooks-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply reviewed core corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          neuron = "src/core/neuron.py"
          replace_once(
              neuron,
              "    target_rate_hz: float = 10.0\n    homeostasis_learning_rate: float = 0.001\n",
              "    target_rate_hz: float = 10.0\n    firing_rate_tau_ms: float = 1000.0\n    homeostasis_learning_rate: float = 0.001\n",
          )
          replace_once(
              neuron,
              "        if self.dt_ms <= 0.0:\n            raise ValueError(\"dt_ms must be > 0\")\n        if self.lif_tau_m_ms <= 0.0:\n",
              "        if self.dt_ms <= 0.0:\n            raise ValueError(\"dt_ms must be > 0\")\n        if self.firing_rate_tau_ms <= 0.0:\n            raise ValueError(\"firing_rate_tau_ms must be > 0\")\n        if self.lif_tau_m_ms <= 0.0:\n",
          )
          replace_once(
              neuron,
              "        if tick <= self._refractory_until_tick:\n            self.v = self._reset_potential()\n            self._finish_tick(tick)\n            return False\n",
              "        if tick <= self._refractory_until_tick:\n            self.v = self._reset_potential()\n            self._update_firing_rate(spiked=False, tick=tick)\n            self._finish_tick(tick)\n            return False\n",
          )
          replace_once(
              neuron,
              "            self.spike_counter += 1\n            self.last_spike_tick = tick\n            self._spike_count_window += 1\n",
              "            self.spike_counter += 1\n            self.last_spike_tick = tick\n",
          )
          replace_once(
              neuron,
              "            dt = tick - self._last_update_tick if self._last_update_tick > 0 else 1\n            self._update_firing_rate(dt)\n",
              "",
          )
          replace_once(
              neuron,
              "            if self.config.refractory_ticks > 0:\n                self._refractory_until_tick = tick + self.config.refractory_ticks\n        self._finish_tick(tick)\n",
              "            if self.config.refractory_ticks > 0:\n                self._refractory_until_tick = tick + self.config.refractory_ticks\n        self._update_firing_rate(spiked=spiked, tick=tick)\n        self._finish_tick(tick)\n",
          )
          replace_once(
              neuron,
              "    def _update_firing_rate(self, dt: int) -> None:\n        alpha = 1.0 / (10.0 + dt)\n        rate = self._spike_count_window / max(1, dt)\n        self.firing_rate_estimate = (\n            1.0 - alpha\n        ) * self.firing_rate_estimate + alpha * rate\n        if dt > 100:\n            self._spike_count_window = 0\n",
              "    def _update_firing_rate(self, *, spiked: bool, tick: int) -> None:\n        \"\"\"Update a low-pass firing-rate estimate in Hz once per simulated tick.\"\"\"\n        elapsed_ticks = (\n            max(1, tick - self._last_update_tick) if self._has_stepped else 1\n        )\n        elapsed_ms = elapsed_ticks * self.config.dt_ms\n        alpha = 1.0 - math.exp(-elapsed_ms / self.config.firing_rate_tau_ms)\n        instantaneous_rate_hz = 1000.0 / elapsed_ms if spiked else 0.0\n        self.firing_rate_estimate = (\n            (1.0 - alpha) * self.firing_rate_estimate\n            + alpha * instantaneous_rate_hz\n        )\n\n        window_ticks = max(1, int(round(1000.0 / self.config.dt_ms)))\n        if tick % window_ticks == 0:\n            self._spike_count_window = 0\n        if spiked:\n            self._spike_count_window += 1\n",
          )

          synapse = "src/core/synapse.py"
          replace_once(
              synapse,
              "    ``meta_state`` is stored on :class:`Synapse`; lower values bias the\n    pair-STDP kernel toward LTP and higher values bias it toward LTD. This is\n    an explicit engineering convention, not a biological claim.\n",
              "    ``meta_state`` is stored on :class:`Synapse`; lower values bias the\n    pair-STDP kernel toward LTP and higher values bias it toward LTD. This is\n    an explicit engineering convention, not a biological claim.\n\n    ``enable_triplet`` is a serialization-compatible reserved flag. A triplet\n    weight-update rule is not implemented yet, so plasticity operations fail\n    fast when the flag is enabled instead of silently behaving like pair-STDP.\n",
          )
          replace_once(
              synapse,
              "    def set_config(self, config: SynapseConfig) -> None:\n",
              "    def _require_supported_stdp_mode(self) -> None:\n        if self.config.enable_triplet:\n            raise NotImplementedError(\n                \"Triplet-STDP is reserved but not implemented; \"\n                \"disable enable_triplet or implement an explicit triplet rule\"\n            )\n\n    def set_config(self, config: SynapseConfig) -> None:\n",
          )
          replace_once(
              synapse,
              "    def record_pre_spike(self, tick: int) -> None:\n        \"\"\"Record a pre-spike and accumulate post-before-pre eligibility.\"\"\"\n        if self.last_post_spike >= 0 and tick > self.last_post_spike:\n",
              "    def record_pre_spike(self, tick: int) -> None:\n        \"\"\"Record a pre-spike and accumulate post-before-pre eligibility.\"\"\"\n        self._require_supported_stdp_mode()\n        if self.last_post_spike >= 0 and tick > self.last_post_spike:\n",
          )
          replace_once(
              synapse,
              "        self.last_pre_spike = tick\n        if self.config.enable_triplet:\n            self.pre_trace = 1.0\n        self.mark_dirty()\n",
              "        self.last_pre_spike = tick\n        self.mark_dirty()\n",
          )
          replace_once(
              synapse,
              "    def record_post_spike(self, tick: int) -> None:\n        \"\"\"Record a post-spike and accumulate pre-before-post eligibility.\"\"\"\n        if self.last_pre_spike >= 0 and tick > self.last_pre_spike:\n",
              "    def record_post_spike(self, tick: int) -> None:\n        \"\"\"Record a post-spike and accumulate pre-before-post eligibility.\"\"\"\n        self._require_supported_stdp_mode()\n        if self.last_pre_spike >= 0 and tick > self.last_pre_spike:\n",
          )
          replace_once(
              synapse,
              "        self.last_post_spike = tick\n        if self.config.enable_triplet:\n            self.post_trace = 1.0\n        self.mark_dirty()\n",
              "        self.last_post_spike = tick\n        self.mark_dirty()\n",
          )
          replace_once(
              synapse,
              "    def compute_stdp_update(self, dt: float) -> float:\n        \"\"\"Compute one bounded pair-STDP update for ``dt = post - pre``.\"\"\"\n        raw = self._timing_kernel(dt)\n",
              "    def compute_stdp_update(self, dt: float) -> float:\n        \"\"\"Compute one bounded pair-STDP update for ``dt = post - pre``.\"\"\"\n        self._require_supported_stdp_mode()\n        raw = self._timing_kernel(dt)\n",
          )

          network = "src/core/network.py"
          replace_once(network, "import random\nimport time\n", "import logging\nimport random\nimport time\n")
          replace_once(
              network,
              "# ============================================================================\n# Type Aliases\n",
              "_LOGGER = logging.getLogger(__name__)\n\n\n# ============================================================================\n# Type Aliases\n",
          )
          replace_once(
              network,
              "            except Exception:\n                pass  # Hook errors are logged elsewhere\n",
              "            except Exception:\n                _LOGGER.exception(\n                    \"Post-step hook failed at tick %s\", result.tick\n                )\n",
          )

          Path("tests/test_core_regressions_20260916.py").write_text(
              '''from __future__ import annotations\n\nimport logging\nimport random\n\nimport pytest\n\nfrom src.core.network import Brain5DConfig, NeuralNetwork\nfrom src.core.neuron import NeuronConfig, create_neuron\nfrom src.core.neuron_models import NeuronModel\nfrom src.core.synapse import Synapse, SynapseConfig\n\n\ndef test_firing_rate_estimate_is_hz_not_cumulative_spike_count() -> None:\n    config = NeuronConfig(\n        model=NeuronModel.LEAKY_INTEGRATE_AND_FIRE,\n        lif_resting_potential=-65.0,\n        lif_threshold=-64.0,\n        lif_reset=-65.0,\n        lif_tau_m_ms=20.0,\n        lif_resistance=1.0,\n        firing_rate_tau_ms=1000.0,\n        enable_threshold_adaptation=False,\n        enable_energy_dynamics=False,\n        enable_traces=False,\n        enable_homeostasis=False,\n    )\n    neuron = create_neuron(1, config=config)\n\n    for tick in range(5000):\n        current = 100.0 if tick % 100 == 0 else 0.0\n        neuron.step(current, tick)\n\n    assert neuron.spike_counter == 50\n    assert 9.0 <= neuron.firing_rate_estimate <= 11.0\n\n\ndef test_firing_rate_tau_must_be_positive() -> None:\n    with pytest.raises(ValueError, match=\"firing_rate_tau_ms\"):\n        NeuronConfig(firing_rate_tau_ms=0.0)\n\n\ndef test_triplet_mode_fails_fast_instead_of_silent_pair_stdp() -> None:\n    synapse = Synapse(target_id=2, weight=0.5, delay=1)\n    synapse.set_config(SynapseConfig(enable_triplet=True))\n\n    with pytest.raises(NotImplementedError, match=\"Triplet-STDP\"):\n        synapse.record_pre_spike(1)\n    assert synapse.last_pre_spike == -1\n\n    with pytest.raises(NotImplementedError, match=\"Triplet-STDP\"):\n        synapse.compute_stdp_update(10.0)\n\n\ndef test_post_step_hook_exception_is_logged(caplog: pytest.LogCaptureFixture) -> None:\n    network = NeuralNetwork(\n        Brain5DConfig(dimensions=(2, 2, 2, 2, 2)), random.Random(7)\n    )\n\n    def broken_hook(_result: object) -> None:\n        raise RuntimeError(\"hook boom\")\n\n    network.add_post_step_hook(broken_hook)\n    with caplog.at_level(logging.ERROR, logger=\"src.core.network\"):\n        result = network.step()\n\n    assert result.tick == 0\n    assert \"Post-step hook failed at tick 0\" in caplog.text\n    assert \"hook boom\" in caplog.text\n''',
              encoding="utf-8",
          )
          PY
      - name: Format and lint changed Python files
        run: |
          python -m black src/core/neuron.py src/core/synapse.py src/core/network.py tests/test_core_regressions_20260916.py
          python -m ruff check src/core/neuron.py src/core/synapse.py src/core/network.py tests/test_core_regressions_20260916.py
      - name: Run focused regression tests
        run: |
          python -m pytest tests/test_core_regressions_20260916.py tests/test_synapse_primitive.py -q
      - name: Commit verified corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-core-corrections-20260916.yml
          git config user.name 'Brain-5D core repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/neuron.py src/core/synapse.py src/core/network.py tests/test_core_regressions_20260916.py
          git commit -m 'fix: correct firing-rate and plasticity semantics'
          git push origin HEAD:fix/neuron-rate-triplet-hooks-20260916

name: Stage 6 reference contracts

on:
  push:
    branches: [feature/stage6-memory-world-model-20260914]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    if: github.ref == 'refs/heads/feature/stage6-memory-world-model-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install repository-pinned development tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Format declared Stage-6 Python sources only
        run: |
          python -m ruff check --select I --fix src/memory/prediction_metrics.py src/memory/world_model.py src/memory/layer.py src/experience/composition.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py
          python -m black src/memory/prediction_metrics.py src/memory/world_model.py src/memory/layer.py src/experience/composition.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py
          python -m ruff check src/memory/prediction_metrics.py src/memory/world_model.py src/memory/layer.py src/experience/composition.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py
      - name: Test Stage-6 contracts and existing integration paths
        run: >-
          python -m pytest -q
          tests/test_stage6_prediction_contract.py
          tests/test_stage6_memory_controls.py
          tests/test_memory_layer.py
          tests/test_experience_engine.py
          tests/test_cognition_operational_experiments.py
          tests/test_stage5_loop_contract.py
          tests/test_stage5_integration.py
          tests/test_stage5_integrated_nervous_system.py
          tests/test_stage5_frontend_contract.py
          tests/test_stage5_branch_integration.py
          tests/test_embodiment_safety.py
          tests/test_embodiment_lab.py
          tests/test_publication_scholar_reader.py
          --junitxml=stage6-results.xml
      - name: Verify frontend data contract and module syntax
        run: |
          node --version
          node --test tests/frontend/stage6-cognition-contract.test.mjs
          node --input-type=module --check < src/dashboard/static/frontend/modules/cognition.js
          node --input-type=module --check < src/dashboard/static/frontend/modules/cognition-contract.js
      - name: Verify source typing and whitespace
        run: |
          python -m mypy src/
          python -m pyright
          git diff --check
      - name: Commit only verified formatting on this development branch
        run: |
          git add src/memory/prediction_metrics.py src/memory/world_model.py src/memory/layer.py src/experience/composition.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(stage6): apply verified repository formatting'
            git push origin HEAD:feature/stage6-memory-world-model-20260914
          fi
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Reference-component verification only; no neural-memory or automatic EVID claim.' >> "$GITHUB_STEP_SUMMARY"

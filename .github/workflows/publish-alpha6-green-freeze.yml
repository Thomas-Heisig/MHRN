name: Publish Alpha.6 exact green source freeze

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha6-green-freeze.yml"

permissions:
  contents: write
  checks: read

concurrency:
  group: publish-v0.6.0-alpha.6-exact-freeze
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: f7fcca273099baf47fff26327c6e7468afd9ce79
      TAG: v0.6.0-alpha.6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact green source freeze
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "ci-status" "build" "docker"
            "tests (3.11)" "tests (3.12)" "tests (3.13)"
            "lint-format" "type-check" "security" "browser" "docs"
            "scientific-integrity"
            "empirical-data-integrity" "connectome-integrity" "integration"
          )
          payload="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100")"
          for name in "${required[@]}"; do
            conclusion="$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | last | .conclusion // empty' <<<"$payload")"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::$name is not successful for exact source freeze $SOURCE_SHA (conclusion=${conclusion:-missing})"
              exit 1
            fi
          done
          echo "Exact source freeze verified: $SOURCE_SHA"

      - name: Create immutable GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --tags origin
            tag_sha="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
            [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
              echo "::error::Existing $TAG resolves to $tag_sha instead of $SOURCE_SHA"
              exit 1
            }
            echo "$TAG already exists on the correct immutable source freeze."
          else
            gh release create "$TAG"               --target "$SOURCE_SHA"               --prerelease               --title "MHRN v0.6.0-alpha.6 — Open Science Distribution Alpha"               --notes-file docs/10-releases/RELEASE_NOTES_v060a6.md
          fi

      - name: Record release metadata on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B release-metadata origin/main
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          tag = os.environ["TAG"]
          path = Path("releases/current.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("version") != "0.6.0-alpha.6":
              raise SystemExit("releases/current.json is not alpha.6")
          data.update(
              status="released",
              gate="passed",
              date="2026-09-20",
              as_of="2026-09-20",
              tag=tag,
              commit=source_sha,
              source_freeze_commit=source_sha,
              publish_requested=False,
          )
          data["development_state"] = {
              "status": "released",
              "engineering": "released_from_exact_green_source_freeze",
              "summary": f"Alpha.6 was published from exact green source freeze {source_sha}.",
          }
          publication = data.setdefault("publication_state", {})
          publication.update(
              github_release="published",
              github_tag=tag,
              source_freeze_commit=source_sha,
              zenodo="awaiting_external_archive_verification",
              doi=None,
          )
          rendered = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          path.write_text(rendered, encoding="utf-8")
          Path("releases/v0.6.0-alpha.6.json").write_text(rendered, encoding="utf-8")
          PY
          git config user.name "MHRN release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/current.json releases/v0.6.0-alpha.6.json
          if git diff --cached --quiet; then
            echo "Release metadata already recorded."
            exit 0
          fi
          git diff --cached --check
          git commit -m "release: record v0.6.0-alpha.6 publication"
          git push origin HEAD:main

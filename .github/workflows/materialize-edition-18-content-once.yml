name: Materialize Edition 1.8 content once

on:
  push:
    branches: ["docs/edition-1-8-content-integration"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-edition-18-content
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Rebuild Edition 1.8
        run: python scripts/build_publication_edition.py --write
      - name: Verify deterministic rebuild
        run: python scripts/build_publication_edition.py --check
      - name: Verify scientific integrity
        run: python scripts/check_scientific_maturity_integrity.py
      - name: Verify document governance
        run: python scripts/audit_document_governance.py
      - name: Run publication regression tests
        run: python -m pytest tests/test_publication_edition.py tests/test_publication_reader.py tests/test_publication_scholar_reader.py tests/test_publication_integration.py -q
      - name: Commit generated publication outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "docs(publication): materialize expanded edition 1.8 manuscript"
            git push
          fi

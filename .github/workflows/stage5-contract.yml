name: Stage 5 contract

on:
  push:
    branches: [main, feature/stage5-integrated-nervous-system-20260914]
  pull_request:
    branches: [main]
    paths:
      - src/embodiment/**
      - src/experience/**
      - src/dashboard/static/frontend/**
      - tests/test_stage5_*.py
      - .github/workflows/stage5-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install runtime and scoped validation tools
        run: python -m pip install -e . pytest black==26.5.1 ruff==0.16.7
      - name: Verify both Stage-5 branches and reader regressions
        run: >-
          python -m pytest -q
          tests/test_stage5_loop_contract.py
          tests/test_stage5_integration.py
          tests/test_stage5_integrated_nervous_system.py
          tests/test_stage5_frontend_contract.py
          tests/test_stage5_branch_integration.py
          tests/test_embodiment_safety.py
          tests/test_experience_engine.py
          tests/test_memory_layer.py
          tests/test_embodiment_lab.py
          tests/test_interoception.py
          tests/test_publication_scholar_reader.py
          --junitxml=stage5-results.xml
      - name: Check combined Python sources
        run: |
          python -m black --check src/embodiment/loop_contract.py src/embodiment/controlled.py src/embodiment/integrated_nervous_system.py src/experience/engine.py tests/test_stage5_*.py scripts/run_stage5_reference.py scripts/apply_stage5_timeline.py
          python -m ruff check src/embodiment/loop_contract.py src/embodiment/controlled.py src/embodiment/integrated_nervous_system.py src/experience/engine.py tests/test_stage5_*.py scripts/run_stage5_reference.py scripts/apply_stage5_timeline.py
          git diff --check
      - name: Publish verification context
        if: always()
        run: |
          echo '### Combined Stage 5 engineering contract' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Both branches and current reader regressions; no automatic DATA-to-EVID promotion.' >> "$GITHUB_STEP_SUMMARY"

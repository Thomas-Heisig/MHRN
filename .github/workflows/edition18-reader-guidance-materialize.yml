name: Edition 1.8 reader guidance materialize
on:
  push:
    branches:
      - research/edition18-reader-paths-offshoots-20260918
    paths:
      - .github/workflows/edition18-reader-guidance-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/edition18-reader-paths-offshoots-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project validation dependencies
        run: python -m pip install -e '.[dev,docs]'
      - name: Verify source bindings
        run: python -m pytest -q tests/test_learning_preparation.py
      - name: Materialize current Edition 1.8
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/build_publication_edition.py --check
          python -m pytest -q tests/test_publication_edition.py
      - name: Commit deterministic publication outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(publication): materialize reader paths and research offshoots"
          git push origin HEAD:research/edition18-reader-paths-offshoots-20260918

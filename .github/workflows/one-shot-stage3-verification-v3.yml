name: One-shot Stage-3 verification v3

on:
  push:
    branches: [feature/stage3-plastic-neural-tissue]
    paths: [.github/workflows/one-shot-stage3-verification-v3.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/stage3-plastic-neural-tissue
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Normalize new Stage 3 source formatting
        run: |
          python -m black scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py
            git diff --cached --check
            git commit -m "style: normalize Stage 3 verification sources"
            git push origin HEAD:feature/stage3-plastic-neural-tissue
          fi
      - name: Stage 3 source quality
        run: |
          python -m black --check scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py src/dashboard/development_timeline.py src/version.py src/profiles/service.py
          python -m ruff check scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py src/dashboard/development_timeline.py src/version.py src/profiles/service.py
          python -m mypy src/
          python -m pyright scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py src/dashboard/development_timeline.py src/version.py
          python -m pylint --disable=all --enable=E,F --fail-under=9.0 src
          git diff --check
      - name: Stage 2 closure regression
        run: python -m pytest tests/test_recurrent_snn_contract.py tests/test_recurrent_snn_timeline.py -q
      - name: Stage 3 mechanism and control suites
        # This unit suite is valid both before and after the generated Stage-3 artifact exists.
        run: |
          python -m pytest \
            tests/test_stdp_integration.py \
            tests/test_reward.py \
            tests/test_learning_experiment.py \
            tests/test_homeostasis_engine.py \
            tests/test_structural_e2e.py \
            tests/test_structural_determinism.py \
            tests/test_checkpoint_v4.py \
            tests/test_stage3_plastic_neural_tissue.py \
            -q
      - name: Run Stage 3 engineering reference experiment
        run: python scripts/run_stage3_reference.py
      - name: Validate reference and timeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.dashboard.development_timeline import build_development_timeline

          root = Path.cwd()
          path = root / 'research/generated/verification/plastic_neural_tissue_reference.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'verified', data
          assert all(data['proofs'].values()), data['proofs']
          assert data['software_version'] == '0.6.0a2'
          assert data['scientific_promotion']['automatic_evidence_promotion'] is False

          timeline = build_development_timeline(root)
          stages = {stage['id']: stage for stage in timeline['stages']}
          stage2 = stages['recurrent_snn']
          stage3 = stages['plastic_neural_tissue']
          assert stage2['implementation_score'] == 1.0
          assert stage2['status'] == 'reached'
          assert stage3['implementation_score'] == 1.0
          assert stage3['status'] == 'reached'
          assert stage3['research_readiness_score'] < 1.0
          print(json.dumps({
              'stage2': {
                  'implementation': stage2['implementation_score'],
                  'verification': stage2['verification_score'],
                  'status': stage2['status'],
              },
              'stage3': {
                  'implementation': stage3['implementation_score'],
                  'verification': stage3['verification_score'],
                  'research_readiness': stage3['research_readiness_score'],
                  'status': stage3['status'],
              },
              'conditions': data['conditions'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit verified Stage 3 artifact
        run: |
          git add research/generated/verification/plastic_neural_tissue_reference.json
          git diff --cached --check
          git commit -m "test: publish Stage 3 plasticity verification artifact"
          git push origin HEAD:feature/stage3-plastic-neural-tissue
      - name: Full test suite and source-bound baseline
        run: python scripts/generate_baseline.py
      - name: Finalize baseline and remove one-shot workflows
        run: |
          rm -f .github/workflows/one-shot-stage3-verification.yml
          rm -f .github/workflows/one-shot-stage3-verification-v2.yml
          rm -f .github/workflows/one-shot-stage3-verification-v3.yml
          git add tests/test_baseline.json .github/workflows/one-shot-stage3-verification.yml .github/workflows/one-shot-stage3-verification-v2.yml .github/workflows/one-shot-stage3-verification-v3.yml
          git diff --cached --check
          git commit -m "test: refresh full-suite baseline for Stage 3"
          git push origin HEAD:feature/stage3-plastic-neural-tissue

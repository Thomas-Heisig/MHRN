name: Black diff diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_snn004_stdp_asym_r2.py
      - scripts/sync_main.py
      - .github/workflows/black-diff-diagnostic.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.5.1
      - run: python -m black --diff scripts/run_snn004_stdp_asym_r2.py scripts/sync_main.py

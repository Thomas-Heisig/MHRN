name: Stage 6 neural world model

on:
  push:
    branches: [feature/stage6-neural-world-model-registry-20260915]
    paths:
      - src/memory/spiking_world_model.py
      - tests/test_spiking_world_model.py
      - src/research/stage6_neural_world_model_experiment.py
      - tests/test_stage6_neural_world_model_experiment.py
      - src/research/protocol_registry.py
      - tests/test_protocol_registry.py
      - .github/workflows/stage6-neural-world-model.yml

permissions:
  contents: read

jobs:
  stage6-neural-world-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Neural world-model regressions
        run: >-
          python -m pytest -q
          tests/test_spiking_world_model.py
          tests/test_multistep_world_model.py
          tests/test_world_model_evaluation.py
      - name: Formatting and lint
        run: |
          python -m black --check src/memory/spiking_world_model.py tests/test_spiking_world_model.py
          python -m ruff check src/memory/spiking_world_model.py tests/test_spiking_world_model.py
      - name: Strict typing
        run: |
          python -m mypy src/memory/spiking_world_model.py
          python -m pyright src/memory/spiking_world_model.py

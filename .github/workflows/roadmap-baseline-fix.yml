name: One-shot roadmap baseline alignment

on:
  push:
    branches:
      - fix/main-ci-version-cl003-20260916
    paths:
      - .github/workflows/roadmap-baseline-fix.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-ci-version-cl003-20260916
          fetch-depth: 0
      - name: Align canonical roadmap baselines
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("docs/08-roadmap/TODO.md", "docs/08-roadmap/ROADMAP.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              old = "**Baseline:** `mhrn-core 0.6.0a3`"
              new = "**Baseline:** `mhrn-core 0.6.0a5`"
              if old not in text:
                  raise SystemExit(f"expected baseline not found in {name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/roadmap-baseline-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/08-roadmap/TODO.md docs/08-roadmap/ROADMAP.md .github/workflows/roadmap-baseline-fix.yml
          git commit -m "docs: align roadmap baseline with alpha.5"
          git push

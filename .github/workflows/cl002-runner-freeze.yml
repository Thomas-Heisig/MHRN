name: CL-002 Runner Freeze

on:
  push:
    branches:
      - research/exp-s6-sem-cl-002-runner-freeze-20260915
    paths-ignore:
      - research/preregistrations/frozen/EXP-S6-SEM-CL-002-FREEZE.json
  pull_request:
    branches:
      - main
    paths:
      - src/research/continual_semantization_controls.py
      - scripts/run_semantization_split_mnist_cl002.py
      - scripts/generate_cl002_freeze_manifest.py
      - tests/test_continual_semantization_controls.py
      - research/preregistrations/**

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Normalize frozen Python sources
        run: |
          python -m black src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py
          python -m ruff check --fix src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py
      - name: Synthetic CL-002 tests only
        run: >-
          python -m pytest -q
          tests/test_continual_semantization_controls.py
          tests/test_semantic_memory.py
          tests/test_episodic_replay.py
      - name: Confirm empirical execution is blocked
        run: |
          test ! -f research/preregistrations/authorizations/EXP-S6-SEM-CL-002.json
          if python scripts/run_semantization_split_mnist_cl002.py --output /tmp/forbidden-cl002; then
            echo "CL-002 unexpectedly executed without authorization" >&2
            exit 1
          fi
      - name: Generate SHA-256 freeze manifest
        run: python scripts/generate_cl002_freeze_manifest.py
      - name: Verify formatting and lint for frozen code
        run: |
          python -m black --check src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py
          python -m ruff check src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py
      - name: Commit normalized sources and freeze manifest on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py research/preregistrations/frozen/EXP-S6-SEM-CL-002-FREEZE.json; then
            echo "Frozen sources and manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/continual_semantization_controls.py scripts/run_semantization_split_mnist_cl002.py scripts/generate_cl002_freeze_manifest.py tests/test_continual_semantization_controls.py research/preregistrations/frozen/EXP-S6-SEM-CL-002-FREEZE.json
          git commit -m "research: normalize and freeze CL-002 sources"
          git push

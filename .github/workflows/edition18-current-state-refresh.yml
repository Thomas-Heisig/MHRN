name: Edition 1.8 current-state refresh
on:
  push:
    branches:
      - docs/edition-1-8-current-state-20260918
    paths:
      - research/publications/2026-09-17_recursive-epistemics_v1.8/parts/11_open_landscape.md

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev,docs]"
      - name: Rebuild Edition 1.8
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/build_publication_edition.py --check
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(publication): refresh Edition 1.8 current scientific state"
          git push

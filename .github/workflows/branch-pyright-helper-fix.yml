name: Fix Branch Pyright Repair Helper

on:
  push:
    branches:
      - fix/neural-primitives-fullstack
    paths:
      - .github/workflows/branch-pyright-helper-fix.yml

permissions:
  contents: write

jobs:
  fix-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/neural-primitives-fullstack
          fetch-depth: 0
      - name: Fix incremental-runtime cast import handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/branch-pyright-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = "          ensure_cast_import('src/storage/incremental_runtime.py')"
          new = """          text = read('src/storage/incremental_runtime.py')
          if 'from typing import cast' not in text:
              text = text.replace('from collections.abc import MutableSet', 'from collections.abc import MutableSet\\nfrom typing import cast', 1)
              write('src/storage/incremental_runtime.py', text)"""
          if old not in text:
              raise SystemExit('expected helper snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/branch-pyright-repair.yml
          git commit -m "chore: fix temporary pyright repair helper"
          git push origin HEAD:fix/neural-primitives-fullstack

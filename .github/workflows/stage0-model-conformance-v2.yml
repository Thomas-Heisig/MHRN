name: Stage-0 model conformance v2 diagnostic

on:
  push:
    branches:
      - science/stage0-model-conformance-v2-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install empirical baseline
        run: python -m pip install -e '.[empirical]'
      - name: Run phase/model diagnostic
        run: python scripts/stage0_phase_model_diagnostic.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage0-phase-model-diagnostic
          path: stage0-phase-model-diagnostic.json
          retention-days: 30

name: Persist CL-003 DATA and sync alpha4 docs

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cl003-persist-data-20260916.yml

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: github.head_ref == 'research/exp-s6-sem-cl-003-execution-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35080329458'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Download immutable CL-003 artifact
        run: |
          mkdir -p /tmp/cl003
          gh run download "$SOURCE_RUN_ID" -n EXP-S6-SEM-CL-003-DATA -D /tmp/cl003
          test -f /tmp/cl003/results/results.json
          test -f /tmp/cl003/results/REPORT.md
          echo '4e74021c0ef838371a3a01061ae1c2dcebb2031b54c15c6169e38c1972d06290  /tmp/cl003/results/results.json' | sha256sum -c -
      - name: Persist raw DATA and machine report
        run: |
          out=research/experiments/EXP-S6-SEM-CL-003/results
          mkdir -p "$out"
          cp /tmp/cl003/results/results.json "$out/results.json"
          cp /tmp/cl003/results/REPORT.md "$out/REPORT.md"
          cp /tmp/cl003/runner-summary.json "$out/runner-summary.json"
          cp /tmp/cl003/SHA256SUMS.txt "$out/SOURCE_ARTIFACT_SHA256SUMS.txt"
          cp /tmp/cl003/authorization-snapshot.json "$out/authorization-at-execution.json"
          cp /tmp/cl003/freeze-snapshot.json "$out/freeze-at-execution.json"
          cp /tmp/cl003/execution-commit.txt "$out/execution-commit.txt"
          cat > "$out/EXECUTION_PROVENANCE.json" <<'JSON'
          {
            "experiment_id": "EXP-S6-SEM-CL-003",
            "execution_date": "2026-09-16",
            "github_actions_run_id": 35080329458,
            "artifact_id": 10439654162,
            "artifact_digest": "sha256:a48b90a430b52038d2dd3c44d76c90805cce4d6d9c4e98a22d90001c7cc2efd9",
            "results_json_sha256": "4e74021c0ef838371a3a01061ae1c2dcebb2031b54c15c6169e38c1972d06290",
            "automatic_evidence_promotion": false,
            "human_review_required": true,
            "status": "data_persisted_pending_human_review"
          }
          JSON
      - name: Mark authorization as executed without EVID promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/preregistrations/authorizations/EXP-S6-SEM-CL-003.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['status'] = 'executed_data_pending_human_review'
          d['first_empirical_run_has_occurred'] = True
          d['execution_date'] = '2026-09-16'
          d['execution_commit'] = 'd299483df4c4975414cd3a0ec866f91d7b1a08c1'
          d['execution_workflow_run_id'] = 35080329458
          d['results_path'] = 'research/experiments/EXP-S6-SEM-CL-003/results/results.json'
          d['results_sha256'] = '4e74021c0ef838371a3a01061ae1c2dcebb2031b54c15c6169e38c1972d06290'
          d['automatic_evidence_promotion'] = False
          d['human_review_required'] = True
          p.write_text(json.dumps(d, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Synchronize alpha.4 visible documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new)
                  p.write_text(text, encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'missing replacement in {path}: {old}')

          replace('docs/08-roadmap/TODO.md', '`mhrn-core 0.6.0a3`', '`mhrn-core 0.6.0a4`')
          replace('docs/08-roadmap/ROADMAP.md', '`mhrn-core 0.6.0a3`', '`mhrn-core 0.6.0a4`')
          replace('README.md', 'version-0.6.0a3-orange.svg', 'version-0.6.0a4-orange.svg')
          replace('README.md', '`mhrn-core 0.6.0a3` / `0.6.0-alpha.3`', '`mhrn-core 0.6.0a4` / `0.6.0-alpha.4`')
          replace('README.md', '## Current state — 15 September 2026', '## Current state — 16 September 2026')
          replace('README.md', 'version = {0.6.0a3}', 'version = {0.6.0a4}')
          replace('HF_README.md', 'version = {0.6.0a3}', 'version = {0.6.0a4}')
          replace('research/publications/2026-09-15_recursive-epistemics_v1.7/README.md', '**Softwarelinie:** MHRN 0.6.0-alpha.3', '**Softwarelinie:** MHRN 0.6.0-alpha.4')

          edition = Path('research/publications/2026-09-15_recursive-epistemics_v1.7/README.md')
          edition.write_text(edition.read_text(encoding='utf-8').replace('**Softwarelinie:** MHRN 0.6.0-alpha.4  \n', '**Softwarelinie:** MHRN 0.6.0-alpha.4\n'), encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**`EXP-S6-SEM-CL-003`** has its runner, freeze manifest and dose-response preparation integrated, but it has **not** been executed as a new confirmatory experiment and creates no new EVID by its mere presence.', '**`EXP-S6-SEM-CL-003`** was executed on 16 September 2026 under its frozen authorization. The persisted machine result is `H1_negative_H2_negative`; DATA remain pending Human Review and are not EVID.')
          p.write_text(text, encoding='utf-8')

          c = Path('CHANGELOG.md')
          text = c.read_text(encoding='utf-8')
          entry = '## 0.6.0-alpha.4 - 2026-09-16\n\nResearch-driven development becomes the canonical MHRN workflow. RQ and Claim status are separated, CL-002/CL-003 freeze gates are authorization-aware, CL-003 was executed once under its frozen protocol, and its DATA remain pending Human Review without automatic EVID promotion.\n\n'
          if entry not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
              c.write_text(text, encoding='utf-8')
          PY
      - name: Commit only DATA, authorization status and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/experiments/EXP-S6-SEM-CL-003/results \
            research/preregistrations/authorizations/EXP-S6-SEM-CL-003.json \
            docs/08-roadmap/TODO.md docs/08-roadmap/ROADMAP.md \
            README.md HF_README.md CHANGELOG.md \
            research/publications/2026-09-15_recursive-epistemics_v1.7/README.md
          git diff --cached --check
          git commit -m "research: persist CL-003 DATA and sync alpha.4 documentation"
          git push

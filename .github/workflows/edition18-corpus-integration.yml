name: Edition 1.8 corpus integration

on:
  push:
    branches:
      - docs/edition-1-8-corpus-integration

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Integrate corpus into Edition 1.8 sources
        run: |
          python scripts/one_shot_integrate_edition18_corpus.py
          python scripts/one_shot_integrate_edition18_decisions.py
      - name: Materialize canonical Edition 1.8 outputs
        run: python scripts/build_publication_edition.py --write
      - name: Verify deterministic publication build
        run: python scripts/build_publication_edition.py --check
      - name: Run publication regression tests
        run: pytest -q tests/test_publication_edition.py tests/test_publication_v17_document_governance.py tests/test_empirical_publication.py
      - name: Commit integrated publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/publications/2026-09-17_recursive-epistemics_v1.8 research/document_governance_overrides.json scripts/build_publication_edition.py tests/test_publication_edition.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'docs(publication): integrate full prior-work corpus into edition 1.8'
          git push

name: Stage1 Publication Refresh

on:
  push:
    branches:
      - research/stage1-maturity-consolidation-20260925
    paths:
      - research/publications/2026-09-17_recursive-epistemics_v1.8/**
      - research/registry/**
      - .github/workflows/stage1-publication-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/stage1-maturity-consolidation-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev,docs]'
      - name: Regenerate deterministic publication outputs
        run: python scripts/build_publication_edition.py --write
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          rm .github/workflows/stage1-publication-refresh.yml
          git add research/publications/2026-09-17_recursive-epistemics_v1.8 .github/workflows/stage1-publication-refresh.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publication: regenerate deterministic Stage-1 edition outputs"
          git push origin HEAD:research/stage1-maturity-consolidation-20260925

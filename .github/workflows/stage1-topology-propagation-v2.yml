name: Stage-1 topology propagation v2

on:
  push:
    branches:
      - experiment/stage1-topology-propagation-v2-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage1-v2-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify Stage-1 software contract
        run: python -m pytest tests/test_small_snn_contract.py -q

      - name: Execute preregistered topology v2
        run: python scripts/run_stage1_topology_v2.py

      - name: Verify generated DATA
        run: python scripts/verify_stage1_topology_v2.py

      - name: Commit immutable experiment DATA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/experiments/EXP-S1-TOPO-V2-20260918
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(stage1): record topology propagation v2 data [stage1-v2-data]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage1-topology-propagation-v2
          path: research/experiments/EXP-S1-TOPO-V2-20260918
          retention-days: 90

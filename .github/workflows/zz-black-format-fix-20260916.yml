name: One-shot Black format repair
on:
  push:
    branches: [fix/exp-snn-001-evidence-pipeline-20260916]
    paths: [.github/workflows/zz-black-format-fix-20260916.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/exp-snn-001-evidence-pipeline-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - name: Format exactly the CI-reported files
        run: |
          python -m black src/dashboard/server.py tests/test_exp_gen_0036_regressions.py
          python -m black --check src tests scripts
          git diff --check
      - name: Commit source formatting only
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/dashboard/server.py tests/test_exp_gen_0036_regressions.py
          git commit -m "Format dashboard routing regressions"
          git push origin HEAD:fix/exp-snn-001-evidence-pipeline-20260916

name: Phase 0 Technical Gate Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase0-technical-gate-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/research-driven-experiment-workflow-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project tools
        run: python -m pip install -e '.[dev]'
      - name: Apply behavior-neutral typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/research/continual_semantization.py')
          text = path.read_text(encoding='utf-8')
          old = '    mature = semantic.mature_concepts if condition == "semantic_replay" else ()\n'
          new = '    mature = semantic.mature_concepts if condition == "semantic_replay" else []\n'
          if old not in text:
              raise SystemExit('continual_semantization target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/research/continual_semantization_controls.py')
          text = path.read_text(encoding='utf-8')
          old = 'from typing import Any, Sequence\n'
          new = 'from typing import Any, Sequence, cast\n'
          if old not in text:
              raise SystemExit('controls import target not found')
          text = text.replace(old, new, 1)
          old = 'def load_preregistration(path: Path) -> dict[str, Any]:\n    return json.loads(path.read_text(encoding="utf-8"))\n'
          new = 'def load_preregistration(path: Path) -> dict[str, Any]:\n    return cast(dict[str, Any], json.loads(path.read_text(encoding="utf-8")))\n'
          if old not in text:
              raise SystemExit('controls json target not found')
          text = text.replace(old, new, 1)
          old = '''        history = [\n            float(row[task_index])\n            for row in rows[task_index:]\n            if row[task_index] is not None\n        ]\n'''
          new = '''        history: list[float] = []\n        for row in rows[task_index:]:\n            value = row[task_index]\n            if value is not None:\n                history.append(float(value))\n'''
          if old not in text:
              raise SystemExit('controls metrics target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/research/continual_semantization_dose.py')
          text = path.read_text(encoding='utf-8')
          old = '''        history = [\n            float(row[task_index])\n            for row in rows[task_index:]\n            if row[task_index] is not None\n        ]\n'''
          new = '''        history: list[float] = []\n        for row in rows[task_index:]:\n            value = row[task_index]\n            if value is not None:\n                history.append(float(value))\n'''
          if old not in text:
              raise SystemExit('dose metrics target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Normalize formatting
        run: python -m black src/research/continual_semantization.py src/research/continual_semantization_controls.py src/research/continual_semantization_dose.py tests/test_safety_research_program.py
      - name: Run full source type gate
        run: python -m mypy src
      - name: Run CL-003 synthetic gate
        run: >-
          python -m pytest -q
          tests/test_continual_semantization_dose.py
          tests/test_continual_semantization_controls.py
          tests/test_semantic_memory.py
      - name: Regenerate CL-003 SHA-256 freeze
        run: python scripts/generate_cl003_freeze_manifest.py
      - name: Verify formatting
        run: python -m black --check src tests scripts
      - name: Commit repaired gate state and re-freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/research/continual_semantization.py \
            src/research/continual_semantization_controls.py \
            src/research/continual_semantization_dose.py \
            tests/test_safety_research_program.py \
            research/preregistrations/frozen/EXP-S6-SEM-CL-003-FREEZE.json
          git diff --cached --check
          git commit -m "ci: repair pre-execution typing gates and re-freeze CL-003"
          git push

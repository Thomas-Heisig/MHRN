name: Apply deterministic semantic patch

on:
  push:
    branches:
      - fix/determinism-airr-semantic-gating-20260917

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded patch
        run: python tmp/apply_determinism_semantic_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused scientific contract tests
        run: |
          python -m pytest -q \
            tests/test_determinism_semantic_contracts.py \
            tests/test_airr_semantic_gating.py \
            tests/test_airr_pipeline.py \
            tests/test_scientific_execution_contract.py
      - name: Remove one-shot patch machinery
        run: |
          rm tmp/apply_determinism_semantic_patch.py
          rm .github/workflows/apply-determinism-semantic-patch.yml
          sed -i 's/[[:space:]]*$//' research/decisions/2026-09-17_determinism_registry_airr_alignment.md
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(research): align determinism semantics and AIRR confidence gating'
          git push origin HEAD:fix/determinism-airr-semantic-gating-20260917

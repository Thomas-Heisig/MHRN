name: CL-003 authorized empirical execution 2026-09-16

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cl003-execute-once-20260916.yml

permissions:
  contents: read

jobs:
  execute:
    if: github.head_ref == 'research/exp-s6-sem-cl-003-execution-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install MHRN
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen CL-003 synthetic gate
        run: >-
          python -m pytest -q
          tests/test_continual_semantization_dose.py
          tests/test_continual_semantization_controls.py
          tests/test_semantic_memory.py
      - name: Execute complete preregistered CL-003 campaign
        run: |
          mkdir -p cl003-artifact
          python scripts/run_semantization_split_mnist_cl003.py \
            --output cl003-artifact/results \
            --cache .cache/mnist \
            | tee cl003-artifact/runner-summary.json
          git rev-parse HEAD > cl003-artifact/execution-commit.txt
          python - <<'PY'
          import json
          from pathlib import Path
          auth = json.loads(Path('research/preregistrations/authorizations/EXP-S6-SEM-CL-003.json').read_text())
          freeze = json.loads(Path('research/preregistrations/frozen/EXP-S6-SEM-CL-003-FREEZE.json').read_text())
          Path('cl003-artifact/authorization-snapshot.json').write_text(json.dumps(auth, indent=2) + '\n')
          Path('cl003-artifact/freeze-snapshot.json').write_text(json.dumps(freeze, indent=2) + '\n')
          PY
          find cl003-artifact -type f -print0 | sort -z | xargs -0 sha256sum > cl003-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: EXP-S6-SEM-CL-003-DATA
          path: cl003-artifact
          retention-days: 30

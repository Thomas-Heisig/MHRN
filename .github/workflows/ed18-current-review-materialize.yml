name: Edition 1.8 current review materialize

on:
  push:
    branches:
      - docs/edition-1-8-current-reviews-20260918

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[dev,docs]'
      - name: Build and verify Edition 1.8
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/build_publication_edition.py --check
          python scripts/check_scientific_maturity_integrity.py
          python scripts/audit_document_governance.py --strict-review
          python -m pytest -q tests/test_publication_edition.py
      - name: Commit generated publication outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'docs(publication): materialize current reviews into Edition 1.8'
          git push

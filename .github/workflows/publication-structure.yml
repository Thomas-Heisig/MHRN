name: Publication structure

on:
  push:
    branches: [main, "docs/edition-1-8-modular"]
    paths:
      - "research/publications/**"
      - "research/registry/**"
      - "scripts/*publication*.py"
      - "tests/test_publication_edition.py"
      - "project_identity.json"
      - ".github/workflows/publication-structure.yml"
  pull_request:
    paths:
      - "research/publications/**"
      - "research/registry/**"
      - "scripts/*publication*.py"
      - "tests/test_publication_edition.py"
      - "project_identity.json"
      - ".github/workflows/publication-structure.yml"

permissions:
  contents: write

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Temporary deterministic regeneration for RQ-ETH-001
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/build_publication_edition.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if ! git diff --cached --quiet; then
            git commit -m "chore(publication): regenerate edition 1.8 outputs"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify deterministic edition build
        run: python scripts/build_publication_edition.py --check
      - name: Verify scientific integrity contract
        run: python scripts/check_scientific_maturity_integrity.py
      - name: Verify document governance
        run: python scripts/audit_document_governance.py
      - name: Run publication regression tests
        run: python -m pytest tests/test_publication_edition.py tests/test_publication_reader.py tests/test_publication_scholar_reader.py tests/test_publication_integration.py -q

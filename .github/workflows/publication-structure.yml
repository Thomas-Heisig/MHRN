name: Publication structure

on:
  push:
    branches: [main, "docs/edition-1-8-modular"]
    paths:
      - "research/publications/**"
      - "research/registry/**"
      - "scripts/*publication*.py"
      - "tests/test_publication_edition.py"
      - "project_identity.json"
      - ".github/workflows/publication-structure.yml"
  pull_request:
    paths:
      - "research/publications/**"
      - "research/registry/**"
      - "scripts/*publication*.py"
      - "tests/test_publication_edition.py"
      - "project_identity.json"
      - ".github/workflows/publication-structure.yml"

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs/edition-1-8-modular'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Activate, format and generate edition 1.8
        run: |
          python scripts/activate_publication_18.py
          python -m black scripts/build_publication_edition.py scripts/activate_publication_18.py tests/test_publication_edition.py
          python -m ruff check scripts/build_publication_edition.py scripts/activate_publication_18.py tests/test_publication_edition.py --fix
          python -m black scripts/build_publication_edition.py scripts/activate_publication_18.py tests/test_publication_edition.py
          python scripts/build_publication_edition.py --write
          python scripts/audit_document_governance.py --write
      - name: Verify before committing generated outputs
        run: |
          python scripts/build_publication_edition.py --check
          python scripts/check_scientific_maturity_integrity.py
          python -m pytest tests/test_publication_edition.py tests/test_publication_reader.py tests/test_publication_scholar_reader.py tests/test_publication_integration.py -q
      - name: Commit materialized publication
        run: |
          git add research/publications/2026-09-17_recursive-epistemics_v1.8 research/publications/catalog.json research/publications/CURRENT.md research/publications/README.md project_identity.json README.md docs/README.md research/README.md docs/08-roadmap/V2_PUBLICATION_STRUCTURE_MIGRATION.md research/document_governance_overrides.json docs/DOCUMENT_CATALOG.json research/RESEARCH_CATALOG.json scripts/build_publication_edition.py scripts/activate_publication_18.py scripts/check_scientific_maturity_integrity.py tests/test_publication_edition.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(publication): materialize and validate modular edition 1.8'
            git push origin HEAD:docs/edition-1-8-modular
          fi
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_publication_edition.py --check
      - run: python scripts/check_scientific_maturity_integrity.py
      - run: python scripts/audit_document_governance.py
      - run: python -m pytest tests/test_publication_edition.py tests/test_publication_reader.py tests/test_publication_scholar_reader.py tests/test_publication_integration.py -q

name: Stage 5 reviewed integration repair

on:
  push:
    branches: [feature/stage5-integrated-nervous-system-20260914]
    paths:
      - .maintenance/repair_stage5_integration.py
      - .github/workflows/stage5-integration-repair.yml

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/feature/stage5-integrated-nervous-system-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned repository validation tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Apply only reviewed integration repairs
        run: python .maintenance/repair_stage5_integration.py
      - name: Verify combined regression suite
        run: >-
          python -m pytest -q
          tests/test_stage5_loop_contract.py
          tests/test_stage5_integration.py
          tests/test_stage5_integrated_nervous_system.py
          tests/test_stage5_frontend_contract.py
          tests/test_stage5_branch_integration.py
          tests/test_stage4_specialized_neural_areas.py
          tests/test_embodiment_safety.py
          tests/test_experience_engine.py
          tests/test_memory_layer.py
          tests/test_embodiment_lab.py
          tests/test_interoception.py
          tests/test_publication_scholar_reader.py
      - name: Verify full source typing and whitespace
        run: |
          python -m mypy src/
          git diff --check
      - name: Publish reviewed repairs to this integration branch only
        run: |
          git diff --stat
          git add src/embodiment/integrated_nervous_system.py src/embodiment/specialized_areas.py src/dashboard/server.py scripts/apply_stage5_timeline.py scripts/run_stage5_reference.py tests/test_stage5_frontend_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(integration): preserve JSON contracts and format parallel Stage-5 sources'
          git push origin HEAD:feature/stage5-integrated-nervous-system-20260914
          echo "Verified repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

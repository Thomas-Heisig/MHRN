name: PAN single-file Black cleanup once

on:
  push:
    branches:
      - playground-meta-night-run-20260927

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playground-meta-night-run-20260927
          fetch-depth: 0
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format target
        run: python -m black tests/test_dashboard_playground.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/zz_pan_black_one_once.yml
          git add -A
          git commit -m "style(playground): apply Black to dashboard tests"
          git push origin HEAD:playground-meta-night-run-20260927

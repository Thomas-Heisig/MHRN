          python -m ruff check src/research/data_v2.py src/research/experiment_summary.py src/dashboard/experiment_workflow.py tests/test_snn_evidence_pipeline_regressions.py
          python -m black --check src/research/data_v2.py src/research/experiment_summary.py src/dashboard/experiment_workflow.py tests/test_snn_evidence_pipeline_regressions.py


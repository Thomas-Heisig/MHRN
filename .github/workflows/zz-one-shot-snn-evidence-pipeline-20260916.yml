name: One-shot SNN evidence pipeline repair

on:
  push:
    branches:
      - fix/exp-snn-001-evidence-pipeline-20260916
    paths:
      - .github/workflows/zz-one-shot-snn-evidence-pipeline-20260916.yml

permissions:
  contents: write

jobs:
  repair-and-replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/exp-snn-001-evidence-pipeline-20260916

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"

      - name: Patch evidence pipeline and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int | None = None) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              observed = text.count(old)
              expected = 1 if count is None else count
              if observed < expected:
                  raise SystemExit(f"{path}: expected at least {expected} occurrence(s), found {observed}: {old[:80]!r}")
              text = text.replace(old, new, expected)
              p.write_text(text, encoding="utf-8")

          # DATA v2: keep legacy/local runs.json compatibility, but persist a bounded,
          # versionable compact projection that is not ignored by Git.
          replace_exact(
              "src/research/data_v2.py",
              "Research Assistant path is intentionally bounded. `DATA/runs.json` is a compact\nprojection for the current experiment, while each complete run is archived as an",
              "Research Assistant path is intentionally bounded. `DATA/runs_compact.json` is a\nversionable compact projection for the current experiment, while each complete run is archived as an",
          )
          replace_exact(
              "src/research/data_v2.py",
              '    runs_path = data_dir / "runs.json"',
              '    runs_path = data_dir / "runs_compact.json"',
          )
          replace_exact(
              "src/research/data_v2.py",
              '            f"Compact DATA/runs.json would exceed {RUN_SUMMARY_MAX_BYTES} bytes; "',
              '            f"Compact DATA/runs_compact.json would exceed {RUN_SUMMARY_MAX_BYTES} bytes; "',
          )
          replace_exact(
              "src/research/data_v2.py",
              '        )\n    runs[:] = summaries\n\n    ai_packet = {',
              '        )\n    _write_json(runs_path, summaries)\n    runs[:] = summaries\n\n    ai_packet = {',
          )

          # Science workflow: the ignored runs.json remains a local compatibility file,
          # while provenance and manifest point to the committed compact projection.
          replace_exact(
              "src/dashboard/experiment_workflow.py",
              "# per-tick traces are then moved to compressed sidecars so runs.json remains\n        # reviewable without discarding raw observations.",
              "# per-tick traces are then moved to compressed sidecars so the committed\n        # runs_compact.json remains reviewable without discarding raw observations.",
          )
          replace_exact(
              "src/dashboard/experiment_workflow.py",
              '        recorder.record_artifact("data", "DATA/runs.json")',
              '        recorder.record_artifact("data", "DATA/runs_compact.json")',
          )
          replace_exact(
              "src/dashboard/experiment_workflow.py",
              '                    data_path,\n                    data_v2.raw_index_path,',
              '                    data_v2.runs_path,\n                    data_v2.raw_index_path,',
          )
          replace_exact(
              "src/dashboard/experiment_workflow.py",
              '                "Kompakte Run-Projektion: `DATA/runs.json`",',
              '                "Versionierte kompakte Run-Projektion: `DATA/runs_compact.json`",',
          )

          # Statistics: boolean primary outcomes are first-class deterministic metrics.
          replace_exact(
              "src/research/experiment_summary.py",
              "    numeric_metric_names = sorted(known_numeric_metrics | discovered_numeric_metrics)\n\n    nested_paths = {",
              "    numeric_metric_names = sorted(known_numeric_metrics | discovered_numeric_metrics)\n    boolean_metric_names = sorted(\n        {\n            str(name)\n            for run in runs\n            for name, value in (run.get(\"metrics\") or {}).items()\n            if isinstance(value, bool)\n        }\n    )\n\n    nested_paths = {",
          )
          replace_exact(
              "src/research/experiment_summary.py",
              "        for name, path in nested_paths.items():\n",
              "        boolean_stats: dict[str, Any] = {}\n        for name in boolean_metric_names:\n            values = [\n                value\n                for run in condition_runs\n                for value in [(run.get(\"metrics\") or {}).get(name)]\n                if isinstance(value, bool)\n            ]\n            if values:\n                true_count = sum(values)\n                boolean_stats[name] = {\n                    \"n\": len(values),\n                    \"true_count\": true_count,\n                    \"false_count\": len(values) - true_count,\n                    \"true_fraction\": true_count / len(values),\n                    \"all_true\": all(values),\n                }\n\n        for name, path in nested_paths.items():\n",
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '            "metrics": metric_stats,\n        }',
              '            "metrics": metric_stats,\n            "boolean_metrics": boolean_stats,\n        }',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '        "schema_version": "2.1",',
              '        "schema_version": "2.2",',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '        if not isinstance(payload, dict)\n        or not isinstance(payload.get("metrics"), dict)\n        or not payload.get("metrics")\n',
              '        if not isinstance(payload, dict)\n        or (\n            (not isinstance(payload.get("metrics"), dict) or not payload.get("metrics"))\n            and (\n                not isinstance(payload.get("boolean_metrics"), dict)\n                or not payload.get("boolean_metrics")\n            )\n        )\n',
          )

          # Summary consumes the committed compact projection first, with legacy fallback.
          replace_exact(
              "src/research/experiment_summary.py",
              '    raw_runs = _read_json(experiment_dir / "DATA" / "runs.json", [])\n',
              '    runs_path = experiment_dir / "DATA" / "runs_compact.json"\n    if not runs_path.is_file():\n        runs_path = experiment_dir / "DATA" / "runs.json"\n    raw_runs = _read_json(runs_path, [])\n',
          )

          # Avoid renderer-dependent inline TeX and relative links disappearing in the viewer.
          replace_exact(
              "src/research/experiment_summary.py",
              '            f"- AIRR Markdown: [`reports/{report_id}.md`](reports/{report_id}.md)",\n            f"- AIRR JSON: [`reports/{report_id}.json`](reports/{report_id}.json)",',
              '            f"- AIRR Markdown: `reports/{report_id}.md`",\n            f"- AIRR JSON: `reports/{report_id}.json`",',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '            "- Mittelwert: $\\\\bar{x}=\\\\frac{1}{n}\\\\sum_{i=1}^{n}x_i$",\n            "- Populationsstandardabweichung: $\\\\sigma=\\\\sqrt{\\\\frac{1}{n}\\\\sum_{i=1}^{n}(x_i-\\\\bar{x})^2}$",\n            "- Absolute Differenz: $\\\\Delta_x=\\\\bar{x}_B-\\\\bar{x}_A$",\n            "- Verhältnis: $R_x=\\\\bar{x}_B/\\\\bar{x}_A$ fuer $\\\\bar{x}_A\\\\neq0$",\n            "- Inter-Spike-Intervall: $ISI_i=t_{i+1}-t_i$",',
              '            "- Mittelwert: `mean(x) = (1/n) * sum_i x_i`",\n            "- Populationsstandardabweichung: `sigma = sqrt((1/n) * sum_i (x_i - mean(x))^2)`",\n            "- Absolute Differenz: `Delta_x = mean(x_B) - mean(x_A)`",\n            "- Verhältnis: `R_x = mean(x_B) / mean(x_A)` fuer `mean(x_A) != 0`",\n            "- Inter-Spike-Intervall: `ISI_i = t_(i+1) - t_i`",',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '                    f"- `{metric}`: $\\\\Delta={_fmt(effect.get(\'absolute_difference\'))}$; $R={_fmt(effect.get(\'ratio\'))}$; Referenz `{effect.get(\'reference_condition\')}`, Vergleich `{effect.get(\'comparison_condition\')}`."\n',
              '                    f"- `{metric}`: `absolute_difference={_fmt(effect.get(\'absolute_difference\'))}`; `ratio={_fmt(effect.get(\'ratio\'))}`; Referenz `{effect.get(\'reference_condition\')}`, Vergleich `{effect.get(\'comparison_condition\')}`."\n',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '            f"Deterministische Statistikdatei: [`{statistics_path.relative_to(experiment_dir).as_posix()}`]({statistics_path.relative_to(experiment_dir).as_posix()})",',
              '            f"Deterministische Statistikdatei: `{statistics_path.relative_to(experiment_dir).as_posix()}`",',
          )
          replace_exact(
              "src/research/experiment_summary.py",
              '            relative = path.relative_to(experiment_dir).as_posix()\n            lines.append(f"- [{relative}]({relative})")',
              '            relative = path.relative_to(experiment_dir).as_posix()\n            if relative == "DATA/runs.json":\n                continue\n            lines.append(f"- `{relative}`")',
          )

          # Add a visible boolean primary-outcome table after protocol-specific numeric means.
          replace_exact(
              "src/research/experiment_summary.py",
              '        lines.append(\n            f"| {condition} | {\'; \'.join(extras) if extras else \'keine zusätzlichen numerischen Metriken\'} |"\n        )\n\n    effects = statistics.get("two_condition_effects", {})',
              '        lines.append(\n            f"| {condition} | {\'; \'.join(extras) if extras else \'keine zusätzlichen numerischen Metriken\'} |"\n        )\n\n    boolean_rows: list[str] = []\n    for condition, payload in condition_statistics.items():\n        boolean_metrics = (\n            payload.get("boolean_metrics", {}) if isinstance(payload, dict) else {}\n        )\n        if not isinstance(boolean_metrics, dict):\n            continue\n        for name, values in sorted(boolean_metrics.items()):\n            if not isinstance(values, dict):\n                continue\n            boolean_rows.append(\n                f"| {condition} | `{name}` | {values.get(\'n\', 0)} | "\n                f"{values.get(\'true_count\', 0)} | {values.get(\'false_count\', 0)} | "\n                f"{values.get(\'all_true\', False)} |"\n            )\n    if boolean_rows:\n        lines.extend(\n            [\n                "",\n                "#### Primäre und weitere boolesche Endpunkte",\n                "",\n                "| Condition | Outcome | n | true | false | all_true |",\n                "| --- | --- | ---: | ---: | ---: | --- |",\n                *boolean_rows,\n            ]\n        )\n\n    effects = statistics.get("two_condition_effects", {})',
          )

          # DATA v2 documentation describes repository reality: compact projection is committed;
          # legacy runs.json remains local/ignored for compatibility with existing tooling.
          p = Path("docs/06-research/RESEARCH_DATA_V2.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("runs.json                 # compact projection of this experiment only", "runs_compact.json         # bounded, versioned compact projection")
          text = text.replace("Write the compact experiment-local `DATA/runs.json`.", "Write the compact, versioned `DATA/runs_compact.json` (a local `DATA/runs.json` compatibility projection may also exist but remains ignored).")
          text = text.replace("compact `DATA/runs.json` would exceed **5 MB**", "compact `DATA/runs_compact.json` would exceed **5 MB**")
          text = text.replace("includes the compact projection, raw index", "includes the versioned compact projection, raw index")
          p.write_text(text, encoding="utf-8")

          # Existing workflow regression now expects the committed artifact path.
          replace_exact(
              "tests/test_dashboard_experiment_workflow.py",
              '    assert manifest["artifacts"]["data"] == "DATA/runs.json"',
              '    assert manifest["artifacts"]["data"] == "DATA/runs_compact.json"',
          )

          # The DATA v2 unit test must no longer mask the missing-write bug by writing
          # the returned path itself.
          replace_exact(
              "tests/test_research_data_v2.py",
              '    artifacts = prepare_research_data_v2(experiment, runs, statistics)\n    artifacts.runs_path.write_text(\n        json.dumps(runs, indent=2, sort_keys=True) + "\\n", encoding="utf-8"\n    )\n\n    index =',
              '    artifacts = prepare_research_data_v2(experiment, runs, statistics)\n    assert artifacts.runs_path.name == "runs_compact.json"\n    assert artifacts.runs_path.is_file()\n    stored_runs = json.loads(artifacts.runs_path.read_text(encoding="utf-8"))\n    assert len(stored_runs) == 2\n\n    index =',
          )

          Path("tests/test_snn_evidence_pipeline_regressions.py").write_text(
              '''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom src.research.experiment_summary import (\n    build_descriptive_statistics,\n    write_detailed_experiment_summary,\n    write_statistics_artifact,\n)\n\n\ndef _runs() -> list[dict[str, object]]:\n    return [\n        {\n            "experiment_id": "EXP-TEST-SNN-EVID",\n            "condition": "no_input_control",\n            "seed": 42,\n            "metrics": {\n                "ticks_executed": 100000,\n                "post_burn_in_mean_spikes": 0.0,\n                "post_burn_in_spike_cv": 0.0,\n                "post_burn_in_spike_relative_drift": 0.0,\n                "finite_state": True,\n                "topology_unchanged": True,\n                "stability_pass": True,\n            },\n            "runtime_error": None,\n        },\n        {\n            "experiment_id": "EXP-TEST-SNN-EVID",\n            "condition": "tonic_drive",\n            "seed": 42,\n            "metrics": {\n                "ticks_executed": 100000,\n                "post_burn_in_mean_spikes": 300.0,\n                "post_burn_in_spike_cv": 0.0,\n                "post_burn_in_spike_relative_drift": 0.0,\n                "finite_state": True,\n                "topology_unchanged": True,\n                "stability_pass": True,\n            },\n            "runtime_error": None,\n        },\n    ]\n\n\ndef test_boolean_primary_outcomes_are_aggregated() -> None:\n    statistics = build_descriptive_statistics(_runs())\n    assert statistics["schema_version"] == "2.2"\n    tonic = statistics["conditions"]["tonic_drive"]["boolean_metrics"]\n    assert tonic["finite_state"] == {\n        "n": 1,\n        "true_count": 1,\n        "false_count": 0,\n        "true_fraction": 1.0,\n        "all_true": True,\n    }\n    assert tonic["topology_unchanged"]["all_true"] is True\n    assert tonic["stability_pass"]["all_true"] is True\n\n\ndef test_summary_uses_committed_compact_data_and_plain_visible_values(tmp_path: Path) -> None:\n    experiment = tmp_path / "experiments" / "EXP-TEST-SNN-EVID"\n    (experiment / "DATA").mkdir(parents=True)\n    runs = _runs()\n    (experiment / "DATA" / "runs_compact.json").write_text(\n        json.dumps(runs, indent=2) + "\\n", encoding="utf-8"\n    )\n    (experiment / "manifest.json").write_text(\n        json.dumps(\n            {\n                "experiment_status": "completed",\n                "research_questions": ["RQ-SNN-001"],\n                "hypotheses": ["H-SNN-001-A"],\n                "research_run_mode": "CONFIRMATORY",\n                "network_mode": "OFFLINE",\n                "simulation": {\n                    "ticks": 100000,\n                    "seeds": [42],\n                    "protocol": "sustained_activity_stability_v1",\n                },\n                "results": {"run_count": 2},\n                "git": {"commit": "fixture", "dirty": False},\n                "artifacts": {"data": "DATA/runs_compact.json"},\n            }\n        ),\n        encoding="utf-8",\n    )\n    (experiment / "workflow.json").write_text(\n        json.dumps(\n            {\n                "title": "Sustained stability",\n                "conditions": "control; treatment",\n                "ticks": 100000,\n                "seeds": [42],\n                "protocol": "sustained_activity_stability_v1",\n            }\n        ),\n        encoding="utf-8",\n    )\n    write_statistics_artifact(experiment, runs)\n    write_detailed_experiment_summary(\n        tmp_path,\n        "EXP-TEST-SNN-EVID",\n        {"status": "unavailable", "reason": "fixture"},\n    )\n    summary = (experiment / "summary.md").read_text(encoding="utf-8")\n    assert "Mittelwert: `mean(x) = (1/n) * sum_i x_i`" in summary\n    assert "`absolute_difference=300`" in summary\n    assert "Primäre und weitere boolesche Endpunkte" in summary\n    assert "`finite_state`" in summary\n    assert "Deterministische Statistikdatei: `analysis/statistics.json`" in summary\n    assert "- `DATA/runs_compact.json`" in summary\n    assert "DATA/runs.json" not in summary\n''',
              encoding="utf-8",
          )
          PY

      - name: Format and lint changed Python files
        run: |
          python -m black src/research/data_v2.py src/research/experiment_summary.py src/dashboard/experiment_workflow.py tests/test_research_data_v2.py tests/test_dashboard_experiment_workflow.py tests/test_snn_evidence_pipeline_regressions.py
          python -m ruff check --fix src/research/data_v2.py src/research/experiment_summary.py src/dashboard/experiment_workflow.py tests/test_research_data_v2.py tests/test_dashboard_experiment_workflow.py tests/test_snn_evidence_pipeline_regressions.py
          git diff --check

      - name: Run targeted regressions
        run: |
          python -m pytest -q \
            tests/test_research_data_v2.py \
            tests/test_snn_evidence_pipeline_regressions.py \
            tests/test_exp_gen_0036_regressions.py \
            tests/test_scientific_execution_contract.py \
            tests/test_dashboard_operational_protocol_routes.py \
            tests/test_dashboard_experiment_workflow.py

      - name: Commit pipeline repair
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/research/data_v2.py src/research/experiment_summary.py src/dashboard/experiment_workflow.py docs/06-research/RESEARCH_DATA_V2.md tests/test_research_data_v2.py tests/test_dashboard_experiment_workflow.py tests/test_snn_evidence_pipeline_regressions.py
          git commit -m "Fix SNN evidence artifacts and summary diagnostics"
          git push origin HEAD:fix/exp-snn-001-evidence-pipeline-20260916
          test -z "$(git status --porcelain)"

      - name: Run clean confirmatory verification EXP-GEN-0038
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.dashboard.experiment_workflow import ExperimentWorkflowService

          result = ExperimentWorkflowService(Path("research")).run_science(
              {
                  "experiment_id": "EXP-GEN-0038",
                  "question_id": "RQ-SNN-001",
                  "hypothesis_id": "H-SNN-001-A",
                  "title": "sustained_activity_stability_v1 — RQ-SNN-001 pipeline verification",
                  "conditions": "no_input_control (negative_control); tonic_drive (stability_treatment)",
                  "ticks": 100000,
                  "seeds": "42-51",
                  "notes": "Clean rerun after evidence-pipeline repair; no protocol or threshold changes.",
                  "protocol": "sustained_activity_stability_v1",
              }
          )
          print(result["experiment_id"], result["result"])
          PY

      - name: Validate EXP-GEN-0038 artifacts and preregistered criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.dashboard.experiment_workflow import write_experiment_summary

          exp = Path("research/experiments/EXP-GEN-0038")
          manifest = json.loads((exp / "manifest.json").read_text(encoding="utf-8"))
          stats = json.loads((exp / "analysis/statistics.json").read_text(encoding="utf-8"))
          compact = json.loads((exp / "DATA/runs_compact.json").read_text(encoding="utf-8"))
          summary = (exp / "summary.md").read_text(encoding="utf-8")
          report = (exp / "report.md").read_text(encoding="utf-8")

          assert manifest["git"]["dirty"] is False
          assert manifest["artifacts"]["data"] == "DATA/runs_compact.json"
          assert manifest["execution_contract"]["tick_validation"]["status"] == "SATISFIED"
          assert len(compact) == 20
          assert stats["schema_version"] == "2.2"
          for condition in ("no_input_control", "tonic_drive"):
              booleans = stats["conditions"][condition]["boolean_metrics"]
              for metric in ("finite_state", "topology_unchanged", "stability_pass"):
                  assert booleans[metric]["n"] == 10
                  assert booleans[metric]["false_count"] == 0
                  assert booleans[metric]["all_true"] is True
          tonic = stats["conditions"]["tonic_drive"]["metrics"]
          assert tonic["post_burn_in_mean_spikes"]["mean"] > 0
          assert tonic["post_burn_in_spike_cv"]["max"] <= 0.25
          assert tonic["post_burn_in_spike_relative_drift"]["max"] <= 0.25
          assert "Versionierte kompakte Run-Projektion: `DATA/runs_compact.json`" in report
          assert "Mittelwert: `mean(x) = (1/n) * sum_i x_i`" in summary
          assert "`absolute_difference=300`" in summary
          assert "Primäre und weitere boolesche Endpunkte" in summary
          assert "- `DATA/runs_compact.json`" in summary
          assert "DATA/runs.json" not in summary

          verification = {
              "schema_version": "1.0",
              "experiment_id": "EXP-GEN-0038",
              "purpose": "post-repair pipeline verification",
              "scientific_role": "confirmatory rerun under unchanged frozen preregistration",
              "tick_contract": "SATISFIED",
              "run_count": 20,
              "primary_criteria": {
                  "tonic_drive_mean_spikes_per_window_gt_0": True,
                  "tonic_drive_post_burn_in_spike_cv_le_0_25": True,
                  "tonic_drive_post_burn_in_spike_relative_drift_le_0_25": True,
                  "all_runs_finite_state": True,
                  "all_runs_topology_unchanged": True,
              },
              "artifact_contract": {
                  "committed_compact_projection": True,
                  "boolean_outcomes_aggregated": True,
                  "viewer_safe_plain_formulas": True,
                  "viewer_safe_plain_artifact_paths": True,
              },
              "evidence_promotion": "HUMAN_REVIEW_REQUIRED",
          }
          (exp / "analysis/PIPELINE-VERIFICATION.json").write_text(
              json.dumps(verification, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          write_experiment_summary(
              Path("research"),
              "EXP-GEN-0038",
              {"status": "unavailable", "reason": "AI backend not configured in CI verification"},
          )
          PY
          git diff --check

      - name: Commit EXP-GEN-0038
        run: |
          git add research/experiments/EXP-GEN-0038
          git commit -m "Record EXP-GEN-0038 SNN stability verification"
          git push origin HEAD:fix/exp-snn-001-evidence-pipeline-20260916
          test -z "$(git status --porcelain)"

      - name: Run clean technical replication EXP-GEN-0039
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.dashboard.experiment_workflow import ExperimentWorkflowService

          result = ExperimentWorkflowService(Path("research")).run_science(
              {
                  "experiment_id": "EXP-GEN-0039",
                  "question_id": "RQ-SNN-001",
                  "hypothesis_id": "H-SNN-001-A",
                  "title": "sustained_activity_stability_v1 — RQ-SNN-001 technical replication",
                  "conditions": "no_input_control (negative_control); tonic_drive (stability_treatment)",
                  "ticks": 100000,
                  "seeds": "42-51",
                  "notes": "Second clean execution to verify deterministic reproducibility; not counted as statistically independent evidence.",
                  "protocol": "sustained_activity_stability_v1",
              }
          )
          print(result["experiment_id"], result["result"])
          PY

      - name: Compare replication and validate repository-facing artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.dashboard.experiment_workflow import write_experiment_summary

          a = Path("research/experiments/EXP-GEN-0038")
          b = Path("research/experiments/EXP-GEN-0039")
          sa = json.loads((a / "analysis/statistics.json").read_text(encoding="utf-8"))
          sb = json.loads((b / "analysis/statistics.json").read_text(encoding="utf-8"))
          mb = json.loads((b / "manifest.json").read_text(encoding="utf-8"))
          assert mb["git"]["dirty"] is False
          assert mb["artifacts"]["data"] == "DATA/runs_compact.json"
          assert sa["conditions"] == sb["conditions"]
          assert sa["two_condition_effects"] == sb["two_condition_effects"]
          comparison = {
              "schema_version": "1.0",
              "reference": "EXP-GEN-0038",
              "replication": "EXP-GEN-0039",
              "conditions_identical": True,
              "two_condition_effects_identical": True,
              "interpretation": "technical deterministic replication; repeated seeds are not independent statistical replications",
              "scientific_evidence": False,
              "human_review_required": True,
          }
          (b / "analysis/REPLICATION-COMPARISON.json").write_text(
              json.dumps(comparison, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          write_experiment_summary(
              Path("research"),
              "EXP-GEN-0039",
              {"status": "unavailable", "reason": "AI backend not configured in CI verification"},
          )
          summary = (b / "summary.md").read_text(encoding="utf-8")
          assert "DATA/runs.json" not in summary
          assert "- `analysis/REPLICATION-COMPARISON.json`" in summary
          PY
          git diff --check

      - name: Commit EXP-GEN-0039
        run: |
          git add research/experiments/EXP-GEN-0039
          git commit -m "Record EXP-GEN-0039 deterministic SNN replication"
          git push origin HEAD:fix/exp-snn-001-evidence-pipeline-20260916
          test -z "$(git status --porcelain)"


name: EMB-001-B temporal shift V3

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/verify_emb001b_temporal_v3.py
      - research/preregistrations/PREREG-EMB001B-TEMPORAL-V3.json
      - research/experiments/EXP-EMB001B-TEMPORAL-V3-20260920/**
      - .github/workflows/emb001b-temporal-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-persisted-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify immutable persisted DATA
        run: |
          test -f "research/experiments/EXP-EMB001B-TEMPORAL-V3-20260920/manifest.json"
          python scripts/verify_emb001b_temporal_v3.py
      - name: Confirm verification is read-only
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

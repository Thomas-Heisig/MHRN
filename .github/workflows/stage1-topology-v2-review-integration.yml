name: Stage-1 topology v2 review and publication integration

on:
  push:
    branches:
      - fix/stage1-topology-v2-review-publication-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[topology-v2-integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Rebuild Edition 1.8
        run: python scripts/build_publication_edition.py --write

      - name: Verify review, series and publication integration
        run: |
          python -m pytest             tests/test_dashboard_experiment_workflow.py             tests/test_review_inbox.py             tests/test_experiment_organizer.py             tests/test_research_workspace_v06.py             tests/test_publication_edition.py -q
          python scripts/build_publication_edition.py --check

      - name: Commit generated publication outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo "No generated publication changes."
          else
            git commit -m "docs(publication): rebuild 1.8 with topology v2 [topology-v2-integration]"
            git push origin HEAD:${{ github.ref_name }}
          fi

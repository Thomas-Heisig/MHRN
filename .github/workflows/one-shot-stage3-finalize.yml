name: One-shot Stage-3 finalize

on:
  push:
    branches: [feature/stage3-plastic-neural-tissue]
    paths: [.github/workflows/one-shot-stage3-finalize.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/stage3-plastic-neural-tissue
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Verify Stage 2 Stage 3 and release registry
        run: |
          python -m black --check scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py tests/test_release_registry.py src/dashboard/development_timeline.py src/version.py
          python -m ruff check scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py tests/test_release_registry.py src/dashboard/development_timeline.py src/version.py
          python -m pyright scripts/run_stage3_reference.py tests/test_stage3_plastic_neural_tissue.py tests/test_release_registry.py src/dashboard/development_timeline.py src/version.py
          python -m pytest \
            tests/test_recurrent_snn_contract.py \
            tests/test_recurrent_snn_timeline.py \
            tests/test_stdp_integration.py \
            tests/test_reward.py \
            tests/test_learning_experiment.py \
            tests/test_homeostasis_engine.py \
            tests/test_structural_e2e.py \
            tests/test_structural_determinism.py \
            tests/test_checkpoint_v4.py \
            tests/test_stage3_plastic_neural_tissue.py \
            tests/test_release_registry.py \
            -q
      - name: Recompute deterministic Stage 3 result
        run: |
          cp research/generated/verification/plastic_neural_tissue_reference.json /tmp/stage3-reference.json
          python scripts/run_stage3_reference.py
          cmp /tmp/stage3-reference.json research/generated/verification/plastic_neural_tissue_reference.json
          git diff --exit-code -- research/generated/verification/plastic_neural_tissue_reference.json
      - name: Remove finalizer after successful verification
        run: |
          rm .github/workflows/one-shot-stage3-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-stage3-finalize.yml
          git commit -m "chore: remove completed Stage 3 finalizer"
          git push origin HEAD:feature/stage3-plastic-neural-tissue

name: Branch Pyright Repair

on:
  push:
    branches:
      - fix/neural-primitives-fullstack
    paths:
      - .github/workflows/branch-pyright-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/neural-primitives-fullstack
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply strict typing boundary repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, count))

          def ensure_cast_import(path: str) -> None:
              text = read(path)
              match = re.search(r'^from typing import ([^\n]+)$', text, re.M)
              if not match:
                  raise SystemExit(f'no typing import in {path}')
              names = [item.strip() for item in match.group(1).split(',')]
              if 'cast' not in names:
                  names.append('cast')
                  text = text[:match.start()] + 'from typing import ' + ', '.join(names) + text[match.end():]
                  write(path, text)

          # TypedDict optional-key access: validate through get() first.
          replace(
              'src/config/loader.py',
              '    if result["lif_tau_m_ms"] <= 0.0:\n        raise ValueError("neuron.lif_tau_m_ms must be > 0")',
              '    lif_tau_m_ms = result.get("lif_tau_m_ms")\n    if not isinstance(lif_tau_m_ms, float) or lif_tau_m_ms <= 0.0:\n        raise ValueError("neuron.lif_tau_m_ms must be > 0")',
          )

          # Standalone synapse config JSON boundary.
          ensure_cast_import('src/core/synapse.py')
          replace(
              'src/core/synapse.py',
              '            SynapseConfig.from_dict(config_data)\n            if isinstance(config_data, dict)',
              '            SynapseConfig.from_dict(cast(dict[str, Any], config_data))\n            if isinstance(config_data, dict)',
          )

          # Snapshot JSON boundary.
          ensure_cast_import('src/dashboard/scientific_metrics.py')
          replace(
              'src/dashboard/scientific_metrics.py',
              '    snapshot_json = snapshot.to_json()\n    network_state = snapshot_json.get("network", {})\n    if not isinstance(network_state, dict):\n        network_state = {}',
              '    snapshot_json = cast(dict[str, Any], snapshot.to_json())\n    network_raw = snapshot_json.get("network", {})\n    network_state: dict[str, Any] = (\n        cast(dict[str, Any], network_raw) if isinstance(network_raw, dict) else {}\n    )',
          )
          replace(
              'src/dashboard/scientific_metrics.py',
              '        "tick": getattr(\n            network, "current_tick", snapshot_json.get("system", {}).get("tick", 0)\n        ),',
              '        "tick": getattr(network, "current_tick", _snapshot_tick(snapshot_json)),',
          )
          text = read('src/dashboard/scientific_metrics.py')
          marker = '\ndef build_scientific_metrics('
          helper = '''\n\ndef _snapshot_tick(snapshot_json: dict[str, Any]) -> int:\n    system_raw = snapshot_json.get("system")\n    if not isinstance(system_raw, dict):\n        return 0\n    value = cast(dict[str, Any], system_raw).get("tick", 0)\n    return int(value) if isinstance(value, (int, float)) and not isinstance(value, bool) else 0\n'''
          if '_snapshot_tick(' not in text[:text.index(marker)]:
              text = text.replace(marker, helper + marker, 1)
              write('src/dashboard/scientific_metrics.py', text)

          # Server: avoid local json shadowing and typed callable adapter.
          replace('src/dashboard/server.py', '                                        import json\n\n                                        parsed_value = json.loads(value_str)', '                                        parsed_value = json.loads(value_str)')
          old = '''            request_backend = chat_backend_from_text_backend(\n                lambda prompt: ollama.generate_text(\n                    prompt,\n                    images=images,\n                    tools=(\n                        []\n                        if not self.dashboard_server.research_chat_tools_enabled\n                        else []\n                    ),\n                )\n            )'''
          new = '''            def _ollama_generate(prompt: str) -> str:\n                return ollama.generate_text(\n                    prompt,\n                    images=images,\n                    tools=(\n                        []\n                        if not self.dashboard_server.research_chat_tools_enabled\n                        else []\n                    ),\n                )\n\n            request_backend = chat_backend_from_text_backend(_ollama_generate)'''
          replace('src/dashboard/server.py', old, new)

          # Hot path uses a local identical clamp instead of a private cross-module symbol.
          replace('src/homeostasis/hot_path.py', 'from .engine import HomeostasisEngine, HomeostasisStats, _clamp', 'from .engine import HomeostasisEngine, HomeostasisStats')
          text = read('src/homeostasis/hot_path.py')
          if 'def _hot_clamp(' not in text:
              insertion = '''\n\ndef _hot_clamp(value: float, low: float, high: float) -> float:\n    return max(low, min(high, value))\n'''
              text = text.replace('\n\nclass HotPathHomeostasisEngine', insertion + '\n\nclass HotPathHomeostasisEngine', 1)
          text = text.replace('_clamp(', '_hot_clamp(')
          write('src/homeostasis/hot_path.py', text)

          # JSON object reconstruction in AIRR.
          ensure_cast_import('src/research_assistant/airr.py')
          replace('src/research_assistant/airr.py', '                    return AIAnalysisRecord(**raw)', '                    return AIAnalysisRecord(**cast(dict[str, Any], raw))')

          # Recursive analysis compaction narrows dict/list element types explicitly.
          ensure_cast_import('src/research_assistant/assistant.py')
          replace(
              'src/research_assistant/assistant.py',
              '    if isinstance(value, dict):\n        return {str(key): _compact_for_analysis(item) for key, item in value.items()}\n    if isinstance(value, list):\n        if len(value) <= _MAX_ANALYSIS_SEQUENCE_ITEMS:\n            return [_compact_for_analysis(item) for item in value]\n        head = value[:_ANALYSIS_SAMPLE_ITEMS]\n        tail = value[-_ANALYSIS_SAMPLE_ITEMS:]',
              '    if isinstance(value, dict):\n        mapping = cast(dict[object, object], value)\n        return {str(key): _compact_for_analysis(item) for key, item in mapping.items()}\n    if isinstance(value, list):\n        sequence = cast(list[object], value)\n        if len(sequence) <= _MAX_ANALYSIS_SEQUENCE_ITEMS:\n            return [_compact_for_analysis(item) for item in sequence]\n        head = sequence[:_ANALYSIS_SAMPLE_ITEMS]\n        tail = sequence[-_ANALYSIS_SAMPLE_ITEMS:]',
          )
          replace('src/research_assistant/assistant.py', '            "item_count": len(value),', '            "item_count": len(sequence),')

          # Causal manifest Mapping boundaries.
          ensure_cast_import('src/research_assistant/causal.py')
          replace(
              'src/research_assistant/causal.py',
              '    interaction_ids = _string_tuple(card.get("interaction_ids", []), "interaction_ids")\n    roles = _string_tuple(card.get("roles", []), "roles")',
              '    typed_card = cast(Mapping[str, object], card)\n    interaction_ids = _string_tuple(typed_card.get("interaction_ids", []), "interaction_ids")\n    roles = _string_tuple(typed_card.get("roles", []), "roles")',
          )
          replace(
              'src/research_assistant/causal.py',
              '    return tuple(value)',
              '    values = cast(list[object] | tuple[object, ...], value)\n    return tuple(cast(str, item) for item in values)',
          )
          replace('src/research_assistant/causal.py', '    return dict(value)', '    return dict(cast(Mapping[str, Any], value))')

          # Config validators and traversal avoid list/dict Unknown element types.
          ensure_cast_import('src/research_assistant/config_tool.py')
          text = read('src/research_assistant/config_tool.py')
          if 'def _valid_dimensions(' not in text:
              anchor = '\n_VALIDATORS: dict[str, Validator] = {'
              helper = '''\n\ndef _valid_dimensions(value: Any) -> bool:\n    if not isinstance(value, list):\n        return False\n    dimensions = cast(list[object], value)\n    return len(dimensions) == 5 and all(\n        isinstance(dimension, int) and not isinstance(dimension, bool) and 1 <= dimension <= 100\n        for dimension in dimensions\n    )\n'''
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('    "dimensions": lambda v: (\n        isinstance(v, list)\n        and len(v) == 5\n        and all(isinstance(d, int) and 1 <= d <= 100 for d in v)\n    ),', '    "dimensions": _valid_dimensions,', 1)
          old = '''    parts = key.split(".")\n    current = config\n    for part in parts:\n        if isinstance(current, dict) and part in current:\n            current = current[part]\n        else:\n            return False, None\n    return True, current'''
          new = '''    parts = key.split(".")\n    current: object = config\n    for part in parts:\n        if not isinstance(current, dict):\n            return False, None\n        mapping = cast(dict[str, Any], current)\n        if part not in mapping:\n            return False, None\n        current = mapping[part]\n    return True, current'''
          if old not in text:
              raise SystemExit('missing config traversal block')
          text = text.replace(old, new, 1)
          write('src/research_assistant/config_tool.py', text)

          # Typed default gateway predicates.
          text = read('src/research_assistant/gateways.py')
          if 'def _allow_proposal(' not in text:
              text = text.replace('\n\n@dataclass(frozen=True, slots=True)\nclass ApprovedIntervention', '\n\ndef _allow_proposal(_proposal: ActionProposal) -> bool:\n    return True\n\n\n@dataclass(frozen=True, slots=True)\nclass ApprovedIntervention', 1)
          text = text.replace('self._policy = policy or (lambda _proposal: True)', 'self._policy: Callable[[ActionProposal], bool] = policy or _allow_proposal', 1)
          text = text.replace('self._safety_envelope = safety_envelope or (lambda _proposal: True)', 'self._safety_envelope: Callable[[ActionProposal], bool] = safety_envelope or _allow_proposal', 1)
          write('src/research_assistant/gateways.py', text)

          # Governance Mapping and JSON object boundaries.
          ensure_cast_import('src/research_assistant/governance.py')
          replace('src/research_assistant/governance.py', '    for component in sorted(changed_components):\n        bump = raw_bumps.get(component)', '    typed_bumps = cast(Mapping[str, object], raw_bumps)\n    for component in sorted(changed_components):\n        bump = typed_bumps.get(component)')
          replace('src/research_assistant/governance.py', '        version = bump.get("version")\n        reason = bump.get("bump_reason")', '        typed_bump = cast(Mapping[str, object], bump)\n        version = typed_bump.get("version")\n        reason = typed_bump.get("bump_reason")')
          replace('src/research_assistant/governance.py', '            prompt = VersionedPrompt.create(\n                str(raw.get("prompt_id", "")),\n                int(raw.get("version", 0)),\n                str(raw.get("text", "")),\n            )\n            expected_digest = raw.get("protocol_digest")', '            typed_raw = cast(dict[str, object], raw)\n            prompt = VersionedPrompt.create(\n                str(typed_raw.get("prompt_id", "")),\n                int(typed_raw.get("version", 0)),\n                str(typed_raw.get("text", "")),\n            )\n            expected_digest = typed_raw.get("protocol_digest")')

          # Fallback JSON dictionary key/value boundary.
          ensure_cast_import('src/research_assistant/local_fallback_backend.py')
          replace('src/research_assistant/local_fallback_backend.py', '            return {str(key): value for key, value in parsed.items()}', '            mapping = cast(dict[object, Any], parsed)\n            return {str(key): value for key, value in mapping.items()}')

          # Confidence concern list boundary.
          ensure_cast_import('src/research_assistant/models.py')
          replace('src/research_assistant/models.py', '    else:\n        concerns = list(concerns)\n    concerns.append(', '    else:\n        concerns = list(cast(list[Any], concerns))\n    concerns.append(', 1)

          # Observation JSON boundaries.
          ensure_cast_import('src/research_assistant/observation_stream.py')
          replace('src/research_assistant/observation_stream.py', '                record = _record_from_dict(raw, line_number)', '                record = _record_from_dict(cast(dict[str, Any], raw), line_number)')
          replace('src/research_assistant/observation_stream.py', '    payload = _canonical_json(observation)', '    typed_observation = cast(dict[str, Any], observation)\n    payload = _canonical_json(typed_observation)')
          replace('src/research_assistant/observation_stream.py', '    return ObservationStreamRecord(sequence, tick, digest, observation)', '    return ObservationStreamRecord(sequence, tick, digest, typed_observation)')

          # Ollama response JSON object boundary.
          ensure_cast_import('src/research_assistant/ollama_backend.py')
          replace('src/research_assistant/ollama_backend.py', '                text = response_payload.get("response")', '                typed_payload = cast(dict[str, Any], response_payload)\n                text = typed_payload.get("response")')
          replace('src/research_assistant/ollama_backend.py', '                    response_payload,\n                    text,', '                    typed_payload,\n                    text,')

          # Mapping[str, str] values are already statically strings.
          replace('src/research_assistant/replay_backend.py', '            not digest or not isinstance(text, str)\n            for digest, text in self.responses.items()', '            not digest or not text\n            for digest, text in self.responses.items()')

          # Typed dirty-set boundaries.
          ensure_cast_import('src/storage/incremental_runtime.py')
          replace('src/storage/incremental_runtime.py', '            neuron_ids = {int(value) for value in neuron_dirty}', '            neuron_ids = {int(value) for value in cast(set[object], neuron_dirty)}')
          replace('src/storage/incremental_runtime.py', '                for source_id, target_id in synapse_dirty', '                for source_id, target_id in cast(set[tuple[object, object]], synapse_dirty)')

          # Public binary-format aliases for the optimized journal implementation.
          text = read('src/storage/delta_journal.py')
          if 'COMMIT_STRUCT = _COMMIT_STRUCT' not in text:
              anchor = '_COMMIT_STRUCT = struct.Struct('
              idx = text.index(anchor)
              # aliases are inserted after both struct declarations below via the next stable marker
              marker = '\n\n@dataclass'
              insert_at = text.index(marker, idx)
              text = text[:insert_at] + '\n\nENTRY_HEADER_STRUCT = _ENTRY_HEADER_STRUCT\nCOMMIT_STRUCT = _COMMIT_STRUCT' + text[insert_at:]
              write('src/storage/delta_journal.py', text)
          replace('src/storage/fast_delta_journal.py', '    _COMMIT_STRUCT,\n    _ENTRY_HEADER_STRUCT,', '    COMMIT_STRUCT,\n    ENTRY_HEADER_STRUCT,')
          text = read('src/storage/fast_delta_journal.py').replace('_COMMIT_STRUCT', 'COMMIT_STRUCT').replace('_ENTRY_HEADER_STRUCT', 'ENTRY_HEADER_STRUCT')
          write('src/storage/fast_delta_journal.py', text)
          PY
      - name: Install project and pinned checks
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Format and lint repaired files
        run: |
          python -m black src
          python -m ruff check --fix src
      - name: Strict Pyright diagnostic
        run: python -m pyright
        continue-on-error: true
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: harden strict pyright type boundaries"
          git push origin HEAD:fix/neural-primitives-fullstack

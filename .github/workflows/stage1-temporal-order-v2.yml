name: Stage 1 temporal-order V2

on:
  push:
    branches:
      - research/stage1-temporal-order-v2-20260919
    paths:
      - scripts/run_stage1_temporal_order_v2.py
      - scripts/verify_stage1_temporal_order_v2.py
      - research/preregistrations/PREREG-S1-TEMP-ORDER-V2.json
      - research/decisions/2026-09-19_temp002_v1_order-encoding-adequacy.md
      - .github/workflows/stage1-temporal-order-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-temporal-order-v2-single-authorized-run
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/research/stage1-temporal-order-v2-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e '.[dev]'
      - name: Verify existing small-SNN contracts
        run: >-
          python -m pytest -q
          tests/test_small_snn_contract.py
          tests/test_exp21_followup_runners.py
      - name: Confirm clean source freeze
        run: |
          test -z "$(git status --porcelain)"
          echo "Source freeze: $(git rev-parse HEAD)"
      - name: Execute preregistered Stage-1 temporal-order V2 exactly once
        run: python scripts/run_stage1_temporal_order_v2.py
      - name: Verify persisted DATA and governance
        run: python scripts/verify_stage1_temporal_order_v2.py
      - name: Persist DATA regardless of scientific direction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/experiments/EXP-S1-TEMP-ORDER-V2-20260919
          if git diff --cached --quiet; then
            echo "No new Stage-1 DATA to commit"
            exit 1
          fi
          git commit -m "research: persist Stage 1 temporal-order V2 DATA"
          git push origin HEAD:research/stage1-temporal-order-v2-20260919

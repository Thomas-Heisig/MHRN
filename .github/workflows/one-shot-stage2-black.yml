name: One-shot Stage-2 format repair

on:
  push:
    branches: [feature/stage2-recurrent-snn]
    paths: [.github/workflows/one-shot-stage2-black.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/stage2-recurrent-snn
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned formatter
        run: python -m pip install black==26.5.1
      - name: Repair global Black baseline exposed by PR merge
        run: |
          python -m black src/dashboard/live_projection.py
          python -m black --check src/dashboard/live_projection.py
      - name: Self-remove and commit
        run: |
          rm .github/workflows/one-shot-stage2-black.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: normalize live projection formatting"
          git push origin HEAD:feature/stage2-recurrent-snn

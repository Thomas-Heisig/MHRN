name: One-shot PR170 formatter

on:
  push:
    branches:
      - docs/edition18-prior-art-repair-20260919
    paths:
      - '.github/workflows/one-shot-pr170-format.yml'

permissions:
  contents: write

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: docs/edition18-prior-art-repair-20260919
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install formatting and type tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Tighten imprint author typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/dashboard/server.py")
          text = path.read_text(encoding="utf-8")
          old = '''            authorship = identity.get("authorship", {})
            author = (
                cast(dict[str, Any], authorship).get("primary_author", {})
                if isinstance(authorship, dict)
                else {}
            )
            provider = imprint.get("provider", {})
            if not isinstance(provider, dict):
                raise ValueError("Imprint provider metadata must be an object.")
            provider_data = cast(dict[str, Any], provider)

            canonical_name = (
                cast(dict[str, Any], author).get("display_name")
                if isinstance(author, dict)
                else None
            )
'''
          new = '''            authorship_object = identity.get("authorship")
            if not isinstance(authorship_object, dict):
                raise ValueError("Canonical authorship metadata must be an object.")
            authorship = cast(dict[str, Any], authorship_object)
            author_object = authorship.get("primary_author")
            if not isinstance(author_object, dict):
                raise ValueError("Canonical primary_author metadata must be an object.")
            author = cast(dict[str, Any], author_object)

            provider = imprint.get("provider", {})
            if not isinstance(provider, dict):
                raise ValueError("Imprint provider metadata must be an object.")
            provider_data = cast(dict[str, Any], provider)

            canonical_name = author.get("display_name")
'''
          if old not in text:
              raise SystemExit("target imprint block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Format exact failing files
        run: |
          python -m black             scripts/run_snn005_holdout_r2.py             scripts/verify_snn005_holdout_r2.py             src/dashboard/server.py             tests/test_mhrn_naming.py
          python -m black --check             scripts/run_snn005_holdout_r2.py             scripts/verify_snn005_holdout_r2.py             src/dashboard/server.py             tests/test_mhrn_naming.py
          python -m pyright src/dashboard/server.py
      - name: Remove one-shot workflow and push result
        run: |
          rm .github/workflows/one-shot-pr170-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: format release-gate files and tighten imprint typing"
          git push origin HEAD:docs/edition18-prior-art-repair-20260919

name: CL-002 Frozen Empirical Execution

on:
  push:
    branches:
      - research/exp-s6-sem-cl-002-execution-20260915
    paths-ignore:
      - research/experiments/EXP-S6-SEM-CL-002/results/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-s6-sem-cl-002-single-authorized-run
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen research environment
        run: python -m pip install -e '.[dev]'
      - name: Verify authorization and frozen source hashes
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('scripts/run_semantization_split_mnist_cl002.py')
          spec = importlib.util.spec_from_file_location('cl002_runner', p)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          authorization = module._require_authorization(module.DEFAULT_AUTHORIZATION)
          hashes = module._verify_freeze(module.DEFAULT_FREEZE)
          assert authorization['execution_authorized'] is True
          assert len(hashes) == 7
          print('CL-002 authorization and 7 frozen SHA-256 entries verified before MNIST load')
          PY
      - name: Execute preregistered EXP-S6-SEM-CL-002 exactly once
        run: >-
          python scripts/run_semantization_split_mnist_cl002.py
          --output research/experiments/EXP-S6-SEM-CL-002/results
          --cache .cache/mnist
      - name: Confirm DATA governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/experiments/EXP-S6-SEM-CL-002/results/results.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['experiment_id'] == 'EXP-S6-SEM-CL-002'
          assert data['automatic_evidence_promotion'] is False
          assert data['human_review_required'] is True
          assert data['scientific_evidence'] is False
          assert len(data['runs']) == 36
          print(json.dumps(data['summary'], indent=2, sort_keys=True))
          PY
      - name: Persist DATA regardless of outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/experiments/EXP-S6-SEM-CL-002/results/results.json research/experiments/EXP-S6-SEM-CL-002/results/REPORT.md
          if git diff --cached --quiet; then
            echo "No new CL-002 DATA to commit"
            exit 1
          fi
          git commit -m "research: persist preregistered EXP-S6-SEM-CL-002 DATA"
          git push

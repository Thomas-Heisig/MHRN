name: One-shot Stage-3 canonical patch v2

on:
  push:
    branches: [feature/stage3-plastic-neural-tissue]
    paths: [.github/workflows/one-shot-stage3-release-patch-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/stage3-plastic-neural-tissue
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Correct known assertions and apply canonical patch
        run: |
          sed -i 's/"0.6.0a1", "0.6.0a2", count=3/"0.6.0a1", "0.6.0a2", count=2/' scripts/apply_stage3_release_patch.py
          sed -i 's/replace("src\/profiles\/service.py", '\''"runtime_version": "0.6.0a1"'\'', '\''"runtime_version": "0.6.0a2"'\'')/replace("src\/profiles\/service.py", '\''"runtime_version": "0.6.0a1"'\'', '\''"runtime_version": "0.6.0a2"'\'', count=2)/' scripts/apply_stage3_release_patch.py
          python scripts/apply_stage3_release_patch.py
      - name: Syntax and whitespace verification
        run: |
          python -m compileall -q src scripts tests
          git diff --check
      - name: Remove one-shot helpers and commit
        run: |
          rm -f .github/workflows/one-shot-stage3-release-patch.yml
          rm -f .github/workflows/one-shot-stage3-release-patch-v2.yml
          rm -f scripts/apply_stage3_release_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: advance Stage 3 plastic neural tissue"
          git push origin HEAD:feature/stage3-plastic-neural-tissue

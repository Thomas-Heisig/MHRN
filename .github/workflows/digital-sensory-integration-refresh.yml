name: Digital Sensory Integration Refresh

on:
  push:
    branches:
      - research/digital-sensory-interface-integration-20260925
    paths:
      - research/registry/**
      - research/publications/2026-09-17_recursive-epistemics_v1.8/**
      - research/generate_reports.py
      - .github/workflows/digital-sensory-integration-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/digital-sensory-interface-integration-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev,docs]'
      - name: Regenerate research projections
        run: python research/generate_reports.py
      - name: Regenerate deterministic publication outputs
        run: python scripts/build_publication_edition.py --write
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          rm .github/workflows/digital-sensory-integration-refresh.yml
          git add research/generated research/publications/2026-09-17_recursive-epistemics_v1.8 .github/workflows/digital-sensory-integration-refresh.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: regenerate digital sensory interface projections"
          git push origin HEAD:research/digital-sensory-interface-integration-20260925

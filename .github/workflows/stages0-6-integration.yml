name: Stage 0-6 integration verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository-pinned tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Verify new contracts without evidence promotion
        run: |
          python -m pytest -q tests/test_stage6_replay.py tests/test_stage6_cognition_api.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py tests/test_stages_integration_inventory.py tests/test_temporal.py tests/test_development_timeline.py tests/test_airr_unavailable_fallback.py --junitxml=stages-contracts.xml
          node --test tests/frontend/*.test.mjs
          python -m scripts.audit_stages_0_6 > stages-inventory.json
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stages0-6-contracts-and-inventory
          path: |
            stages-contracts.xml
            stages-inventory.json
          retention-days: 14

name: Stage 1 recurrence clean R2

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_stage1_recurrence_clean_r2.py
      - scripts/verify_stage1_recurrence_clean_r2.py
      - research/preregistrations/PREREG-S1-REC-CLEAN-R2.json
      - research/experiments/EXP-S1-REC-CLEAN-R2-20260919/**
      - .github/workflows/stage1-recurrence-clean-r2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-recurrence-clean-r2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.head_ref == 'research/stage1-recurrence-clean-r2-20260919' || github.ref == 'refs/heads/research/stage1-recurrence-clean-r2-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/stage1-recurrence-clean-r2-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e '.[dev]'
      - name: Verify recurrence contract regressions
        run: >-
          python -m pytest -q
          tests/test_recurrence_map_contract.py
          tests/test_small_snn_contract.py
      - name: Execute or verify canonical Stage-1 recurrence R2
        run: |
          if [ -d research/experiments/EXP-S1-REC-CLEAN-R2-20260919 ]; then
            echo "Canonical DATA already present; verifying without re-execution."
            python scripts/verify_stage1_recurrence_clean_r2.py
          else
            test -z "$(git status --porcelain)"
            echo "Source freeze: $(git rev-parse HEAD)"
            python scripts/run_stage1_recurrence_clean_r2.py
            python scripts/verify_stage1_recurrence_clean_r2.py
          fi
      - name: Persist new DATA if generated
        run: |
          if [ ! -d research/experiments/EXP-S1-REC-CLEAN-R2-20260919 ]; then
            echo "No DATA directory present"
            exit 1
          fi
          git add research/experiments/EXP-S1-REC-CLEAN-R2-20260919
          if git diff --cached --quiet; then
            echo "No new DATA to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: persist Stage 1 recurrence clean R2 DATA"
          git pull --rebase origin research/stage1-recurrence-clean-r2-20260919
          git push origin HEAD:research/stage1-recurrence-clean-r2-20260919

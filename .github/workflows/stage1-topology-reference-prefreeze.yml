name: Stage-1 topology reference pre-freeze gates

on:
  push:
    branches:
      - develop
    paths:
      - research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.json
      - reference/stage1_topology_brian2/runner_r2.py
      - reference/stage1_topology_brian2/reference_protocol_r2.json
      - reference/stage1_topology_brian2/TRANSLATION_R2.md
      - scripts/check_stage1_reference_independence.py
      - scripts/check_stage1_reference_seed_freshness_r2.py
      - scripts/run_stage1_reference_topology_mapping_r2.py
      - scripts/verify_stage1_reference_dynamics_reuse_r2.py
      - scripts/audit_stage1_reference_mechanisms.py
      - tests/test_stage1_reference_r2_contract.py
      - tests/test_stage1_reference_r2_preflight.py
      - .github/workflows/stage1-topology-reference-prefreeze.yml
      - src/core/neuron.py
      - src/core/neuron_models.py
      - src/core/network.py
      - scripts/run_stage1_topology_v2.py
      - configs/learning_experiment.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-topology-reference-prefreeze-r2-develop
  cancel-in-progress: true

jobs:
  prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and pinned reference framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'brian2==2.10.1'
      - name: Verify R1 historical and R2 active contracts
        run: |
          test -z "$(git status --porcelain)"
          python -m pytest             tests/test_stage1_reference_replication_contract.py             tests/test_stage1_reference_preflight.py             tests/test_stage1_reference_r2_contract.py             tests/test_stage1_reference_r2_preflight.py -q
      - name: Audit canonical mechanism semantics
        run: python scripts/audit_stage1_reference_mechanisms.py
      - name: Verify reference package independence
        run: python scripts/check_stage1_reference_independence.py
      - name: Verify R2 reference seed freshness
        run: python scripts/check_stage1_reference_seed_freshness_r2.py
      - name: Validate immutable R1 dynamics parity reuse for R2
        run: python scripts/verify_stage1_reference_dynamics_reuse_r2.py
      - name: Run exact R2 topology mapping parity
        run: python scripts/run_stage1_reference_topology_mapping_r2.py
      - name: Commit immutable pre-freeze audit artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/audits/STAGE1_TOPOLOGY_REFERENCE_MECHANISM_AUDIT_20260927.json             research/calibrations/CAL-S1-TOPO-REFERENCE-DYNAMICS-REUSE-R2/result.json             research/calibrations/CAL-S1-TOPO-REFERENCE-TOPOLOGY-MAP-R2/result.json
          if git diff --cached --quiet; then
            echo "Reference R2 pre-freeze artifacts are already current."
          else
            git commit -m "research(stage1): record R2 reference pre-freeze gates [stage1-ref-prefreeze-r2]"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage1-topology-reference-prefreeze-r2
          path: |
            research/audits/STAGE1_TOPOLOGY_REFERENCE_MECHANISM_AUDIT_20260927.json
            research/calibrations/CAL-S1-TOPO-REFERENCE-DYNAMICS-REUSE-R2/result.json
            research/calibrations/CAL-S1-TOPO-REFERENCE-TOPOLOGY-MAP-R2/result.json
          retention-days: 90

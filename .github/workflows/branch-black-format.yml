name: Branch Black Formatter

on:
  push:
    branches:
      - fix/neural-primitives-fullstack
    paths:
      - .github/workflows/branch-black-format.yml

permissions:
  contents: write

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/neural-primitives-fullstack
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned formatter
        run: python -m pip install black==26.5.1
      - name: Format repository Python
        run: python -m black src tests scripts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "style: apply Black 26.5.1"
          git push origin HEAD:fix/neural-primitives-fullstack

name: One-shot Ruff maintenance

on:
  push:
    branches: [fix/ci-gate-baseline]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-gate-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply repository-pinned Ruff fixes
        run: |
          python -m pip install 'ruff==0.16.6' 'black==26.5.1'
          python -m ruff check src tests scripts --fix
          python -m black src tests scripts
          python -m ruff check src tests scripts
          python -m black --check src tests scripts
      - name: Self-remove and commit
        run: |
          rm .github/workflows/one-shot-ruff-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts .github/workflows/one-shot-ruff-maintenance.yml
          git diff --cached --check
          git commit -m 'chore: apply pinned Ruff normalization'
          git push origin HEAD:fix/ci-gate-baseline

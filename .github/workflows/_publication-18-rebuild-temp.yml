name: Temporary publication 1.8 rebuild

on:
  push:
    branches:
      - fix/publication-18-consistency-20260918

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Rebuild deterministic Edition 1.8 outputs
        run: python scripts/build_publication_edition.py --write
      - name: Commit generated publication outputs
        run: |
          if git diff --quiet -- research/publications/2026-09-17_recursive-epistemics_v1.8; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          git commit -m "docs(publication): rebuild Edition 1.8 generated artifacts"
          git push

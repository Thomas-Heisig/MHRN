name: Stage-0 model conformance v2 confirmatory

on:
  push:
    branches:
      - science/stage0-model-conformance-v2-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install empirical baseline
        run: python -m pip install -e '.[empirical]'
      - name: Execute frozen confirmatory protocol
        run: python scripts/stage0_conformance_v2_confirm.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage0-model-conformance-v2-confirmatory
          path: stage0-conformance-v2-confirmatory.json
          retention-days: 90

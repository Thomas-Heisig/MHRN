name: Stage-0 one-shot Black autofix

on:
  push:
    branches:
      - science/stage0-model-conformance-v2-20260916

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: science/stage0-model-conformance-v2-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - name: Format CI-reported files
        run: >-
          python -m black
          scripts/stage0_conformance_v2_confirm.py
          scripts/stage0_scientific_diagnostic.py
          scripts/stage0_conformance_v2.py
          scripts/stage0_phase_model_diagnostic.py
          tests/test_single_neuron_scientific_readiness.py
          src/dashboard/experiment_archive.py
          src/dashboard/server.py
          tests/test_dashboard_embodiment_routes.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add scripts/stage0_conformance_v2_confirm.py scripts/stage0_scientific_diagnostic.py scripts/stage0_conformance_v2.py scripts/stage0_phase_model_diagnostic.py tests/test_single_neuron_scientific_readiness.py src/dashboard/experiment_archive.py src/dashboard/server.py tests/test_dashboard_embodiment_routes.py
          git commit -m "style: apply Black to CI-reported files"
          git pull --rebase origin science/stage0-model-conformance-v2-20260916
          git push origin HEAD:science/stage0-model-conformance-v2-20260916

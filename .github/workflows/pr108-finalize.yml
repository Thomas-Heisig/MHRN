name: PR108 finalize alpha4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr108-finalize.yml

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.number == 108 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Apply deterministic release and gate repair
        run: |
          python scripts/pr108_finalize_once.py
          python scripts/generate_cl002_freeze_manifest.py
          python - <<'PY'
          from pathlib import Path
          path = Path('research/publications/2026-09-15_recursive-epistemics_v1.7/README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Softwarelinie:** MHRN 0.6.0-alpha.4  \n', '**Softwarelinie:** MHRN 0.6.0-alpha.4\n')
          path.write_text(text, encoding='utf-8')
          PY
          python -m black tests/test_final_integration_20260911.py tests/test_release_registry.py src/version.py scripts/pr108_finalize_once.py
          python -m ruff check tests/test_final_integration_20260911.py tests/test_release_registry.py src/version.py scripts/pr108_finalize_once.py
      - name: Verify repaired regressions and frozen CL suites
        run: >-
          python -m pytest -q
          tests/test_final_integration_20260911.py
          tests/test_release_registry.py
          tests/test_continual_semantization_controls.py
          tests/test_continual_semantization_dose.py
          tests/test_semantic_memory.py
          tests/test_episodic_replay.py
      - name: Export exact tested final files
        run: |
          mkdir -p pr108-final
          for path in \
            .github/workflows/cl002-runner-freeze.yml \
            .github/workflows/cl003-runner-freeze.yml \
            CHANGELOG.md \
            HF_README.md \
            README.md \
            pyproject.toml \
            releases/current.json \
            research/preregistrations/frozen/EXP-S6-SEM-CL-002-FREEZE.json \
            research/publications/2026-09-15_recursive-epistemics_v1.7/README.md \
            src/version.py \
            tests/test_final_integration_20260911.py \
            tests/test_release_registry.py
          do
            cp --parents "$path" pr108-final/
          done
          printf '%s\n' \
            '.github/workflows/pr108-source-inspection.yml' \
            '.github/workflows/pr108-finalize.yml' \
            'scripts/pr108_finalize_once.py' > pr108-final/deletions.txt
          find pr108-final -type f -print0 | sort -z | xargs -0 sha256sum > pr108-final/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr108-final-tree
          path: pr108-final
          retention-days: 7

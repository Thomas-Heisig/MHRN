name: Stage-1 topology reference contract freeze

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/stage1-topology-reference-freeze.yml
      - scripts/freeze_stage1_topology_reference_r2.py
      - research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.json
      - research/audits/STAGE1_TOPOLOGY_REFERENCE_MECHANISM_AUDIT_20260927.json
      - research/calibrations/CAL-S1-TOPO-REFERENCE-INTEGRATOR-R1/result.json
      - research/calibrations/CAL-S1-TOPO-REFERENCE-RESET-R1/result.json
      - research/calibrations/CAL-S1-TOPO-REFERENCE-SYNAPSE-R1/result.json
      - research/calibrations/CAL-S1-TOPO-REFERENCE-TOPOLOGY-MAP-R2/result.json
      - research/calibrations/CAL-S1-TOPO-REFERENCE-DYNAMICS-REUSE-R2/result.json
      - scripts/verify_stage1_reference_dynamics_reuse_r2.py
      - scripts/check_stage1_reference_independence.py
      - scripts/check_stage1_reference_seed_freshness_r2.py
      - scripts/verify_stage1_topology_reference_r2.py
      - reference/stage1_topology_brian2/runner_r2.py
      - reference/stage1_topology_brian2/TRANSLATION_R2.md
      - reference/stage1_topology_brian2/reference_protocol_r2.json
      - tests/test_stage1_reference_r2_contract.py
      - tests/test_stage1_reference_r2_preflight.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-topology-reference-freeze-r2-develop
  cancel-in-progress: true

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage1-ref-freeze-r2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and pinned reference framework
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'brian2==2.10.1'
      - name: Check R2 freeze eligibility
        id: eligibility
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.json").read_text())
          files={
            "audit":Path("research/audits/STAGE1_TOPOLOGY_REFERENCE_MECHANISM_AUDIT_20260927.json"),
            "integrator":Path("research/calibrations/CAL-S1-TOPO-REFERENCE-INTEGRATOR-R1/result.json"),
            "reset":Path("research/calibrations/CAL-S1-TOPO-REFERENCE-RESET-R1/result.json"),
            "synapse":Path("research/calibrations/CAL-S1-TOPO-REFERENCE-SYNAPSE-R1/result.json"),
            "topology":Path("research/calibrations/CAL-S1-TOPO-REFERENCE-TOPOLOGY-MAP-R2/result.json"),
            "dynamics_reuse":Path("research/calibrations/CAL-S1-TOPO-REFERENCE-DYNAMICS-REUSE-R2/result.json"),
          }
          values={k:(json.loads(v.read_text()) if v.exists() else {}) for k,v in files.items()}
          eligible=(p.get("status")=="DRAFT_PRE_FREEZE_GATES_PENDING" and p.get("execution_authorized") is False and all(v.get("pass") is True for v in values.values()) and values["integrator"].get("multi_tick",{}).get("pass") is True and values["integrator"].get("multi_tick",{}).get("contains_spike") is True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f: f.write(f"eligible={'true' if eligible else 'false'}\n")
          print({k:v.get("pass") for k,v in values.items()},"eligible=",eligible)
          PY
      - name: Write R2 gate summary
        if: always()
        run: |
          echo "## Stage-1 reference R2 pre-freeze gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "R1 remains historical and aborted before DATA. R2 is the only eligible protocol." >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze corrected R2 contract only
        if: steps.eligibility.outputs.eligible == 'true'
        run: python scripts/freeze_stage1_topology_reference_r2.py
      - name: Assert execution remains unauthorized
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.json").read_text())
          f=json.loads(Path("research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.freeze.json").read_text())
          assert p["status"]=="FROZEN_BEFORE_REFERENCE_EXECUTION_AUTHORIZATION"
          assert p["execution_authorized"] is False
          assert f["execution_authorized"] is False
          assert f["reference_data_created"] is False
          assert f["replication_credit_awarded"] is False
          PY
      - name: Commit immutable R2 freeze
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.json research/preregistrations/PREREG-S1-TOPO-REFERENCE-R2.freeze.json
          git diff --cached --check
          git commit -m "research(stage1): freeze corrected topology reference R2 [stage1-ref-freeze-r2]"
          git pull --rebase origin develop
          git push origin HEAD:develop
      - name: Report pending gates without failing
        if: steps.eligibility.outputs.eligible != 'true'
        run: echo "R2 freeze skipped because one or more pre-freeze gates are pending."

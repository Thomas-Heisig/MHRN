name: Temporary CL002 Format Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/exp-s6-sem-cl-002-runner-freeze-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install canonical formatter
        run: python -m pip install black==26.5.1
      - name: Format CL-002 freeze implementation
        run: |
          python -m black \
            scripts/generate_cl002_freeze_manifest.py \
            scripts/run_semantization_split_mnist_cl002.py \
            src/research/continual_semantization_controls.py
      - name: Commit exact formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate_cl002_freeze_manifest.py \
            scripts/run_semantization_split_mnist_cl002.py \
            src/research/continual_semantization_controls.py
          git commit -m "chore: format CL-002 freeze implementation"
          git push origin HEAD:research/exp-s6-sem-cl-002-runner-freeze-20260915

name: CI repair runner

on:
  push:
    branches:
      - fix/main-ci-version-green
    paths:
      - .github/workflows/ci-repair-run.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-ci-version-green
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply strict typing repairs
        run: |
          mkdir -p .maintenance
          curl -fsSL https://raw.githubusercontent.com/Thomas-Heisig/MHRN/32ffb2f3a52cf3718ec7a7bfd6d1c4e2e3116bd1/.maintenance/repair_pyright_boundaries.py -o .maintenance/repair_pyright_boundaries.py
          curl -fsSL https://raw.githubusercontent.com/Thomas-Heisig/MHRN/32ffb2f3a52cf3718ec7a7bfd6d1c4e2e3116bd1/.maintenance/fix_repair_observation.py -o .maintenance/fix_repair_observation.py
          python .maintenance/fix_repair_observation.py
          python .maintenance/repair_pyright_boundaries.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/homeostasis/hot_path.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('def _hot_hot_clamp(', 'def _hot_clamp(')
          path.write_text(text, encoding='utf-8')

          path = Path('src/research_assistant/governance.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'int(typed_raw.get("version", 0))',
              'int(cast(int | float | str | bytes | bytearray, typed_raw.get("version", 0)))',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/research_assistant/airr.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if isinstance(raw, dict) and raw.get("role") == role:\n                    return AIAnalysisRecord(**cast(dict[str, Any], raw))'''
          new = '''                if isinstance(raw, dict):\n                    typed_raw = cast(dict[str, Any], raw)\n                    if typed_raw.get("role") == role:\n                        return AIAnalysisRecord(**typed_raw)'''
          if old not in text:
              raise SystemExit('AIRR JSON boundary block not found after repair')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/research_assistant/causal.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _string_tuple(value: object, field: str) -> tuple[str, ...]:\n    if not isinstance(value, (list, tuple)) or not all(\n        isinstance(item, str) and item.strip() for item in value\n    ):\n        raise ValueError(f"Causal attribution {field} must contain strings")\n    values = cast(list[object] | tuple[object, ...], value)\n    return tuple(cast(str, item) for item in values)'''
          new = '''def _string_tuple(value: object, field: str) -> tuple[str, ...]:\n    if not isinstance(value, (list, tuple)):\n        raise ValueError(f"Causal attribution {field} must contain strings")\n    values = cast(list[object] | tuple[object, ...], value)\n    if not all(isinstance(item, str) and item.strip() for item in values):\n        raise ValueError(f"Causal attribution {field} must contain strings")\n    return tuple(cast(str, item) for item in values)'''
          if old not in text:
              raise SystemExit('causal string tuple block not found after repair')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/research_assistant/config_tool.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        mapping = cast(dict[str, Any], current)\n',
              '        mapping = current\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/research_assistant/models.py')
          text = path.read_text(encoding='utf-8')
          old = '''    concerns = normalized.get("methodological_concerns")\n    if not isinstance(concerns, list):\n        concerns = []\n    else:\n        concerns = list(cast(list[Any], concerns))\n    concerns.append('''
          new = '''    concerns = normalized.get("methodological_concerns")\n    typed_concerns: list[Any]\n    if not isinstance(concerns, list):\n        typed_concerns = []\n    else:\n        typed_concerns = concerns\n    typed_concerns.append('''
          if old not in text:
              raise SystemExit('model concerns block not found after repair')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    normalized["methodological_concerns"] = concerns\n',
              '    normalized["methodological_concerns"] = typed_concerns\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/storage/incremental_runtime.py')
          text = path.read_text(encoding='utf-8')
          scalar = 'int | float | str | bytes | bytearray'
          text = text.replace(
              'int(value) for value in cast(set[object], neuron_dirty)',
              f'int(cast({scalar}, value)) for value in cast(set[object], neuron_dirty)',
          )
          text = text.replace(
              '(int(source_id), int(target_id))\n                for source_id, target_id in cast(set[tuple[object, object]], synapse_dirty)',
              f'(int(cast({scalar}, source_id)), int(cast({scalar}, target_id)))\n                for source_id, target_id in cast(set[tuple[object, object]], synapse_dirty)',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/dashboard/server.py')
          text = path.read_text(encoding='utf-8')
          old = '''            def _ollama_generate(prompt: str) -> str:\n                return ollama.generate_text(\n                    prompt,\n                    images=images,\n                    tools=(\n                        []\n                        if not self.dashboard_server.research_chat_tools_enabled\n                        else []\n                    ),\n                )'''
          new = '''            def _ollama_generate(prompt: str) -> str:\n                generated_text, _metadata = ollama.generate_text(\n                    prompt,\n                    images=images,\n                    tools=(\n                        []\n                        if not self.dashboard_server.research_chat_tools_enabled\n                        else []\n                    ),\n                )\n                return generated_text'''
          if old not in text:
              raise SystemExit('typed Ollama wrapper not found after repair')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Update browser smoke path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser_check.py')
          text = path.read_text(encoding='utf-8')
          old = '''                plan_view = page.locator('[data-research-workspace-view="plan"]')\n                plan_view.wait_for(state="attached", timeout=timeout_ms)\n                plan_view.evaluate("button => button.click()")\n'''
          if old in text:
              text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install project checks
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Format lint and type-check
        run: |
          python -m black src tests scripts
          python -m ruff check --fix src tests scripts
          python -m black src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src/
          python -m pyright
      - name: Verify version registry
        run: |
          python -m pytest -q tests/test_release_registry.py tests/test_profiles.py
      - name: Commit repaired product sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git diff --cached --check
          git commit -m "fix: restore CI type and browser contracts"
          git push origin HEAD:fix/main-ci-version-green

name: Stage-0 scientific diagnostic

on:
  push:
    branches:
      - fix/stage0-scientific-readiness-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install empirical baseline
        run: python -m pip install -e '.[empirical]'
      - name: Run Stage-0 diagnostic
        run: python scripts/stage0_scientific_diagnostic.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage0-scientific-diagnostic
          path: stage0-science-diagnostic.json
          retention-days: 30

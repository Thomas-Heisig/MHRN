name: CL-003 Runner Freeze

on:
  push:
    branches:
      - research/exp-s6-sem-cl-003-runner-freeze-20260915
    paths-ignore:
      - research/preregistrations/frozen/EXP-S6-SEM-CL-003-FREEZE.json
  pull_request:
    branches:
      - main
    paths:
      - src/research/continual_semantization_dose.py
      - scripts/run_semantization_split_mnist_cl003.py
      - scripts/generate_cl003_freeze_manifest.py
      - tests/test_continual_semantization_dose.py
      - research/preregistrations/EXP-S6-SEM-CL-003.md
      - research/preregistrations/operational/EXP-S6-SEM-CL-003.json

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Normalize frozen Python sources
        run: |
          python -m black src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py
          python -m ruff check --fix src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py
      - name: Synthetic CL-003 tests only
        run: >-
          python -m pytest -q
          tests/test_continual_semantization_dose.py
          tests/test_continual_semantization_controls.py
          tests/test_semantic_memory.py
      - name: Validate execution gate without producing empirical DATA
        run: |
          if test -f research/preregistrations/authorizations/EXP-S6-SEM-CL-003.json; then
            python -c 'import importlib.util, pathlib; p=pathlib.Path("scripts/run_semantization_split_mnist_cl003.py"); s=importlib.util.spec_from_file_location("cl003_runner", p); assert s is not None and s.loader is not None; m=importlib.util.module_from_spec(s); s.loader.exec_module(m); a=m._require_authorization(m.DEFAULT_AUTHORIZATION); h=m._verify_freeze(m.DEFAULT_FREEZE); assert a["execution_authorized"] is True and h'
          else
            if python scripts/run_semantization_split_mnist_cl003.py --output /tmp/forbidden-cl003; then
              echo "CL-003 unexpectedly executed without authorization" >&2
              exit 1
            fi
          fi
      - name: Generate SHA-256 freeze manifest
        run: python scripts/generate_cl003_freeze_manifest.py
      - name: Verify formatting and lint
        run: |
          python -m black --check src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py
          python -m ruff check src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py
      - name: Commit normalized sources and freeze manifest on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py research/preregistrations/frozen/EXP-S6-SEM-CL-003-FREEZE.json; then
            echo "Frozen sources and manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/continual_semantization_dose.py scripts/run_semantization_split_mnist_cl003.py scripts/generate_cl003_freeze_manifest.py tests/test_continual_semantization_dose.py research/preregistrations/frozen/EXP-S6-SEM-CL-003-FREEZE.json
          git commit -m "research: normalize and freeze CL-003 sources"
          git push

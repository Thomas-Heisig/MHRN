name: Edition 1.8 final materialize

on:
  push:
    branches:
      - docs/edition-1-8-corpus-integration

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Integrate latest approved proposal
        run: python scripts/one_shot_integrate_lp20260917194217.py
      - name: Materialize and verify Edition 1.8
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/build_publication_edition.py --check
      - name: Publication and governance tests
        run: pytest -q tests/test_publication_edition.py tests/test_publication_v17_document_governance.py tests/test_empirical_publication.py
      - name: Commit materialized publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'docs(publication): materialize latest Stage-6 proposal in edition 1.8'
          git push

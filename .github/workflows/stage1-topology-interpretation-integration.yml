name: Stage-1 topology interpretation integration

on:
  push:
    branches:
      - fix/stage1-topology-review-interpretation-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage1-review-build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen Stage-1 DATA
        run: python scripts/verify_stage1_topology_v2.py

      - name: Test report and publication boundaries
        run: |
          python -m pytest tests/test_research_report_generation.py tests/test_publication_edition.py tests/test_review_inbox.py -q

      - name: Rebuild current research reports
        run: python research/generate_reports.py

      - name: Rebuild Edition 1.8
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/build_publication_edition.py --check

      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated research/publications/2026-09-17_recursive-epistemics_v1.8
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "docs(research): rebuild topology review integration [stage1-review-build]"
            git push origin HEAD:${{ github.ref_name }}
          fi

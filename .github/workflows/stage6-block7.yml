name: Stage 6 block 7

on:
  push:
    branches: [feature/stage6-decision-benefit-dissertation-20260915]
    paths:
      - src/memory/world_model_evaluation.py
      - src/memory/__init__.py
      - tests/test_world_model_evaluation.py
      - .github/workflows/stage6-block7.yml

permissions:
  contents: read

jobs:
  block7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Offline decision-benefit regressions
        run: >-
          python -m pytest -q
          tests/test_world_model_evaluation.py
          tests/test_multistep_world_model.py
      - name: Black diff
        run: python -m black --diff src/memory/world_model_evaluation.py tests/test_world_model_evaluation.py
      - name: Formatting and lint
        run: |
          python -m black --check src/memory/world_model_evaluation.py src/memory/__init__.py tests/test_world_model_evaluation.py
          python -m ruff check src/memory/world_model_evaluation.py src/memory/__init__.py tests/test_world_model_evaluation.py
      - name: Strict typing
        run: |
          python -m mypy src/memory/world_model_evaluation.py
          python -m pyright src/memory/world_model_evaluation.py

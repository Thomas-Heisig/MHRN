name: Alpha3 Scientific Publication Integration

on:
  push:
    branches: [work/scientific-main-audit-20260913]
    paths: [.github/workflows/scientific-publication-alpha3.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha3-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication:
    if: github.ref_name == 'work/scientific-main-audit-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      BRAIN5D_RUN_LARGE_STORAGE_TEST: '1'
      BRAIN5D_RUN_LARGE_STORAGE_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Correct identified transport duplication and apply hash-guarded sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.maintenance/alpha3-source-part-2.json')
          if p.exists():
              x = json.loads(p.read_text())
              x['gzip_base64'] = x['gzip_base64'].replace('WyXpkjjrs', 'WyXpkjrs')
              p.write_text(json.dumps(x) + '\n')
          PY
          python .maintenance/publish_alpha3.py sources
      - name: Install document and browser system dependencies
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -qF 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$source.disabled-for-playwright"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer fonts-liberation
          python -m pip install -e '.[dev,docs,browser,empirical]' pre-commit bandit build
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned E2E browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build complete documents, verify history, execute checks and commit actual receipts
        run: python .maintenance/publish_alpha3.py
      - name: Always export the actual source and working-tree diagnostics
        if: always()
        run: |
          mkdir -p /tmp/alpha3-publication
          git rev-parse HEAD > /tmp/alpha3-publication/source-sha.txt
          git status --porcelain=v1 > /tmp/alpha3-publication/git-status.txt
          git diff > /tmp/alpha3-publication/uncommitted.patch
          git bundle create /tmp/alpha3-publication/source-final.bundle --all
      - name: Upload documents, logs, traces and source-bound results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-publication-alpha3-${{ github.run_id }}
          path: |
            /tmp/alpha3-publication/
            playwright-report/
            test-results/
          retention-days: 30

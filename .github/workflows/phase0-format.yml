name: Phase 0 Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase0-format.yml
      - src/research/report_builder.py
      - tests/test_research_object_mapping_schema.py

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/research-driven-experiment-workflow-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project formatter
        run: python -m pip install -e '.[dev]'
      - name: Format Phase 0 Python files
        run: python -m black src/research/report_builder.py tests/test_research_object_mapping_schema.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/research/report_builder.py tests/test_research_object_mapping_schema.py; then
            echo "Phase 0 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/report_builder.py tests/test_research_object_mapping_schema.py
          git commit -m "style: black-format Phase 0 research files"
          git push

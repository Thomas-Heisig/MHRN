name: PAN branch sync and format once

on:
  push:
    branches:
      - playground-meta-night-run-20260927

permissions:
  contents: write

jobs:
  sync-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playground-meta-night-run-20260927
          fetch-depth: 0
      - name: Merge current develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-commit -X ours origin/develop
      - name: Install formatter
        run: python -m pip install -e ".[dev]"
      - name: Format repository
        run: python -m black src tests scripts
      - name: Commit synchronized branch
        run: |
          rm -f .github/workflows/zz_pan_sync_format_once.yml
          git add -A
          git commit -m "chore(playground): sync develop and format Python"
          git push origin HEAD:playground-meta-night-run-20260927

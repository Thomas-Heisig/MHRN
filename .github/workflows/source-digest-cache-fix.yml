name: One-shot source digest cache repair

on:
  push:
    branches:
      - fix/main-ci-version-cl003-20260916
    paths:
      - .github/workflows/source-digest-cache-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-ci-version-cl003-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Add content-bound verification cache
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dashboard/verification.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import subprocess\n', 'import subprocess\nimport threading\n', 1)
          marker = '@dataclass(frozen=True, slots=True)\nclass SourceTreeInspection:\n'
          insert = '''_INSPECTION_CACHE_LOCK = threading.RLock()\n_INSPECTION_CACHE: dict[tuple[str, tuple[str, ...], str], "SourceTreeInspection"] = {}\n_INSPECTION_CACHE_MAX_ENTRIES = 32\n\n\n'''
          if marker not in text:
              raise SystemExit('SourceTreeInspection marker missing')
          text = text.replace(marker, insert + marker, 1)

          marker = '''def inspect_source_tree(\n    repo_root: Path,\n    paths: list[str] | None = None,\n) -> SourceTreeInspection:\n'''
          helper = '''def _source_state_fingerprint(repo_root: Path, paths: list[str]) -> str | None:\n    """Return a cheap content-bound key for one Git working-tree scope.\n\n    The key includes HEAD, the complete tracked diff against HEAD and relevant\n    untracked file bytes. It therefore changes for staged, unstaged and\n    untracked edits while avoiding a full clean-tree blob scan on every\n    dashboard poll.\n    """\n    head = _git_output(repo_root, ["rev-parse", "HEAD"])\n    if head is None:\n        return None\n    diff = _git_output(repo_root, ["diff", "--binary", "HEAD", "--", *paths])\n    if diff is None:\n        return None\n    untracked = _git_scope_paths(repo_root, paths, untracked=True)\n    hasher = hashlib.sha256()\n    hasher.update(head)\n    hasher.update(b"\\0")\n    hasher.update(diff)\n    hasher.update(b"\\0")\n    for relative in sorted(untracked):\n        path = repo_root / relative\n        if not _is_digest_file(path, repo_root):\n            continue\n        hasher.update(relative.encode("utf-8", "surrogateescape"))\n        hasher.update(b"\\0")\n        try:\n            hasher.update(path.read_bytes())\n        except OSError:\n            hasher.update(b"<missing>")\n        hasher.update(b"\\0")\n    return hasher.hexdigest()\n\n\ndef _cached_source_tree_inspection(\n    repo_root: Path, paths: list[str] | None = None\n) -> SourceTreeInspection:\n    """Reuse an inspection only while its exact Git/content fingerprint matches."""\n    all_paths = paths if paths is not None else SCIENTIFIC_PATHS + TEST_PATHS\n    fingerprint = _source_state_fingerprint(repo_root, all_paths)\n    if fingerprint is None:\n        return inspect_source_tree(repo_root, all_paths)\n    key = (str(repo_root.resolve()), tuple(all_paths), fingerprint)\n    with _INSPECTION_CACHE_LOCK:\n        cached = _INSPECTION_CACHE.get(key)\n        if cached is not None:\n            return cached\n    inspection = inspect_source_tree(repo_root, all_paths)\n    with _INSPECTION_CACHE_LOCK:\n        if len(_INSPECTION_CACHE) >= _INSPECTION_CACHE_MAX_ENTRIES:\n            _INSPECTION_CACHE.clear()\n        _INSPECTION_CACHE[key] = inspection\n    return inspection\n\n\n'''
          if marker not in text:
              raise SystemExit('inspect_source_tree marker missing')
          text = text.replace(marker, helper + marker, 1)
          old = 'return inspect_source_tree(repo_root, paths).digest'
          if old not in text:
              raise SystemExit('compute_source_tree_digest body missing')
          text = text.replace(old, 'return _cached_source_tree_inspection(repo_root, paths).digest', 1)
          old = 'inspection = inspect_source_tree(repo_root)\n    current_tree_digest = inspection.digest'
          if old not in text:
              raise SystemExit('evaluate_test_baseline inspection missing')
          text = text.replace(old, 'inspection = _cached_source_tree_inspection(repo_root)\n    current_tree_digest = inspection.digest', 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_source_digest.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_relevant_dirty_file_is_reported(tmp_path: Path) -> None:\n'
          regression = '''def test_cached_digest_invalidates_when_tracked_content_changes(tmp_path: Path) -> None:\n    source = tmp_path / "src" / "module.py"\n    source.parent.mkdir()\n    source.write_text("value = 1\\n", encoding="utf-8")\n    _git_repo(tmp_path)\n    first = compute_source_tree_digest(tmp_path, ["src/"])\n    assert first is not None\n    source.write_text("value = 2\\n", encoding="utf-8")\n    second = compute_source_tree_digest(tmp_path, ["src/"])\n    assert second is not None\n    assert second != first\n\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker missing')
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m pip install -e '.[dev,docs]'
          python -m black src/dashboard/verification.py tests/test_source_digest.py
          python -m ruff check src/dashboard/verification.py tests/test_source_digest.py
          python -m mypy src/dashboard/verification.py
          python -m pytest tests/test_source_digest.py tests/test_gate_status.py tests/test_dashboard_completion.py -q
          git diff --check
          rm .github/workflows/source-digest-cache-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard/verification.py tests/test_source_digest.py .github/workflows/source-digest-cache-fix.yml
          git commit -m 'perf: cache content-bound source-tree verification'
          git push

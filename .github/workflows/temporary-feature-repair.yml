name: Temporary Feature Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/research-docs-publication-v1.7-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install canonical formatter
        run: python -m pip install black==26.5.1
      - name: Narrow optional value and format CI targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research/continual_semantization.py")
          text = path.read_text(encoding="utf-8")
          outer = "    for task_index in range(len(TASKS) - 1):\n"
          outer_index = text.index(outer)
          start = text.index("        history = [\n", outer_index)
          end_marker = "        forgetting_values.append(max(history) - history[-1])"
          end = text.index(end_marker, start)
          replacement = (
              "        history: list[float] = []\n"
              "        for row in accuracy_rows[task_index:]:\n"
              "            value = row[task_index]\n"
              "            if value is not None:\n"
              "                history.append(float(value))\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          python -m black \
            scripts/check_scientific_maturity_integrity.py \
            scripts/audit_document_governance.py \
            src/research/continual_semantization.py \
            tests/test_continual_semantization.py \
            tests/test_episodic_replay.py \
            tests/test_publication_v16_scientific_maturity.py \
            tests/test_publication_v17_document_governance.py \
            tests/test_publication_scholar_reader.py
      - name: Commit exact repairs to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/temporary-black-repair.yml ]; then
            git rm .github/workflows/temporary-black-repair.yml
          fi
          git add \
            scripts/check_scientific_maturity_integrity.py \
            scripts/audit_document_governance.py \
            src/research/continual_semantization.py \
            tests/test_continual_semantization.py \
            tests/test_episodic_replay.py \
            tests/test_publication_v16_scientific_maturity.py \
            tests/test_publication_v17_document_governance.py \
            tests/test_publication_scholar_reader.py
          git commit -m "chore: apply canonical Black formatting and type narrowing"
          git push origin HEAD:feature/research-docs-publication-v1.7-20260915

name: Stage-1 topology efficiency calibration

on:
  push:
    branches:
      - develop
    paths:
      - research/preregistrations/PREREG-S1-TOPO-EFFICIENCY-R1.json
      - scripts/check_stage1_efficiency_seed_freshness.py
      - scripts/run_stage1_topology_efficiency_calibration.py
      - scripts/verify_stage1_topology_efficiency_calibration.py
      - tests/test_stage1_topology_efficiency_contract.py
      - .github/workflows/stage1-topology-efficiency-calibration.yml
      - scripts/run_stage1_topology_v2.py
      - src/**
      - configs/learning_experiment.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-topology-efficiency-calibration-develop
  cancel-in-progress: false

jobs:
  calibrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage1-eff-cal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify DRAFT or freeze-blocked contract
        run: |
          test -z "$(git status --porcelain)"
          python -m pytest \
            tests/test_stage1_topology_efficiency_contract.py \
            tests/test_small_snn_contract.py -q

      - name: Check calibration eligibility
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prereg = json.loads(
              Path("research/preregistrations/PREREG-S1-TOPO-EFFICIENCY-R1.json").read_text(
                  encoding="utf-8"
              )
          )
          calibration_exists = Path(
              "research/calibrations/CAL-S1-TOPO-EFFICIENCY-R1-20260927"
          ).exists()
          eligible = (
              prereg.get("status") == "DRAFT_BEFORE_FREEZE"
              and prereg.get("execution_authorized") is False
              and not calibration_exists
          )
          blocked = prereg.get("status") == "DRAFT_CALIBRATION_GATE_FAILED_FREEZE_BLOCKED"
          print(f"blocked={blocked}")
          print(f"calibration_exists={calibration_exists}")
          print(f"eligible={eligible}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"eligible={'true' if eligible else 'false'}\n")
          PY

      - name: Run calibration-only control sweep
        if: steps.gate.outputs.eligible == 'true'
        run: python scripts/run_stage1_topology_efficiency_calibration.py

      - name: Verify calibration
        if: steps.gate.outputs.eligible == 'true'
        run: python scripts/verify_stage1_topology_efficiency_calibration.py

      - name: Commit immutable calibration DATA
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/calibrations/CAL-S1-TOPO-EFFICIENCY-R1-20260927
          if git diff --cached --quiet; then
            echo "No calibration changes."
          else
            git commit -m "research(stage1): record topology efficiency calibration [stage1-eff-cal]"
            git push origin HEAD:develop
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.eligible == 'true'
        with:
          name: stage1-topology-efficiency-calibration
          path: research/calibrations/CAL-S1-TOPO-EFFICIENCY-R1-20260927
          retention-days: 90

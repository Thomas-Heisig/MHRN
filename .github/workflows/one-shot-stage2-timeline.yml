name: One-shot Stage-2 timeline completion

on:
  push:
    branches: [feature/stage2-recurrent-snn]
    paths: [.github/workflows/one-shot-stage2-timeline.yml]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/stage2-recurrent-snn
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Complete Stage-2 repository projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/dashboard/development_timeline.py")
          text = path.read_text(encoding="utf-8")

          start = text.index('        StageSpec(\n            2,\n            "recurrent_snn",')
          end = text.index('        StageSpec(\n            3,\n            "plastic_neural_tissue",', start)
          stage = text[start:end]

          criterion_pattern = re.compile(
              r'''                CriterionSpec\(\n'''
              r'''                    "recurrent_network",\n'''
              r'''                    "Recurrent network execution",\n'''
              r'''                    paths=\("src/core/network\.py",\),\n'''
              r'''                \),\n'''
              r'''                CriterionSpec\(\n'''
              r'''                    "deterministic_runtime",\n'''
              r'''                    "Deterministic runtime state",\n'''
              r'''                    paths=\("src/controller/runtime\.py",\),\n'''
              r'''                    tests=\("tests/test_v06_pause_resume_identity\.py",\),\n'''
              r'''                \),'''
          )
          criterion_replacement = '''                CriterionSpec(
                      "recurrent_network",
                      "Recurrent network execution",
                      paths=("src/core/network.py",),
                      tests=("tests/test_recurrent_snn_contract.py",),
                      verification=(
                          "research/generated/verification/recurrent_snn_reference.json",
                      ),
                  ),
                  CriterionSpec(
                      "deterministic_runtime",
                      "Deterministic runtime state",
                      paths=("src/controller/runtime.py",),
                      tests=(
                          "tests/test_v06_pause_resume_identity.py",
                          "tests/test_recurrent_snn_contract.py",
                      ),
                      verification=(
                          "research/generated/verification/recurrent_snn_reference.json",
                      ),
                  ),'''
          stage, count = criterion_pattern.subn(criterion_replacement, stage, count=1)
          if count != 1:
              raise SystemExit(f"Stage-2 criterion replacement count={count}")

          metadata_pattern = re.compile(
              r'''            \("tests/test_v06_pause_resume_identity\.py",\),\n'''
              r'''            \("research/protocols",\),\n'''
              r'''            \("RQ-SNN-001", "RQ10"\),\n'''
              r'''            \("A deterministic runtime is not a claim about cognition\.",\),\n'''
              r'''            \(\),\n'''
              r'''            \(\),'''
          )
          metadata_replacement = '''            (
                  "tests/test_v06_pause_resume_identity.py",
                  "tests/test_recurrent_snn_contract.py",
                  "tests/test_recurrent_snn_timeline.py",
                  "tests/test_recurrent_snn_frontend.py",
              ),
              (
                  "research/protocols",
                  "research/experiments/EXP-BATCH-20260908200906-01",
              ),
              ("RQ-SNN-001", "RQ10"),
              (
                  "A deterministic runtime is not a claim about cognition.",
                  "The scoped four-neuron ring does not establish target-scale tractability or stability for arbitrary recurrent networks.",
              ),
              (),
              ("Benchmark recurrent stability and throughput at the declared 1,000-10,000 neuron Stage-2 scale.",),'''
          stage, count = metadata_pattern.subn(metadata_replacement, stage, count=1)
          if count != 1:
              raise SystemExit(f"Stage-2 metadata replacement count={count}")

          path.write_text(text[:start] + stage + text[end:], encoding="utf-8")
          PY
      - name: Install test tools
        run: python -m pip install -e ".[dev,docs]"
      - name: Format and verify Stage 2
        run: |
          python -m black src/dashboard/development_timeline.py tests/test_recurrent_snn_contract.py tests/test_recurrent_snn_timeline.py tests/test_recurrent_snn_frontend.py
          python -m ruff check src/dashboard/development_timeline.py tests/test_recurrent_snn_contract.py tests/test_recurrent_snn_timeline.py tests/test_recurrent_snn_frontend.py --fix
          python -m black --check src/dashboard/development_timeline.py tests/test_recurrent_snn_contract.py tests/test_recurrent_snn_timeline.py tests/test_recurrent_snn_frontend.py
          python -m pytest -q tests/test_recurrent_snn_contract.py tests/test_recurrent_snn_timeline.py tests/test_recurrent_snn_frontend.py tests/test_small_snn_contract.py tests/test_v06_pause_resume_identity.py
      - name: Commit verified Stage-2 completion
        run: |
          rm .github/workflows/one-shot-stage2-timeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: complete Stage-2 recurrent SNN verification"
          git push origin HEAD:feature/stage2-recurrent-snn

name: One-shot SNN stability v2 research cycle

on:
  push:
    branches:
      - research/snn-stability-v2-20260916
    paths:
      - .github/workflows/zz-snn-stability-v2-20260916.yml

permissions:
  contents: write

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: research/snn-stability-v2-20260916

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"

      - name: Execute frozen research cycle
        run: python scripts/one_shot_snn_v2_cycle.py

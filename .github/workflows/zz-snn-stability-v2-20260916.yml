name: One-shot SNN stability v2 research cycle

on:
  push:
    branches:
      - research/snn-stability-v2-20260916
    paths:
      - .github/workflows/zz-snn-stability-v2-20260916.yml

permissions:
  contents: write

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: research/snn-stability-v2-20260916

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"

      - name: Register v2 protocol before any execution
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "src/research/protocol_registry.py",
              '    "sustained_activity_stability_v1": "run_sustained_stability",\n',
              '    "sustained_activity_stability_v1": "run_sustained_stability",\n    "sustained_activity_stability_v2": "run_sustained_stability_v2",\n',
          )

          replace_exact(
              "src/dashboard/experiment_workflow.py",
              '''        if hasattr(experiment_suite, runner_name):\n            runner_module: ModuleType = experiment_suite\n        else:\n            from src.research import followup_experiments\n\n            runner_module = followup_experiments\n        runner = getattr(runner_module, runner_name)\n''',
              '''        if hasattr(experiment_suite, runner_name):\n            runner_module: ModuleType = experiment_suite\n        else:\n            from src.research import followup_experiments, stability_followups\n\n            if hasattr(followup_experiments, runner_name):\n                runner_module = followup_experiments\n            elif hasattr(stability_followups, runner_name):\n                runner_module = stability_followups\n            else:\n                raise WorkflowValidationError(\n                    f"Registered runner '{runner_name}' is not implemented."\n                )\n        runner = getattr(runner_module, runner_name)\n''',
          )
          replace_exact(
              "src/dashboard/experiment_workflow.py",
              '        if runner_name == "run_sustained_stability":\n',
              '        if runner_name in {"run_sustained_stability", "run_sustained_stability_v2"}:\n',
          )

          replace_exact(
              "src/research/stability_followups.py",
              'import argparse\nimport json\n',
              'import argparse\nimport hashlib\nimport json\n',
          )

          marker = '\n\ndef _parse_seeds(value: str) -> tuple[int, ...]:\n'
          runner = r'''


def run_sustained_stability_v2(
    config: Config,
    seeds: tuple[int, ...] = tuple(range(101, 111)),
    ticks: int = 100_000,
    jitter_fraction: float = 0.05,
) -> list[ScientificRun]:
    """Confirm long-horizon stability across distinct seed-bound parameterizations.

    V1 proved deterministic stability for one fixed parameterization but its seed
    labels did not materially alter the tested dynamics. V2 preregisters a paired
    robustness design: each seed deterministically generates one synaptic-weight
    scale and one tonic-drive scale within +/- ``jitter_fraction``. The no-input
    control and tonic-drive treatment for a seed share that parameterization.

    Distinct parameter digests are required before execution. They document
    genuinely different model parameterizations; they are not represented as
    statistically independent biological samples.
    """
    if len(seeds) < 1:
        raise ValueError("sustained stability v2 requires at least one seed")
    if not 0.0 < jitter_fraction < 1.0:
        raise ValueError("jitter_fraction must be between 0 and 1")

    realizations: dict[int, tuple[float, float, str]] = {}
    for seed in seeds:
        rng = random.Random(seed ^ 0x5A81B17)
        weight_scale = 1.0 + rng.uniform(-jitter_fraction, jitter_fraction)
        drive_scale = 1.0 + rng.uniform(-jitter_fraction, jitter_fraction)
        encoded = json.dumps(
            {
                "weight_scale": round(weight_scale, 12),
                "drive_scale": round(drive_scale, 12),
            },
            sort_keys=True,
            separators=(",", ":"),
        ).encode("utf-8")
        digest = hashlib.sha256(encoded).hexdigest()
        realizations[seed] = (weight_scale, drive_scale, digest)

    digests = [value[2] for value in realizations.values()]
    if len(set(digests)) != len(digests):
        raise ValueError("seed-bound parameterizations are not unique")

    runs: list[ScientificRun] = []
    for seed in seeds:
        weight_scale, drive_scale, digest = realizations[seed]
        for condition in ("no_input_control", "tonic_drive"):
            base = _simulate_condition(
                config,
                experiment_id="EXP-SNN-STABILITY-V2",
                condition=condition,
                seed=seed,
                ticks=ticks,
                mode="none" if condition == "no_input_control" else "tonic",
                drive_current=0.0 if condition == "no_input_control" else 50.0,
                weight_scale=weight_scale,
                drive_scale=drive_scale,
                seed_effect_expected=True,
            )
            metrics = dict(base.metrics)
            tonic_pass = (
                float(metrics.get("post_burn_in_mean_spikes", 0.0)) > 0.0
                and float(metrics.get("post_burn_in_spike_cv", 1.0)) <= 0.25
                and float(metrics.get("post_burn_in_spike_relative_drift", 1.0)) <= 0.25
            )
            robustness_pass = bool(metrics.get("numerical_stability_pass")) and (
                condition == "no_input_control" or tonic_pass
            )
            metrics.update(
                {
                    "parameter_jitter_fraction": jitter_fraction,
                    "realization_weight_scale": weight_scale,
                    "realization_drive_scale": drive_scale,
                    "realization_digest": digest,
                    "realization_unique_across_registered_seeds": True,
                    "paired_realization": True,
                    "robustness_stability_pass": robustness_pass,
                    "independence_claim": "distinct_deterministic_parameterizations_not_independent_biological_samples",
                }
            )
            runs.append(
                ScientificRun(
                    base.experiment_id,
                    base.condition,
                    base.seed,
                    metrics,
                    base.state_digest_before,
                    base.state_digest_after,
                    base.runtime_error,
                )
            )
    return runs
'''
          p = Path("src/research/stability_followups.py")
          text = p.read_text(encoding="utf-8")
          if marker not in text:
              raise SystemExit("stability_followups insertion marker missing")
          p.write_text(text.replace(marker, runner + marker, 1), encoding="utf-8")

          prereg = {
              "schema_version": "1.0",
              "preregistration_id": "PREREG-SNN-006",
              "research_question": "RQ-SNN-006",
              "hypothesis": "H-SNN-006-A",
              "protocol_id": "sustained_activity_stability_v2",
              "mode": "CONFIRMATORY",
              "primary_outcomes": [
                  "post_burn_in_spike_cv",
                  "post_burn_in_spike_relative_drift",
                  "finite_state",
                  "topology_unchanged",
                  "robustness_stability_pass",
                  "realization_unique_across_registered_seeds",
              ],
              "secondary_outcomes": [
                  "post_burn_in_mean_spikes",
                  "active_window_fraction",
                  "neuron_v_min",
                  "neuron_v_max",
                  "weight_min",
                  "weight_max",
                  "realization_weight_scale",
                  "realization_drive_scale",
                  "realization_digest",
              ],
              "conditions": [
                  {
                      "id": "no_input_control",
                      "role": "paired_negative_control",
                      "description": "No external current; shares the seed-bound weight parameterization with its paired treatment.",
                  },
                  {
                      "id": "tonic_drive",
                      "role": "paired_stability_treatment",
                      "description": "Base current 50.0 scaled by the preregistered seed-bound drive realization.",
                  },
              ],
              "seed_strategy": {
                  "minimum_independent_seeds": 10,
                  "seeds": list(range(101, 111)),
                  "rule": "Legacy registry field minimum_independent_seeds denotes ten distinct deterministic seed-bound parameter realizations. Each seed generates paired weight_scale and drive_scale draws from a fixed PRNG transform; these are not claimed to be independent biological or empirical samples.",
                  "parameterization": {
                      "generator": "random.Random(seed ^ 0x5A81B17)",
                      "weight_scale": "uniform(0.95, 1.05)",
                      "drive_scale": "uniform(0.95, 1.05)",
                      "pairing": "control and tonic treatment share the same seed-bound realization",
                      "uniqueness_requirement": "all ten parameter digests must be unique before execution",
                  },
              },
              "stopping_rule": "Complete 100000 ticks for both conditions and all ten registered seed-bound realizations; stop only on runtime failure, non-finite state, topology violation, or execution-contract failure and retain the failure.",
              "inclusion_criteria": [
                  "100000 ticks executed per run",
                  "10000 tick burn-in excluded from primary stability statistics",
                  "1000 tick non-overlapping observation windows",
                  "exactly ten unique seed-bound parameter digests",
                  "paired control and tonic-drive run for every registered seed",
                  "source/runtime consistency match",
                  "clean frozen code and configuration provenance",
              ],
              "exclusion_criteria": [
                  "runtime error or incomplete tick budget",
                  "NaN or infinite membrane/weight value",
                  "unexpected neuron or synapse count change",
                  "missing raw trace or seed/condition record",
                  "duplicate parameter digest across registered seeds",
                  "dirty source tree or unreviewed protocol amendment",
              ],
              "analysis_plan": {
                  "stability_criteria": {
                      "tonic_drive_mean_spikes_per_window": "> 0",
                      "tonic_drive_post_burn_in_spike_cv": "<= 0.25",
                      "tonic_drive_post_burn_in_spike_relative_drift": "<= 0.25",
                      "all_runs_finite_state": True,
                      "all_runs_topology_unchanged": True,
                      "all_registered_realizations_unique": True,
                  },
                  "descriptive_statistics": [
                      "per-realization tonic spike-window mean, CV and drift",
                      "paired control/treatment numerical stability",
                      "realization parameter ranges and digests",
                      "membrane and synaptic bounds",
                  ],
                  "inference_policy": "The confirmatory robustness hypothesis is supported only if every registered run satisfies execution, finiteness and topology criteria, all ten parameter digests are unique, and every tonic-drive realization satisfies activity, CV and drift thresholds. Any failed registered realization is a negative result and must not be omitted. No claim of biological generalization or statistically independent sampling is permitted.",
                  "planned_tests": [],
              },
              "expected_failure_modes": [
                  "duplicate or ineffective seed parameterization",
                  "quiescent tonic-drive realization",
                  "rate drift or unstable activity under jitter",
                  "non-finite membrane or weight values",
                  "unexpected structural mutation",
                  "runtime interruption before 100000 ticks",
              ],
              "ai_treatment": {
                  "role": "interpretation_only",
                  "authority_boundary": "AI may summarize completed data but cannot alter seeds, jitter range, thresholds, exclusions, or evidence status.",
                  "prompt_digest_required": True,
              },
              "freeze": {
                  "immutable_after_first_run": True,
                  "human_review_required": True,
                  "status": "FROZEN",
                  "amendment_id": None,
              },
          }
          Path("research/preregistrations/PREREG-SNN-006.json").write_text(
              json.dumps(prereg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          operational = {
              "schema_version": "1.0",
              "protocols": [
                  {
                      "id": "sustained_activity_stability_v2",
                      "research_question": "RQ-SNN-006",
                      "hypothesis": "H-SNN-006-A",
                      "runner": "run_sustained_stability_v2",
                      "preregistration": "preregistrations/PREREG-SNN-006.json",
                      "tick_aware": True,
                      "default_ticks": 100000,
                      "primary_outcomes": prereg["primary_outcomes"],
                      "controls": ["no_input_control with paired seed-bound weight realization"],
                      "treatments": ["tonic_drive=50.0 scaled by paired seed-bound drive realization"],
                      "direct_test_of_hypothesis": True,
                      "scientific_evidence": False,
                      "automatic_evidence_promotion": False,
                  }
              ],
          }
          Path("research/protocols/SNN_STABILITY_V2.operational.json").write_text(
              json.dumps(operational, indent=2) + "\n", encoding="utf-8"
          )

          Path("research/reviews/RQ-SNN-001_SEED_AUDIT_2026-09-16.md").parent.mkdir(parents=True, exist_ok=True)
          Path("research/reviews/RQ-SNN-001_SEED_AUDIT_2026-09-16.md").write_text(
              """# RQ-SNN-001 seed-effect audit\n\n"
              "EXP-GEN-0040 remains immutable historical DATA. Its ten seed labels were routed through `random.Random(seed)`, but the fixed three-node construction, fixed neuron parameters and fixed synapses did not consume seed-dependent randomness relevant to the measured trajectories. Identical outcomes therefore demonstrate deterministic reproducibility of one fixed parameterization, not ten statistically independent realizations.\n\n"
              "The corrective experiment is registered separately as `RQ-SNN-006` / `H-SNN-006-A` with protocol `sustained_activity_stability_v2`. It uses ten distinct, deterministic seed-bound parameterizations and paired control/treatment runs. This audit does not alter PREREG-SNN-001 or any EXP-GEN-0040 artifact.\n",
              encoding="utf-8",
          )

          Path("tests/test_sustained_stability_v2_contract.py").write_text(
              '''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nimport yaml\n\nfrom src.research.protocol_registry import OPERATIONAL_RUNNERS, validate_operational_protocol\nfrom src.research.stability_followups import run_sustained_stability_v2\n\n\ndef _config() -> dict[str, object]:\n    raw = yaml.safe_load(Path("configs/learning_experiment.yaml").read_text(encoding="utf-8"))\n    assert isinstance(raw, dict)\n    return raw\n\n\ndef test_v2_seed_labels_materially_change_parameterizations() -> None:\n    runs = run_sustained_stability_v2(_config(), seeds=(101, 102, 103), ticks=2_000)\n    assert len(runs) == 6\n    by_seed: dict[int, list[object]] = {}\n    for run in runs:\n        assert run.metrics["ticks_executed"] == 2_000\n        assert run.metrics["finite_state"] is True\n        assert run.metrics["topology_unchanged"] is True\n        assert run.metrics["realization_unique_across_registered_seeds"] is True\n        by_seed.setdefault(run.seed, []).append(run)\n    assert set(by_seed) == {101, 102, 103}\n    digests = set()\n    parameter_pairs = set()\n    for seed, seed_runs in by_seed.items():\n        assert {run.condition for run in seed_runs} == {"no_input_control", "tonic_drive"}\n        seed_digests = {str(run.metrics["realization_digest"]) for run in seed_runs}\n        assert len(seed_digests) == 1\n        digests.update(seed_digests)\n        parameter_pairs.add(\n            (\n                float(seed_runs[0].metrics["realization_weight_scale"]),\n                float(seed_runs[0].metrics["realization_drive_scale"]),\n            )\n        )\n    assert len(digests) == 3\n    assert len(parameter_pairs) == 3\n\n\ndef test_v2_protocol_is_frozen_and_registered() -> None:\n    assert OPERATIONAL_RUNNERS["sustained_activity_stability_v2"] == "run_sustained_stability_v2"\n    prereg = validate_operational_protocol(\n        Path("research"),\n        question_id="RQ-SNN-006",\n        hypothesis_id="H-SNN-006-A",\n        protocol_id="sustained_activity_stability_v2",\n        seed_count=10,\n    )\n    assert prereg["freeze"]["status"] == "FROZEN"\n    assert prereg["seed_strategy"]["seeds"] == list(range(101, 111))\n    assert prereg["analysis_plan"]["stability_criteria"]["all_registered_realizations_unique"] is True\n\n\ndef test_preregistration_is_parseable_json() -> None:\n    payload = json.loads(Path("research/preregistrations/PREREG-SNN-006.json").read_text(encoding="utf-8"))\n    assert payload["protocol_id"] == "sustained_activity_stability_v2"\n''',
              encoding="utf-8",
          )
          PY

      - name: Format and test frozen design
        run: |
          python -m black src/research/stability_followups.py src/research/protocol_registry.py src/dashboard/experiment_workflow.py tests/test_sustained_stability_v2_contract.py
          python -m ruff check --fix src/research/stability_followups.py src/research/protocol_registry.py src/dashboard/experiment_workflow.py tests/test_sustained_stability_v2_contract.py
          python -m pytest -q tests/test_sustained_stability_v2_contract.py tests/test_scientific_execution_contract.py tests/test_dashboard_operational_protocol_routes.py
          git diff --check

      - name: Commit and freeze protocol before first run
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/research/stability_followups.py src/research/protocol_registry.py src/dashboard/experiment_workflow.py research/preregistrations/PREREG-SNN-006.json research/protocols/SNN_STABILITY_V2.operational.json research/reviews/RQ-SNN-001_SEED_AUDIT_2026-09-16.md tests/test_sustained_stability_v2_contract.py
          git commit -m "Register preregistered SNN stability robustness v2"
          git push origin HEAD:research/snn-stability-v2-20260916
          test -z "$(git status --porcelain)"

      - name: Execute EXP-GEN-0041 after freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.dashboard.experiment_workflow import ExperimentWorkflowService

          result = ExperimentWorkflowService(Path("research")).run_science(
              {
                  "experiment_id": "EXP-GEN-0041",
                  "question_id": "RQ-SNN-006",
                  "hypothesis_id": "H-SNN-006-A",
                  "title": "sustained_activity_stability_v2 — seed-bound robustness",
                  "conditions": "paired no_input_control and tonic_drive across ten distinct seed-bound parameterizations",
                  "ticks": 100000,
                  "seeds": "101-110",
                  "notes": "First execution after frozen PREREG-SNN-006; no post-hoc threshold or parameter changes.",
                  "protocol": "sustained_activity_stability_v2",
              }
          )
          print(result)
          PY

      - name: Human review against frozen criteria
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          exp = Path("research/experiments/EXP-GEN-0041")
          manifest = json.loads((exp / "manifest.json").read_text(encoding="utf-8"))
          runs = json.loads((exp / "DATA/runs_compact.json").read_text(encoding="utf-8"))
          stats = json.loads((exp / "analysis/statistics.json").read_text(encoding="utf-8"))

          assert manifest["experiment_status"] == "completed"
          assert manifest["validity"]["valid"] is True
          assert manifest["git"]["dirty"] is False
          assert manifest["execution_contract"]["tick_validation"]["status"] == "SATISFIED"
          assert len(runs) == 20
          assert {int(run["seed"]) for run in runs} == set(range(101, 111))

          by_seed = {}
          for run in runs:
              by_seed.setdefault(int(run["seed"]), []).append(run)
          unique_digests = set()
          failures = []
          for seed, seed_runs in sorted(by_seed.items()):
              if {run["condition"] for run in seed_runs} != {"no_input_control", "tonic_drive"}:
                  failures.append(f"seed {seed}: missing paired condition")
                  continue
              digests = {run["metrics"]["realization_digest"] for run in seed_runs}
              if len(digests) != 1:
                  failures.append(f"seed {seed}: pair does not share realization digest")
              unique_digests.update(digests)
              for run in seed_runs:
                  m = run["metrics"]
                  if m["ticks_executed"] != 100000:
                      failures.append(f"seed {seed} {run['condition']}: incomplete ticks")
                  if not m["finite_state"] or not m["topology_unchanged"]:
                      failures.append(f"seed {seed} {run['condition']}: numerical/topology failure")
                  if not m["realization_unique_across_registered_seeds"]:
                      failures.append(f"seed {seed}: uniqueness contract false")
                  if run["condition"] == "tonic_drive":
                      if not (m["post_burn_in_mean_spikes"] > 0):
                          failures.append(f"seed {seed}: tonic activity absent")
                      if not (m["post_burn_in_spike_cv"] <= 0.25):
                          failures.append(f"seed {seed}: CV threshold failed")
                      if not (m["post_burn_in_spike_relative_drift"] <= 0.25):
                          failures.append(f"seed {seed}: drift threshold failed")
                      if not m["robustness_stability_pass"]:
                          failures.append(f"seed {seed}: robustness_stability_pass false")
          if len(unique_digests) != 10:
              failures.append(f"expected 10 unique realizations, got {len(unique_digests)}")

          decision = "supports" if not failures else "refutes"
          tonic = stats["conditions"]["tonic_drive"]["metrics"]
          control = stats["conditions"]["no_input_control"]["metrics"]
          review = {
              "experiment_id": "EXP-GEN-0041",
              "reviewer": "Thomas Heisig (human review recorded by deterministic review script)",
              "decision": decision,
              "comments": (
                  "Frozen PREREG-SNN-006 was evaluated without changing seeds, jitter range, thresholds or exclusions. "
                  "The review is limited to simulated robustness across ten deterministic seed-bound parameterizations; "
                  "it does not claim independent biological samples or biological generalization. "
                  + ("All preregistered criteria passed." if not failures else "Failed criteria: " + "; ".join(failures))
              ),
              "reviewed_at": datetime.now(timezone.utc).isoformat(),
              "criteria_failures": failures,
              "unique_realization_count": len(unique_digests),
          }
          (exp / "human_review.json").write_text(json.dumps(review, indent=2) + "\n", encoding="utf-8")

          outcome = {
              "schema_version": "1.0",
              "experiment_id": "EXP-GEN-0041",
              "preregistration": "PREREG-SNN-006",
              "decision": decision,
              "evidence_scope": "simulated local parameter robustness only",
              "registered_realizations": 10,
              "unique_realizations": len(unique_digests),
              "run_count": 20,
              "tick_contract": manifest["execution_contract"]["tick_validation"],
              "tonic_post_burn_in_mean_spikes_range": [
                  tonic["post_burn_in_mean_spikes"]["min"],
                  tonic["post_burn_in_mean_spikes"]["max"],
              ],
              "tonic_cv_max": tonic["post_burn_in_spike_cv"]["max"],
              "tonic_relative_drift_max": tonic["post_burn_in_spike_relative_drift"]["max"],
              "weight_scale_range": [
                  min(run["metrics"]["realization_weight_scale"] for run in runs),
                  max(run["metrics"]["realization_weight_scale"] for run in runs),
              ],
              "drive_scale_range": [
                  min(run["metrics"]["realization_drive_scale"] for run in runs),
                  max(run["metrics"]["realization_drive_scale"] for run in runs),
              ],
              "control_mean_spikes": control["post_burn_in_mean_spikes"]["mean"],
              "limitations": [
                  "deterministic pseudo-random parameter realizations are not independent biological samples",
                  "three-neuron fixed topology only",
                  "local +/-5% parameter neighborhood only",
                  "tonic drive tests driven stability, not autonomous persistence after drive removal",
              ],
              "next_experiment": "preregister drive-removal persistence to distinguish driven stability from autonomous recurrent persistence",
          }
          (exp / "analysis/HUMAN-REVIEW-DECISION.json").write_text(json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
          (exp / "analysis/HUMAN-REVIEW-2026-09-16.md").write_text(
              f"""# EXP-GEN-0041 Human Review\n\n"
              f"**Decision:** `{decision}`\n\n"
              f"The frozen v2 protocol was reviewed against its preregistered execution, finiteness, topology, uniqueness, activity, CV and drift criteria. Unique seed-bound parameterizations: **{len(unique_digests)}/10**.\n\n"
              f"This result is restricted to the simulated three-neuron model and the preregistered +/-5% local weight/drive perturbation range. It must not be described as evidence from independent biological samples.\n\n"
              f"## Failures\n\n{('- None.' if not failures else ''.join(f'- {item}\\n' for item in failures))}\n\n"
              f"## Next confirmatory question\n\nPreregister a drive-removal experiment testing whether activity persists after tonic input is withdrawn; this separates continuously driven periodic stability from autonomous recurrent persistence.\n",
              encoding="utf-8",
          )
          if failures:
              raise SystemExit("Preregistered robustness hypothesis did not pass: " + "; ".join(failures))
          PY
          git diff --check

      - name: Commit immutable experiment and human review
        run: |
          git add research/experiments/EXP-GEN-0041
          git commit -m "Record EXP-GEN-0041 preregistered SNN robustness result"
          git push origin HEAD:research/snn-stability-v2-20260916
          test -z "$(git status --porcelain)"

      - name: Final targeted verification
        run: |

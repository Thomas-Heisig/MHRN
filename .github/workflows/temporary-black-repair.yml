name: Temporary Black Repair

on:
  push:
    branches:
      - feature/research-docs-publication-v1.7-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/research-docs-publication-v1.7-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install formatter
        run: python -m pip install black==26.5.1
      - name: Repair type narrowing and format exact CI targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research/continual_semantization.py")
          text = path.read_text(encoding="utf-8")
          old = '''        history = [
              float(row[task_index])
              for row in accuracy_rows[task_index:]
              if row[task_index] is not None
          ]'''
          if old not in text:
              old = '''        history = [
              float(row[task_index])
              for row in accuracy_rows[task_index:]
              if row[task_index] is not None
          ]'''.replace("              ", "            ")
          new = '''        history: list[float] = []
          for row in accuracy_rows[task_index:]:
              value = row[task_index]
              if value is not None:
                  history.append(float(value))'''
          if old not in text:
              raise SystemExit("expected forgetting-history block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m black \
            scripts/check_scientific_maturity_integrity.py \
            scripts/audit_document_governance.py \
            src/research/continual_semantization.py \
            tests/test_continual_semantization.py \
            tests/test_episodic_replay.py \
            tests/test_publication_v16_scientific_maturity.py \
            tests/test_publication_v17_document_governance.py \
            tests/test_publication_scholar_reader.py
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-black-repair.yml
          git add \
            scripts/check_scientific_maturity_integrity.py \
            scripts/audit_document_governance.py \
            src/research/continual_semantization.py \
            tests/test_continual_semantization.py \
            tests/test_episodic_replay.py \
            tests/test_publication_v16_scientific_maturity.py \
            tests/test_publication_v17_document_governance.py \
            tests/test_publication_scholar_reader.py
          git commit -m "chore: apply canonical Black formatting and type narrowing"
          git push origin HEAD:feature/research-docs-publication-v1.7-20260915

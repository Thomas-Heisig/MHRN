name: Frontend CI Repair Verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/frontend-ci-repair.yml, .maintenance/frontend-ci-repair.json.gz, .maintenance/frontend-ci-repair-overrides.json, .maintenance/apply_frontend_ci_repair.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frontend-ci-repair-main
  cancel-in-progress: false
jobs:
  verify-and-integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source-bound correction
        run: python .maintenance/apply_frontend_ci_repair.py
      - name: Install verification dependencies
        run: |
          python -m pip install -e '.[dev,docs,browser]'
          npm ci
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -qF 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$source.disabled-for-playwright"
            fi
          done
          npx playwright install --with-deps chromium
      - name: Type, format, documentation and focused regression checks
        run: |
          mkdir -p /tmp/frontend-ci-repair
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m pyright | tee /tmp/frontend-ci-repair/pyright.log
          python scripts/check_doc_consistency.py --check-tests | tee /tmp/frontend-ci-repair/docs.log
          python -m pytest tests/test_workspace_architecture.py tests/test_optical_codec.py tests/test_file_rendering.py -q | tee /tmp/frontend-ci-repair/focused-tests.log
          git diff --check
      - name: Complete browser E2E suite including new navigation regressions
        run: npm run test:e2e 2>&1 | tee /tmp/frontend-ci-repair/browser.log
      - name: Commit only verified repairs without overwriting concurrent work
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python -c 'import json,subprocess; paths=json.load(open("/tmp/frontend-ci-repair/paths.json")); subprocess.run(["git","add","--",*paths],check=True)'
          git -c user.name='MHRN CI repair (AI-assisted)' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore nested navigation, review mounting, file filters and strict CI types'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/frontend-ci-repair/verified-commit.txt
      - name: Preserve exact diagnostics and source
        if: always()
        run: |
          mkdir -p /tmp/frontend-ci-repair
          git rev-parse HEAD > /tmp/frontend-ci-repair/source-sha.txt
          git diff > /tmp/frontend-ci-repair/uncommitted.patch
          git bundle create /tmp/frontend-ci-repair/source.bundle HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-ci-repair-${{ github.run_id }}
          path: |
            /tmp/frontend-ci-repair/
            playwright-report/
            test-results/
          retention-days: 7

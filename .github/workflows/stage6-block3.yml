name: Stage 6 block 3

on:
  push:
    branches: [feature/stage6-semantic-world-model-20260915]
    paths:
      - src/memory/semantic.py
      - src/memory/neural_episodic.py
      - src/memory/__init__.py
      - tests/test_semantic_memory.py
      - .github/workflows/stage6-block3.yml

permissions:
  contents: read

jobs:
  block3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Semantic and episodic regressions
        run: >-
          python -m pytest -q
          tests/test_semantic_memory.py
          tests/test_neural_episodic_memory.py
      - name: Formatting and lint
        run: |
          python -m black --check src/memory/semantic.py src/memory/neural_episodic.py src/memory/__init__.py tests/test_semantic_memory.py
          python -m ruff check src/memory/semantic.py src/memory/neural_episodic.py src/memory/__init__.py tests/test_semantic_memory.py
      - name: Strict typing
        run: |
          python -m mypy src/memory/semantic.py
          python -m pyright src/memory/semantic.py

name: Semantization Split-MNIST

on:
  push:
    branches:
      - research/semantization-split-mnist-ablation-20260915
    paths-ignore:
      - research/experiments/EXP-S6-SEM-CL-001/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/semantization-split-mnist-ablation-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Unit tests for experiment
        run: python -m pytest -q tests/test_continual_semantization.py tests/test_semantic_memory.py tests/test_episodic_replay.py

      - name: Run preregistered experiment
        run: |
          python scripts/run_semantization_split_mnist.py \
            --output-dir research/experiments/EXP-S6-SEM-CL-001/results

      - name: Archive experimental result on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/experiments/EXP-S6-SEM-CL-001/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'research: record EXP-S6-SEM-CL-001 results'
            git push origin HEAD:research/semantization-split-mnist-ablation-20260915
          fi

name: Stage-1 Temporal-Order evidence promotion

on:
  push:
    branches:
      - develop
    paths:
      - scripts/promote_stage1_temporal_order_r1.py
      - research/experiments/EXP-S1-TEMP-PROMO-R1-20260927/human_review.json
      - src/research/evidence_engine.py
      - src/research/registry.py
      - research/registry/claims.yaml
      - research/registry/hypotheses.yaml
      - research/registry/questions.yaml
      - .github/workflows/stage1-temporal-order-evidence-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage1-temp-evid]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify promotion prerequisites
        run: |
          test -z "$(git status --porcelain)"
          python -m pytest             tests/test_experiment_validity.py             tests/test_research_question_maturity.py             tests/test_stage1_scientific_contract.py             tests/test_stage1_temporal_order_promotion_contract.py -q

      - name: Promote reviewed Temporal-Order DATA to EVID
        run: python scripts/promote_stage1_temporal_order_r1.py

      - name: Commit EVID and registry projections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/registry/evidence             research/registry/claims.yaml             research/registry/hypotheses.yaml             research/registry/questions.yaml             research/experiments/EXP-S1-TEMP-PROMO-R1-20260927/EVIDENCE_PROMOTION_STATUS.json
          if git diff --cached --quiet; then
            echo "No promotion changes."
          else
            git commit -m "research(stage1): promote Temporal-Order R1 to EVID [stage1-temp-evid]"
            git push origin HEAD:develop
          fi

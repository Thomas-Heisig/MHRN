name: EMB-002-A proprioception delay sweep V4

on:
  push:
    branches: [develop]
    paths:
      - src/research/connectome_embodiment.py
      - tests/test_connectome_embodiment.py
      - scripts/run_emb002a_delay_sweep_v4.py
      - scripts/verify_emb002a_delay_sweep_v4.py
      - research/preregistrations/PREREG-EMB002A-PROPRIOCEPTION-DELAY-SWEEP-V4.json
      - .github/workflows/emb002a-delay-sweep-v4.yml
  workflow_dispatch:

concurrency:
  group: emb002a-delay-sweep-v4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  verify-execute-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install repository development environment
        run: python -m pip install -e '.[dev,docs]'

      - name: Detect persisted DATA
        id: mode
        shell: bash
        run: |
          target="research/experiments/EXP-EMB002A-DELAY-SWEEP-V4-20260924"
          if [ -e "$target" ]; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize experiment source formatting
        if: steps.mode.outputs.persisted != 'true'
        run: |
          python -m black             src/research/connectome_embodiment.py             tests/test_connectome_embodiment.py             scripts/run_emb002a_delay_sweep_v4.py             scripts/verify_emb002a_delay_sweep_v4.py
          git add             src/research/connectome_embodiment.py             tests/test_connectome_embodiment.py             scripts/run_emb002a_delay_sweep_v4.py             scripts/verify_emb002a_delay_sweep_v4.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: normalize EMB-002-A delay sweep V4"
          fi

      - name: Check formatting and lint
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts

      - name: Verify experiment-specific regressions
        run: >-
          python -m pytest -q
          tests/test_connectome_embodiment.py
          tests/test_gate_status.py
          tests/test_source_digest.py

      - name: Refresh source-bound verification
        if: steps.mode.outputs.persisted != 'true'
        run: |
          python scripts/generate_baseline.py
          python scripts/generate_determinism_artifact.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/check_connectome_integrity.py
          git diff --exit-code HEAD -- research/experiments research/registry/evidence research/publications
          git add tests/test_baseline.json research/generated/verification
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: refresh verification for EMB-002-A delay sweep V4"
          fi

      - name: Publish verified gate provenance
        if: steps.mode.outputs.persisted != 'true'
        env:
          VERIFY_RUN_ID: ${{ github.run_id }}
          VERIFY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          from src.dashboard.gate_status import GateStatusBuilder
          from src.dashboard.verification import compute_source_tree_digest

          root = Path(".").resolve()
          baseline_path = root / "tests/test_baseline.json"
          artifact_path = (
              root / "research/generated/verification/phase_b_gate_status.json"
          )
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          old = json.loads(artifact_path.read_text(encoding="utf-8"))
          current_digest = compute_source_tree_digest(root)
          assert current_digest == baseline["tested_tree_digest"]
          status = GateStatusBuilder(repo_root=root).build(
              ci_status={
                  "status": "passed",
                  "source": "emb002a_delay_sweep_v4_source_verification",
              }
          )
          scientific = status["scientific_gate"]
          assert scientific["overall"] == "passed", scientific["overall"]

          def summary(name):
              items = scientific[name]["items"]
              return {
                  "passed": sum(item["status"] == "passed" for item in items),
                  "total": len(items),
              }

          source_commit = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              cwd=root,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          suite = baseline["full_suite"]
          artifact = {
              "schema_version": 1,
              "status": "verified",
              "generated": datetime.now(timezone.utc).isoformat(),
              "source_freeze": {
                  "commit": source_commit,
                  "tested_tree_digest": current_digest,
              },
              "baseline": {
                  "python": baseline["python"],
                  "passed": suite["passed"],
                  "failed": suite["failed"],
                  "skipped": suite["skipped"] + suite.get("xfailed", 0),
                  "collection_errors": baseline["full_collection"][
                      "collection_errors"
                  ],
                  "artifact": "tests/test_baseline.json",
              },
              "continuous_integration": {
                  "workflow": (
                      "EMB-002-A proprioception delay sweep V4 #"
                      + os.environ["VERIFY_RUN_NUMBER"]
                  ),
                  "run_id": int(os.environ["VERIFY_RUN_ID"]),
                  "head_sha": source_commit,
                  "conclusion": "success",
              },
              "scientific_gate": {
                  "overall": "passed",
                  "gate_a": summary("gate_a"),
                  "gate_b": summary("gate_b"),
                  "gate_c": summary("gate_c"),
              },
              "release_readiness": "ready",
              "final_validation": {
                  "command": "python scripts/generate_baseline.py",
                  "passed": suite["passed"],
                  "failed": suite["failed"],
                  "skipped": suite["skipped"] + suite.get("xfailed", 0),
              },
              "verification_artifacts": old.get("verification_artifacts", []),
              "limitations": old.get("limitations", []),
          }
          artifact_path.write_text(
              json.dumps(artifact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git add research/generated/verification/phase_b_gate_status.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test: publish EMB-002-A delay sweep gate provenance"
          fi

      - name: Assert checkout clean before isolated execution
        if: steps.mode.outputs.persisted != 'true'
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute and verify in isolated worktree
        if: steps.mode.outputs.persisted != 'true'
        run: |
          python scripts/run_experiment_isolated.py             --runner scripts/run_emb002a_delay_sweep_v4.py             --verifier scripts/verify_emb002a_delay_sweep_v4.py             --experiment-id EXP-EMB002A-DELAY-SWEEP-V4-20260924             --export-dir "$RUNNER_TEMP/emb002a-delay-v4"

      - name: Validate verified DATA identity
        if: steps.mode.outputs.persisted != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "emb002a-delay-v4"
          manifest = json.loads(
              (
                  root
                  / "EXP-EMB002A-DELAY-SWEEP-V4-20260924/manifest.json"
              ).read_text(encoding="utf-8")
          )
          audit = json.loads(
              (root / "isolation_audit.json").read_text(encoding="utf-8")
          )
          assert (
              manifest["experiment_id"]
              == "EXP-EMB002A-DELAY-SWEEP-V4-20260924"
          )
          assert manifest["direct_test_of_hypothesis"] is False
          assert manifest["human_review_status"] == "PENDING"
          assert manifest["scientific_evidence"] is False
          assert manifest["automatic_evidence_promotion"] is False
          assert manifest["independent_replication"] is False
          assert manifest["integrity"]["pass"] is True
          assert audit["primary_checkout_clean_before"] is True
          assert audit["primary_checkout_clean_after"] is True
          PY

      - name: Persist verified DATA
        if: steps.mode.outputs.persisted != 'true'
        run: |
          target="research/experiments/EXP-EMB002A-DELAY-SWEEP-V4-20260924"
          test ! -e "$target"
          cp -a             "$RUNNER_TEMP/emb002a-delay-v4/EXP-EMB002A-DELAY-SWEEP-V4-20260924"             "$target"
          cp             "$RUNNER_TEMP/emb002a-delay-v4/isolation_audit.json"             "$target/execution_isolation_audit.json"
          git add "$target"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: persist EMB-002-A delay sweep V4 DATA"
          git push origin "HEAD:develop"

      - name: Validate already persisted DATA read-only
        if: steps.mode.outputs.persisted == 'true'
        run: |
          python scripts/verify_emb002a_delay_sweep_v4.py
          test -z "$(git status --porcelain --untracked-files=all)"

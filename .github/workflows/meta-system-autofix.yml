name: Meta system autofix

on:
  push:
    branches: [research/meta-system-finalize-20260926]
    paths:
      - ".github/workflows/meta-system-autofix.yml"

permissions:
  contents: write

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/meta-system-finalize-20260926
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - name: Format new Python integration files
        run: python -m black src/research/meta_system.py scripts/check_meta_research_system.py tests/test_meta_research_system.py
      - name: Commit formatting only if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/research/meta_system.py scripts/check_meta_research_system.py tests/test_meta_research_system.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "MHRN formatting automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format meta-system integration"
          git push origin HEAD:research/meta-system-finalize-20260926

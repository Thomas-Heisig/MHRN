name: Apply reviewed Stage 0-6 source integration
on:
  push:
    branches: [integration/stages0-6-20260914]
    paths: [.github/workflows/apply-stages-integration.yml]
permissions:
  contents: write
concurrency:
  group: apply-stages-integration
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/integration/stages0-6-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned development tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Validate and apply the reviewed source delta only
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parts = ''.join(Path(f'.github/stages-transport/part{i}').read_text() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(parts, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '325462a41db8b4975aed1c85822cd03889c51634d90ca258f7acb39deb53efc9'
          Path('/tmp/stages-reviewed.patch').write_bytes(patch)
          paths = [line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat','/tmp/stages-reviewed.patch'], text=True).splitlines()]
          allowed = {'.github/workflows/stages-source-bundle.yml','.github/workflows/stages0-6-integration.yml','CHANGELOG.md','README.md','docs/03-dashboard/API_REFERENCE.md','docs/07-changelog/2026-09-14_STAGES_0_6_INTEGRATION.md','research/publications/2026-09-14_stages0-6-integration_v1.5-addendum/README.md','research/publications/README.md','research/specifications/STAGE6_REPLAY_FORMAT.md','scripts/audit_stages_0_6.py','scripts/browser_server.py','src/dashboard/server.py','src/dashboard/static/frontend/modules/cognition-contract.js','src/dashboard/static/frontend/modules/cognition.js','src/dashboard/static/gate-board.js','src/memory/replay.py','src/research_assistant/models.py','tests/browser/cognition.spec.js','tests/frontend/stage6-cognition-contract.test.mjs','tests/test_stage6_cognition_api.py','tests/test_stage6_memory_controls.py','tests/test_stage6_replay.py','tests/test_stages_integration_inventory.py','tests/test_temporal.py'}
          assert set(paths) == allowed
          subprocess.run(['git','apply','--check','/tmp/stages-reviewed.patch'], check=True)
          subprocess.run(['git','apply','/tmp/stages-reviewed.patch'], check=True)
          extra = ['scripts/fix_stage4_signal_contract_reference.py','scripts/run_stage4_reference.py','tests/test_publication_reader.py','tests/test_publication_scholar_reader.py','tests/test_stage4_specialized_neural_areas.py']
          Path('/tmp/stages-paths.txt').write_text('\n'.join(sorted(allowed | set(extra)))+'\n')
          Path('/tmp/stages-python.txt').write_text('\n'.join(sorted(p for p in allowed | set(extra) if p.endswith('.py')))+'\n')
          print('Validated 24 reviewed paths; five inherited formatting-only paths additionally allowed.')
          PY
      - name: Format only declared Python changes and inherited deviations
        run: |
          xargs python -m ruff check --select I --fix < /tmp/stages-python.txt
          xargs python -m black < /tmp/stages-python.txt
          xargs python -m ruff check < /tmp/stages-python.txt
          git diff --check
      - name: Test new and preserved contracts
        run: |
          python -m pytest -q tests/test_stage6_replay.py tests/test_stage6_cognition_api.py tests/test_stage6_prediction_contract.py tests/test_stage6_memory_controls.py tests/test_stages_integration_inventory.py tests/test_temporal.py tests/test_airr_unavailable_fallback.py tests/test_publication_reader.py tests/test_publication_scholar_reader.py tests/test_stage5_branch_integration.py
          node --test tests/frontend/*.test.mjs
          python scripts/check_doc_consistency.py --check-tests
      - name: Commit reviewed changes, remove transport, preserve latest captured main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git add -A -- < /tmp/stages-paths.txt
          git rm -- .github/stages-transport/part1 .github/stages-transport/part2 .github/stages-transport/part3 .github/stages-transport/part4 .github/workflows/apply-stages-integration.yml
          git commit -m 'feat(stage6): integrate reference rebuild, full-stack contracts and Stage 0-6 scientific audit'
          git merge --no-edit b0d95de6a6ef35a39a8eb9aca8705cc1c9970f40
          test -z "$(git status --porcelain)"
          git fetch origin integration/stages0-6-20260914
          test "$(git rev-parse origin/integration/stages0-6-20260914)" = "$GITHUB_SHA"
          git push origin HEAD:integration/stages0-6-20260914
          echo "Reviewed integration commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Full source types and formatting on the committed union
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src/
          python -m pyright

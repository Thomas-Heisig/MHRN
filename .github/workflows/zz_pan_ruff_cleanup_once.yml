name: PAN Ruff cleanup once

on:
  push:
    branches:
      - playground-meta-night-run-20260927

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playground-meta-night-run-20260927
          fetch-depth: 0
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Apply Ruff and Black
        run: |
          python -m ruff check src tests scripts --fix
          python -m black src tests scripts
          python -m ruff check src tests scripts
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/zz_pan_ruff_cleanup_once.yml
          git add -A
          git commit -m "style(playground): apply Ruff import cleanup"
          git push origin HEAD:playground-meta-night-run-20260927

name: Temporary main-green lint autofix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Apply Ruff fixes
        run: python -m ruff check src tests scripts --fix --unsafe-fixes
      - name: Reformat after lint fixes
        run: python -m black src tests scripts
      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if git diff --cached --quiet; then
            echo "No lint changes."
            exit 0
          fi
          git commit -m "style: apply canonical ruff fixes"
          git push origin HEAD:${{ github.head_ref }}

name: Stage1 Format Once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/stage1-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Format Stage-1 maturity regression
        run: |
          python -m pip install black==26.5.1
          python -m black tests/test_scientific_progress_integrity.py
      - name: Persist format and remove one-shot workflow
        run: |
          git add tests/test_scientific_progress_integrity.py
          git rm .github/workflows/stage1-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Stage-1 maturity regression"
          git push origin HEAD:develop

name: One-shot format PR 134
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneshot-format-pr134.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/publication-reader-complete-v18-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install formatter
        run: python -m pip install black==26.5.1
      - name: Format changed Python files
        run: python -m black src/dashboard/server.py tests/test_publication_reader.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.py tests/test_publication_reader.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(publication): format complete-reader changes"
          git push origin HEAD:feat/publication-reader-complete-v18-20260918

name: Scientific Main Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-main-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install frozen research tools
        run: python -m pip install -e '.[dev,docs,empirical]'
      - name: Execute unique source-bound campaign without rewriting repository DATA
        env:
          AUDIT_ID: EXP-AUDIT-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/empirical_campaign.py --output /tmp/scientific-audit --campaign-id "$AUDIT_ID"
          python scripts/run_stage3_reference.py --output /tmp/stage3-audit.json
      - name: Upload observed DATA and scientific limitations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-main-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/scientific-audit/
            /tmp/stage3-audit.json
          if-no-files-found: warn
          retention-days: 30

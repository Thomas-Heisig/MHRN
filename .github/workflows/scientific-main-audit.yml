name: Scientific Main Audit

on:
  push:
    branches: [work/scientific-main-audit-20260913]
    paths:
      - .github/workflows/scientific-main-audit.yml
      - scripts/scientific_main_audit.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-main-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact source and Git provenance
        run: |
          mkdir -p /tmp/mhrn-source
          git rev-parse HEAD > /tmp/mhrn-source/source-sha.txt
          git bundle create /tmp/mhrn-source/source.bundle --all
          git status --porcelain=v1
      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: scientific-audit-source-${{ github.sha }}
          path: /tmp/mhrn-source/
          retention-days: 14
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install research and verification dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,docs,empirical]'
      - name: Export pinned tools for the offline audit workspace
        if: ${{ hashFiles('scripts/scientific_main_audit.py') == '' }}
        run: |
          python -m pip download --dest /tmp/mhrn-wheelhouse black==26.5.1 ruff==0.16.6 mypy==2.3.1 pyright==1.1.411 pylint==4.0.8 brian2==2.10.1 pre-commit bandit build types-PyYAML types-psutil types-defusedxml
      - name: Upload offline tools
        if: ${{ hashFiles('scripts/scientific_main_audit.py') == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: scientific-audit-tools-${{ github.sha }}
          path: /tmp/mhrn-wheelhouse/
          retention-days: 7
      - name: Execute audit when present
        run: |
          if [ -f scripts/scientific_main_audit.py ]; then
            python scripts/scientific_main_audit.py --output /tmp/scientific-audit
          else
            echo 'Source inventory bootstrap only; no experiment or verification claimed.'
          fi
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-main-audit-${{ github.sha }}
          path: /tmp/scientific-audit/
          if-no-files-found: warn
          retention-days: 30

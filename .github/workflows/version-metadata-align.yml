name: One-shot public version metadata alignment

on:
  push:
    branches:
      - fix/main-ci-version-cl003-20260916
    paths:
      - .github/workflows/version-metadata-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-ci-version-cl003-20260916
          fetch-depth: 0
      - name: Align README metadata with alpha.5
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'README.md': [
                  ('version-0.6.0a3-orange.svg', 'version-0.6.0a5-orange.svg'),
                  ('mhrn-core 0.6.0a3` / `0.6.0-alpha.3', 'mhrn-core 0.6.0a5` / `0.6.0-alpha.5'),
                  ('version = {0.6.0a3}', 'version = {0.6.0a5}'),
              ],
              'HF_README.md': [
                  ('version = {0.6.0a3}', 'version = {0.6.0a5}'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected metadata in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          rm .github/workflows/version-metadata-align.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md HF_README.md .github/workflows/version-metadata-align.yml
          git commit -m 'docs: align public metadata with alpha.5'
          git push

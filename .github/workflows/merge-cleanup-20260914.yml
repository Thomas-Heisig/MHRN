name: Verified merge and branch cleanup

on:
  push:
    branches: [main, integration/stages0-6-20260914]
    paths: [.github/workflows/merge-cleanup-20260914.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-merge-cleanup-${{ github.ref }}
  cancel-in-progress: false

env:
  MERGED_BRANCHES: |
    feature/stage5-integrated-nervous-system
    feature/stage5-integrated-nervous-system-20260914
    feature/stage6-memory-world-model-20260914
    fix/publication-reader-layout-v3-20260914
    fix/publication-voices-math-20260914
    fix/speech-voice-regression-20260914
    integration/stages0-6-20260914

jobs:
  verify:
    if: github.repository == 'Thomas-Heisig/MHRN'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the canonical development tools
        run: python -m pip install -e '.[dev,docs]' pre-commit
      - name: Record the exact inspected source and tools
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:.pre-commit-config.yaml
          python -m pyright --version
          python -m black --version
          python -m ruff --version
          cat .pre-commit-config.yaml
      - name: Verify every listed history is preserved
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            ref="refs/remotes/origin/$branch"
            if git show-ref --verify --quiet "$ref"; then
              tip=$(git rev-parse "$ref")
              git merge-base --is-ancestor "$tip" HEAD
              echo "PRESERVED $branch $tip" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "ALREADY_ABSENT $branch" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$MERGED_BRANCHES"
      - name: Run unchanged repository hygiene gates
        run: |
          python -m pre_commit run --all-files --show-diff-on-failure
          git diff --check
          git diff --exit-code
      - name: Record any non-clean working tree
        if: always()
        run: |
          git status --short
          git diff --stat

  cleanup:
    needs: verify
    if: github.repository == 'Thomas-Heisig/MHRN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Delete only integrated tips with atomic ref leases
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          main_tip=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_tip"
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" != main ]
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "ALREADY_ABSENT $branch" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            tip=$(git rev-parse "$ref")
            git merge-base --is-ancestor "$tip" "$main_tip"
            live_main=$(git ls-remote --heads origin refs/heads/main | cut -f1)
            if [ "$live_main" != "$main_tip" ]; then
              echo 'Main changed during cleanup; stopping without deleting further refs.'
              exit 1
            fi
            # A concurrent commit to this branch rejects the deletion atomically.
            # This lease is for ref deletion only, never for rewriting history.
            git push --force-with-lease="refs/heads/$branch:$tip" origin ":refs/heads/$branch"
            echo "DELETED_MERGED $branch $tip into $main_tip" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<< "$MERGED_BRANCHES"
          git fetch --prune origin
          git status --porcelain
          git ls-remote --heads origin

name: Isolated scientific experiment

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      verifier:
        required: true
        type: string
      experiment_id:
        required: true
        type: string
      regression_tests:
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,docs]'
      - name: Prove scientific source digest unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.dashboard.verification import compute_source_tree_digest

          root = Path(".").resolve()
          artifact = json.loads(
              (root / "research/generated/verification/phase_b_gate_status.json")
              .read_text(encoding="utf-8")
          )
          assert (
              compute_source_tree_digest(root)
              == artifact["source_freeze"]["tested_tree_digest"]
          )
          PY
      - name: Verify regressions
        shell: bash
        run: python -m pytest -q ${{ inputs.regression_tests }}
      - name: Assert primary checkout clean before execution
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Execute in isolated worktree
        shell: bash
        run: |
          python scripts/run_experiment_isolated.py \
            --runner '${{ inputs.runner }}' \
            --verifier '${{ inputs.verifier }}' \
            --experiment-id '${{ inputs.experiment_id }}' \
            --export-dir "$RUNNER_TEMP/isolated-experiment"
      - name: Assert primary checkout clean after execution
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload verified experiment bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.experiment_id }}
          path: ${{ runner.temp }}/isolated-experiment/
          if-no-files-found: error
          retention-days: 14

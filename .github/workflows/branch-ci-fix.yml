name: Branch CI Fix

on:
  push:
    branches:
      - fix/neural-primitives-fullstack
    paths:
      - .github/workflows/branch-ci-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/neural-primitives-fullstack
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply bounded server typing patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dashboard/server.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'found, value = get_config_value(config_path, key)': 'found, current_value = get_config_value(config_path, key)',
              '"value": value if found else None,': '"value": cast(JSONValue, current_value) if found else None,',
              'value: object = value_str': 'parsed_value: object = value_str',
              'value = True\n                    elif value_str.lower() == "false":\n                        value = False': 'parsed_value = True\n                    elif value_str.lower() == "false":\n                        parsed_value = False',
              'value = int(value_str)': 'parsed_value = int(value_str)',
              'value = float(value_str)': 'parsed_value = float(value_str)',
              'value = json.loads(value_str)': 'parsed_value = json.loads(value_str)',
              'success, message = apply_config_change(config_path, key, value)': 'success, message = apply_config_change(config_path, key, parsed_value)',
              '"value": value,\n                            "success": success,': '"value": cast(JSONValue, parsed_value),\n                            "success": success,',
              '"config_results": config_results,': '"config_results": cast(JSONValue, config_results),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected server snippet: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install pinned checks
        run: python -m pip install black==26.5.1 ruff==0.16.6
      - name: Format and lint touched Python
        run: |
          python -m black src/dashboard/server.py src/research_assistant/config_tool.py scripts/browser_check.py
          python -m ruff check --fix src/dashboard/server.py src/research_assistant/config_tool.py scripts/browser_check.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.py src/research_assistant/config_tool.py scripts/browser_check.py
          git commit -m "fix: clear integration lint type and browser gates"
          git push origin HEAD:fix/neural-primitives-fullstack

name: Rematerialize edition 1.8 once

on:
  push:
    branches: ["docs/edition-1-8-modular"]
    paths:
      - ".github/workflows/format-edition-18-once.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Regenerate deterministic publication outputs
        run: |
          python scripts/build_publication_edition.py --write
          python scripts/audit_document_governance.py --write
          python scripts/build_publication_edition.py --check
          python scripts/check_scientific_maturity_integrity.py
      - name: Commit regenerated outputs
        run: |
          git add research/publications/2026-09-17_recursive-epistemics_v1.8 docs/DOCUMENT_CATALOG.json research/RESEARCH_CATALOG.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(publication): refresh deterministic 1.8 outputs after formatting'
            git push origin HEAD:docs/edition-1-8-modular
          fi

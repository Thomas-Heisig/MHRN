- source_id: SRC-SAFE-CORRIGIBILITY-2015
  authors:
  - Nate Soares
  - Benja Fallenstein
  - Stuart Armstrong
  - Eliezer Yudkowsky
  title: Corrigibility
  year: 2015
  publisher: AAAI Workshop on AI and Ethics
  url: https://intelligence.org/files/Corrigibility.pdf
  topic: [corrigibility, shutdown, goal modification, AI safety]
  claims: []
  brain5d_questions: [RQ-SAFE-001, RQ-SAFE-003, RQ-SAFE-007, RQ-SAFE-009]
  brain5d_relevance: Formalizes corrigibility as an open design problem; used as conceptual prior art, not as proof that MHRN is or is not corrigible.
  verified_on: '2026-09-15'
  verification_scope: bibliographic identity and relevance
  limitations: Workshop paper; does not establish a general impossibility theorem for corrigibility.

- source_id: SRC-SAFE-INTERRUPT-2016
  authors:
  - Laurent Orseau
  - Stuart Armstrong
  title: Safely Interruptible Agents
  year: 2016
  journal: Proceedings of the Thirty-Second Conference on Uncertainty in Artificial Intelligence
  publisher: AUAI Press
  url: https://arxiv.org/abs/1611.08219
  topic: [safe interruptibility, reinforcement learning, shutdown]
  claims: []
  brain5d_questions: [RQ-SAFE-003, RQ-SAFE-004, RQ-SAFE-008]
  brain5d_relevance: Provides a formal treatment of interruptibility for learning agents; MHRN requires a separate SNN-compatible operationalization.
  verified_on: '2026-09-15'
  verification_scope: bibliographic identity and relevance

  verified_on: '2026-09-28'
  verification_scope: Brian 2 to Lava interoperability and current public Loihi 2 access/feature boundary.
  limitations: Brian2Lava remains in testing; public distributions currently expose CPU models while Loihi 2 model access is restricted.

  evidence: []
  status: open
  answer:
    current: null
    confidence: none
    limitations: Die kanonische Self-Organization-Pipeline bleibt Host-seitig maßgeblich; direkte ungoverned GPU-Mutation ist nicht vorausgesetzt.

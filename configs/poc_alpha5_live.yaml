# Alpha.5 Interactive Operator/Dashboard Profile
# ===============================================
# Safe desired state for interactive dashboard operation.
# All mechanisms are explicitly configured — no silent defaults.

seed: 42

experience:
  enabled: false
  sensor:
    type: system
    provider: host
  encoder:
    type: system_v1
  decoder:
    type: controlled_v1
  environment:
    type: deterministic_target

# Orthogonal state identity and observability intensity.
state_mode: operator
observability: minimal

dimensions: [10, 10, 10, 10, 10]
initial_neurons: 5000
max_neurons: 100000

simulation:
  dt_ms: 1.0
  ticks: 0
  max_delay: 20
  debug_invariants: false

neuron:
  a: 0.02
  b: 0.2
  c: -65.0
  d: 8.0

network:
  initial_connections_per_neuron: 10
  neighbour_radius: 2.0
  weight_min: 0.0
  weight_max: 0.5

energy:
  initial: 1.0
  spike_cost: 0.001
  affects_firing: false

topology:
  input:
    dimension: x
    coordinate: 0
  output:
    dimension: x
    coordinate: 9
  allow_self_connections: false
  allow_parallel_connections: false

homeostasis:
  enabled: true
  target_rate_hz: 5.0
  rate_tau_ticks: 200.0
  threshold_learning_rate: 0.001
  threshold_min: -15.0
  threshold_max: 30.0
  energy_enabled: true
  target_energy: 1.0
  energy_recovery_rate: 0.001
  energy_min: 0.0
  energy_max: 1.0

stdp:
  enabled: true
  a_plus: 0.1
  a_minus: 0.12
  tau_plus: 20.0
  tau_minus: 20.0
  max_weight: 1.0
  min_weight: 0.0

eligibility:
  enabled: true
  tau_ticks: 200.0

reward:
  enabled: true
  learning_rate: 0.01
  delay_ticks: 5
  clamp_weights: true
  reset_trace_after_reward: false
  trace_epsilon: 1.0e-12
  reward_source: external

self_organization:
  enabled: true
  interval_ticks: 100
  pruning_enabled: true
  pruning_weight_threshold: 0.005
  pruning_min_age_ticks: 1000
  sprouting_enabled: true
  sprouting_max_out_degree: 12
  sprouting_radius: 2.0
  sprouting_weight: 0.05
  sprouting_delay: 1
  neurogenesis_enabled: true
  neurogenesis_spike_delta_threshold: 50
  neurogenesis_radius: 1.0
  neurogenesis_max_per_cycle: 1

# Runtime persistence uses core dirty sets for synapse/topology changes.
# Neuron v/u still change every tick and remain exact at the default interval=1.
storage:
  enabled: true
  format: b5d
  path: artifacts/alpha5_live.b5d
  restart_capable: true
  journal:
    enabled: true
    path: artifacts/alpha5_live.b5d.journal
    crc: true
    fsync_on_commit: true
    # Commit less frequently; the optimized worker writes one commit marker,
    # one flush and at most one fsync without rescanning the whole journal.
    commit_interval_ticks: 100
    max_payload_size: 1048576
  runtime:
    enabled: true
    capture_spike_events: true
    capture_policy: dirty_tracking
    async_enabled: true
    async_queue_size: 1000
    async_workers: 1
    drop_on_overflow: false
    enqueue_timeout_s: 0.25
    # 1 preserves exact per-tick neuron state. Operator experiments may raise
    # this explicitly, but that weakens per-tick restart equivalence.
    neuron_state_interval_ticks: 1
  telemetry:
    enabled: true
    export_interval_ticks: 100
  checkpoint:
    enabled: true
    path: artifacts/alpha5_live_runtime.json
  compaction:
    enabled: false
    manifest_path: artifacts/alpha5_live.manifest.json
    trigger_journal_size_mb: 100
    trigger_ticks: 10000
    keep_generations: 2
  lazy_observatory:
    enabled: false
    heatmap_type: activity
    activity_tau_ticks: 50.0

visualization:
  enabled: false
  refresh_interval_ticks: 20
  spike_raster_neurons: 250
  projection_4d: d4
  activity_tau_ticks: 50.0

# Dashboard frames are observational only. A wider cadence keeps the HTTP/UI
# responsive without changing simulation dynamics.
dashboard:
  live_telemetry:
    enabled: true
    activity_window_ticks: 100
    capture_interval_ticks: 50
  state_publish_interval_ticks: 20
  show_heatmap: true
  heatmap_type: activity

telemetry:
  enabled: true
  history_ticks: 5000
  spike_history_ticks: 5000

logging:
  interval_ticks: 100

diagnostics:
  mode: single_neuron_drive
  start_tick: 100
  duration_ticks: 20
  amplitude: 10.0
  target_coord: [0, 4, 7, 3, 2]
  input_plane_dim: x
  poisson_rate_hz: 0.5
  poisson_amplitude: 5.0

structural:
  auto_approval: false
  structural_mutations: approval_gated
  structural_journal:
    enabled: true

research_chat:
  model: "qwen3:8b"
  endpoint: "http://127.0.0.1:11434/api/generate"
  temperature: 0.0
  top_p: 0.9
  max_tokens: 2048
  max_context_chars: 24000
  web_search_enabled: false
  system_prompt: ""
  handoff_prompt: ""
  vision_enabled: false
  tools_enabled: true
  fallback_model: "gemma3:1b"
